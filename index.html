    const base=await pushUrl();if(!base||!pushToken())return;
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      // on essaie de réabonner sans rien demander ; si l'iPhone exige un toucher, on affiche une carte
      try{const {pub}=await (await fetch(base+"/api/key",{cache:"no-store"})).json();sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(pub)});}catch(_){sub=null;}
    }

    const ep=sub.endpoint,last=+(lsGet("a2.pushSync")||0);
    // le serveur garde l'adresse de ce téléphone : on la lui redonne une fois par jour, ou dès qu'elle change
    if(lsGet("a2.pushEp")!==ep||Date.now()-last>864e5){
      const r=await pushPost("/api/sub",{uid:myId,sub:sub.toJSON()});
      if(r){lsSet("a2.pushEp",ep);lsSet("a2.pushSync",String(Date.now()));}
    }
  }catch(_){}
}

async function getJson(url,signal,ms=7000,opts){

  if(signal){if(signal.aborted)ctl.abort();else signal.addEventListener("abort",()=>ctl.abort());}
  try{const r=await fetch(url,{...(opts||{}),signal:ctl.signal,headers:{Accept:"application/json",...((opts&&opts.headers)||{})}});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}

const geoCache=new Map();
function rememberGeo(label,lat,lon){if(label&&Number.isFinite(+lat)&&Number.isFinite(+lon))geoCache.set(norm(label),{lat:+lat,lon:+lon,label});}
function featLabel(f){const p=f.properties||{};const city=[p.postcode,p.city].filter(Boolean).join(" ");if(p.type==="municipality")return p.label;return p.name&&city?p.name+", "+city:p.label;}
let homeGeo=null;
async function homeCoords(){
  const h=homeAddr();if(!h)return null;
  const p=defaultHome();if(p&&p.lat)return {lat:p.lat,lon:p.lon};
  if(homeGeo&&homeGeo.addr===h)return homeGeo;
  const r=await searchAddresses(h,null,null).catch(()=>[]);
  if(r.length){homeGeo={lat:r[0].lat,lon:r[0].lon,addr:h};return homeGeo;}
  return null;
}
async function searchAddresses(q,signal,near){
  q=String(q||"").trim();if(q.length<3)return [];
  if(near===undefined) near=await homeCoords().catch(()=>null);
  const bias=near?`&lat=${near.lat}&lon=${near.lon}`:"";const enc=encodeURIComponent(q);
  const a=getJson(`${GEO}/search?q=${enc}&limit=5&autocomplete=1${bias}`,signal)
    .catch(()=>getJson(`${BAN}/search/?q=${enc}&limit=5&autocomplete=1${bias}`,signal))
    .then(j=>(j.features||[]).map(f=>({address:featLabel(f),name:"",lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}))).catch(()=>[]);
  const p=getJson(`${GEO}/completion?text=${enc}&type=PositionOfInterest&maximumResponses=4${near?`&lonlat=${near.lon},${near.lat}`:""}`,signal)
    .then(j=>(j.results||[]).filter(r=>r.kind!=="street"&&r.fulltext).map(r=>({address:r.fulltext,name:"",lat:r.y,lon:r.x}))).catch(()=>[]);
  const [x,y]=await Promise.all([a,p]);
  const seen=new Set();
  const out=[...x,...y].filter(r=>{const k=norm(r.address);if(!r.address||!Number.isFinite(r.lat)||seen.has(k))return false;seen.add(k);return true;}).slice(0,7);
  out.forEach(r=>rememberGeo(r.address,r.lat,r.lon));
  return out;
}
async function geocode(text){
  const k=norm(text);if(!k)return null;
  if(geoCache.has(k))return geoCache.get(k);
  const p=placeFor(text);if(p&&p.lat){rememberGeo(p.address,p.lat,p.lon);return geoCache.get(k);}
  const r=await searchAddresses(text);
  if(!r.length)return null;
  const g={lat:r[0].lat,lon:r[0].lon,label:r[0].address};geoCache.set(k,g);return g;
}
function decodePolyline(str){
  const pts=[];let i=0,lat=0,lng=0;
  while(str&&i<str.length){
    let b,shift=0,res=0;do{b=str.charCodeAt(i++)-63;res|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);lat+=res&1?~(res>>1):res>>1;
    shift=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);lng+=res&1?~(res>>1):res>>1;
    pts.push({lat:lat/1e5,lon:lng/1e5});
  }

}
function thin(pts,max){if(pts.length<=max)return pts;const step=(pts.length-1)/(max-1);const out=[];for(let i=0;i<max;i++)out.push(pts[Math.round(i*step)]);return out;}

async function computeTrip(from,to,mode,arriveAt){
  const profile=mode==="walk"||mode==="bike"?"pedestrian":"car";
  let path=[],km=0,base=0;
  try{
    const j=await getJson(`${ROUTE}?resource=bdtopo-osrm&start=${from.lon},${from.lat}&end=${to.lon},${to.lat}&profile=${profile}&optimization=fastest&geometryFormat=polyline&getSteps=false&distanceUnit=kilometer&timeUnit=minute`,null,15000);
    path=decodePolyline(j.geometry||"");km=+j.distance||0;base=+j.duration||0;
  }catch(e){
    const srv=mode==="walk"?"https://routing.openstreetmap.de/routed-foot":mode==="bike"?"https://routing.openstreetmap.de/routed-bike":"https://router.project-osrm.org";
    const j=await getJson(`${srv}/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=polyline`,null,15000);
    const r=(j.routes||[])[0];if(!r)throw new Error("no route");
    path=decodePolyline(r.geometry);km=r.distance/1000;base=r.duration/60;
  }
  let min;

async function estimateTrip(d){

  try{return await Promise.race([estimateTripRaw(d),slow]);}finally{clearTimeout(tm);}
}
async function estimateTripRaw(d){
  if(d.pickup&&norm(d.pickup)!==norm(d.origin||homeAddr())&&norm(d.pickup)!==norm(d.location||"")){
    const nm=d.pickupWho?firstName(d.pickupWho):"l'autre";
    const [a,b]=await Promise.all([estimateTripRaw({...d,location:d.pickup,pickup:""}),estimateTripRaw({...d,origin:d.pickup,pickup:""})]);
    if(!a.ok)return {ok:false,problem:String(a.problem||"").replace("d'arrivée","où récupérer "+nm)};
    if(!b.ok)return {ok:false,problem:String(b.problem||"").replace("de départ","où récupérer "+nm)};
    const wait=Math.max(0,Math.min(60,d.pickupWait==null?5:+d.pickupWait||0));
    const aMin=(d.mode||"car")==="car"?Math.max(1,a.travelMin-5):a.travelMin;
    a.travelMin=aMin;
    return {ok:true,travelMin:Math.round(a.travelMin+wait+b.travelMin),pickupMin:Math.round(a.travelMin),distanceKm:Math.round(((+a.distanceKm||0)+(+b.distanceKm||0))*10)/10,
      travelNote:fmtDur(a.travelMin)+" jusqu'à "+nm+(wait?", "+wait+" min sur place":"")+", puis "+fmtDur(b.travelMin)+" jusqu'au rendez-vous",
      route:[],routeVia:"",geo:{from:a.geo.from,to:b.geo.to,path:[...(a.geo.path||[]),a.geo.to,...(b.geo.path||[])],marks:[{name:nm,at:a.geo.to}]},from:a.from,to:b.to,pickupLabel:a.to};
  }
  const [o,t]=await Promise.all([geocode(d.origin||homeAddr()),geocode(d.location)]);
  if(!t) return {ok:false,problem:"Adresse d'arrivée introuvable. Choisis une suggestion dans la liste."};
  if(!o) return {ok:false,problem:"Adresse de départ introuvable. Choisis un domicile enregistré ou une suggestion."};
  rememberGeo(t.label,t.lat,t.lon);rememberGeo(o.label,o.lat,o.lon);
  const r=await computeTrip(o,t,d.mode||"car",startOf(d));
  const note=String(r.distanceKm).replace(".",",")+" km"+(d.mode==="car"?(isRush(startOf(d))?", heure de pointe et stationnement inclus":", stationnement inclus"):d.mode==="transit"?", durée estimée en transports":"");
  return {ok:true,travelMin:r.travelMin,distanceKm:r.distanceKm,travelNote:note,route:[],routeVia:"",geo:{from:{lat:o.lat,lon:o.lon},to:{lat:t.lat,lon:t.lon},path:r.path,marks:[]},from:o.label,to:t.label};
}

const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const KIND_LABEL={home:"Maison",work:"Travail",place:"Lieu"};
function placesSorted(order){
  const o=order||{home:0,work:1,place:2};
  return [...places.values()].sort((a,b)=>(o[a.kind]??2)-(o[b.kind]??2)||String(a.name).localeCompare(String(b.name),"fr"));
}
function defaultHome(){const hs=placesSorted().filter(p=>p.kind==="home");return hs.find(p=>p.isDefault)||hs[0]||null;}
function isDefaultHome(p){const h=defaultHome();return !!h&&h.id===p.id;}

function placeFor(addr){const n=norm(addr);return n?placesSorted().find(p=>norm(p.address)===n):null;}
function knownPlaces(){
  const m=new Map();
  for(const p of placesSorted()) m.set(norm(p.address),{address:p.address,label:p.name,tag:p.kind==="place"?"Enregistrée":KIND_LABEL[p.kind]});
  if(settings.home&&!m.has(norm(settings.home))) m.set(norm(settings.home),{address:settings.home,label:"",tag:"Maison"});
  for(const e of [...events.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)))
    for(const a of [e.location,e.origin]) if(a&&!m.has(norm(a))) m.set(norm(a),{address:a,label:"",tag:"Récente"});

function autocomplete(input,onPick){

    el("span",{class:"ac-main"},it.label||it.address),it.label?el("span",{class:"ac-sub"},it.address):null,it.tag?el("span",{class:"ac-tag"},it.tag):null);
  function show(){
    const q=input.value.trim(),nq=norm(q);
    list.textContent="";

    local.forEach(it=>list.append(item(it)));
    const haveRemote=Array.isArray(remote)&&remoteQ===q;
    if(remote==="loading") list.append(el("div",{class:"ac-load"},el("span",{class:"spinner"}),"Recherche de « "+remoteQ+" »…"));
    else if(haveRemote){
      remote.filter(x=>!local.some(l=>norm(l.address)===norm(x.address))).forEach(it=>list.append(item(it)));
      if(!remote.length) list.append(el("div",{class:"ac-load"},"Aucune adresse trouvée. Ajoute la ville ou le code postal."));
    }

      list.append(el("button",{type:"button",class:"ac-item ac-search",onpointerdown:e=>e.preventDefault(),onclick:search},
        el("span",{class:"ac-main"},"Chercher « "+q+" »"),el("span",{class:"ac-sub"},"Trouver l'adresse complète, même avec une faute ou un nom de lieu")));
    list.hidden=!list.childNodes.length;

  async function search(){
    const q=input.value.trim();if(q.length<3)return;
    ctl&&ctl.abort();const my=ctl=new AbortController();
    remote="loading";remoteQ=q;show();

      const r=await searchAddresses(q,my.signal);
      if(my.signal.aborted)return;
      const arr=Array.isArray(r)?r:(r&&(r.suggestions||r.results||r.adresses||r.addresses))||[];
      remote=arr.filter(x=>x&&x.address).slice(0,7).map(x=>({address:String(x.address),label:String(x.name||""),tag:"",lat:x.lat,lon:x.lon}));
    }catch(e){if(my.signal.aborted)return;remote=null;const m=sampleErr(e);if(m)toast(m);}

  input.addEventListener("blur",()=>setTimeout(()=>{if(document.activeElement!==input)list.hidden=true;},200));

/* ---------- Lecture des phrases en français (sans connexion) ---------- */
const parseText=(()=>{
// Lecture d'une phrase en français : "Dentiste vendredi 14h30 12 rue de la République à Lyon"
// -> { title, category, date, time, location, origin, ... }. Aucune connexion nécessaire.

const DEFAULT_TIME = { medecin: '09:00', rdv: '10:00', travail: '09:00', sortie: '20:00', courses: '10:00', autre: '10:00' };

const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const WEEKDAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MONTHS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
const STREET = '(?:rue|avenue|av\\.?|boulevard|bd|place|pl\\.|chemin|allee|impasse|quai|route|rte|cours|square|residence|rond-point|lotissement|faubourg|passage|esplanade|promenade)';

const CAT_WORDS = {
  medecin: ['medecin', 'docteur', 'dr ', 'dentiste', 'kine', 'osteo', 'ophtalmo', 'dermato', 'gyneco', 'pediatre', 'hopital', 'clinique', 'pharmacie', 'radio', 'irm', 'scanner', 'analyse', 'prise de sang', 'labo', 'vaccin', 'orthodontiste', 'psy', 'veterinaire', 'veto', 'sage-femme', 'echographie'],
  courses: ['courses', 'supermarche', 'carrefour', 'leclerc', 'auchan', 'lidl', 'intermarche', 'monoprix', 'casino', 'franprix', 'marche', 'drive', 'boulangerie', 'ikea', 'magasin', 'shopping'],
  sortie: ['resto', 'restaurant', 'cinema', 'cine', 'bar', 'concert', 'soiree', 'anniversaire', 'anniv', 'apero', 'theatre', 'musee', 'balade', 'diner', 'dejeuner', 'brunch', 'spectacle', 'match', 'piscine', 'plage', 'zoo', 'expo', 'mariage', 'bowling', 'sport', 'salle de sport'],
  travail: ['reunion', 'travail', 'boulot', 'bureau', 'entretien', 'rendez-vous client', 'formation', 'seminaire'],
  rdv: ['rdv', 'rendez-vous', 'rendez vous', 'banque', 'notaire', 'mairie', 'prefecture', 'garage', 'coiffeur', 'controle technique', 'avocat', 'assurance', 'poste'],
};

function guessCategory(low) {
  for (const cat of ['medecin', 'courses', 'sortie', 'travail', 'rdv']) {
    if (CAT_WORDS[cat].some((w) => new RegExp('(^|[^a-z])' + w.replace(/[-]/g, '[- ]').trim() + '([^a-z]|$)').test(low))) return cat;
  }
  return 'autre';
}

function nextWeekday(now, wd, allowToday) {
  const d = new Date(now); d.setHours(0, 0, 0, 0);
  let diff = (wd - d.getDay() + 7) % 7;
  if (diff === 0 && !allowToday) diff = 7;
  d.setDate(d.getDate() + diff);
  return d;
}

function parseText(text, opts = {}) {
  const now = opts.now ? new Date(opts.now) : new Date();
  const places = opts.places || [];
  const orig = String(text || '').replace(/\s+/g, ' ').trim();
  const low = strip(orig);
  const spans = []; // [start, end) to remove from the title
  const take = (m, idx) => { spans.push([idx, idx + m.length]); };
  const blockedSpan = (i) => spans.some(([a, b]) => i >= a && i < b);

  // ---------- heure ----------
  let time = null, timeIdx = -1;
  let m = /(?:\b(?:a|vers|pour|des)\s+)?\b([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)?(?![\d/])/.exec(low);
  if (m) { time = pad(+m[1]) + ':' + pad(m[2] ? +m[2] : 0); timeIdx = m.index; take(m[0], m.index); }
  if (!time && (m = /\b(?:a\s+)?midi\b/.exec(low)) && !/apres-?\s?midi/.test(low.slice(Math.max(0, m.index - 6), m.index + 5))) { time = '12:00'; timeIdx = m.index; take(m[0], m.index); }
  if (!time && (m = /\b(?:a\s+)?minuit\b/.exec(low))) { time = '23:59'; timeIdx = m.index; take(m[0], m.index); }

  // ---------- date ----------
  let date = null, dateIdx = -1;
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const plus = (n) => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
  const tryDate = (re, fn) => {
    if (date) return;
    const r = re.exec(low);
    if (r) { const d = fn(r); if (d && !isNaN(d)) { date = d; dateIdx = r.index; take(r[0], r.index); } }
  };
  tryDate(/\bapres[- ]demain\b/, () => plus(2));
  tryDate(/\bdemain\b/, () => plus(1));
  tryDate(/\bdans\s+(\d{1,2})\s+jours?\b/, (r) => plus(+r[1]));
  tryDate(/\b(?:dans\s+une\s+semaine|la\s+semaine\s+prochaine)\b/, () => plus(7));
  tryDate(/\b(?:le\s+)?(\d{1,2})[/.](\d{1,2})(?:[/.](\d{2,4}))?\b/, (r) => {
    let y = r[3] ? +r[3] : now.getFullYear(); if (y < 100) y += 2000;
    let d = new Date(y, +r[2] - 1, +r[1]);
    if (!r[3] && d < today) d = new Date(y + 1, +r[2] - 1, +r[1]);
    return d;
  });
  tryDate(new RegExp('\\b(?:(?:' + WEEKDAYS.join('|') + ')\\s+)?(?:le\\s+)?(1er|\\d{1,2})\\s+(' + MONTHS.join('|') + ')(?:\\s+(\\d{4}))?\\b'), (r) => {
    const day = r[1] === '1er' ? 1 : +r[1];
    let y = r[3] ? +r[3] : now.getFullYear();
    let d = new Date(y, MONTHS.indexOf(r[2]), day);
    if (!r[3] && d < today) d = new Date(y + 1, MONTHS.indexOf(r[2]), day);
    return d;
  });
  tryDate(new RegExp('\\b(?:(ce|le)\\s+)?(' + WEEKDAYS.join('|') + ')(?:\\s+(prochain|d\'apres|en huit))?(?:\\s+(\\d{1,2})(?!\\s*(?:h|:|\\d)))?\\b'), (r) => {
    const wd = WEEKDAYS.indexOf(r[2]);
    if (r[4]) { // "lundi 13"
      const n = +r[4];
      let d = new Date(now.getFullYear(), now.getMonth(), n);
      if (d < today) d = new Date(now.getFullYear(), now.getMonth() + 1, n);
      return d;
    }
    const d = nextWeekday(now, wd, r[1] === 'ce');
    if (r[3] === 'en huit' || r[3] === "d'apres") d.setDate(d.getDate() + 7);
    return d;
  });
  tryDate(/\b(?:aujourd'?hui|ce\s+(?:soir|matin|midi)|cet\s+apres-?\s?midi|tout\s+a\s+l'heure|tantot)\b/, () => plus(0));
  tryDate(/\b(?:le\s+)(1er|\d{1,2})(?!\s*(?:h|:|\/|\d|\s*(?:rue|avenue|bd|boulevard|place|chemin)))\b/, (r) => {
    const n = r[1] === '1er' ? 1 : +r[1];
    if (n < 1 || n > 31) return null;
    let d = new Date(now.getFullYear(), now.getMonth(), n);
    if (d < today) d = new Date(now.getFullYear(), now.getMonth() + 1, n);
    return d;
  });
  // "ce soir", "ce matin" donnent aussi une heure par défaut
  if (!time) {
    const pm = /\b(?:le\s+|en\s+|dans\s+l[ae]\s+|ce\s+|cet\s+)?(matin|soir|apres-?\s?midi)\b/.exec(low);
    if (pm) {
      time = pm[1] === 'matin' ? '09:00' : pm[1] === 'soir' ? '20:00' : '15:00';
      if (!blockedSpan(pm.index)) take(pm[0], pm.index);
    }
  }

  // ---------- catégorie ----------
  const category = guessCategory(low);
  const assumed = { date: !date, time: !time };
  if (!time) time = DEFAULT_TIME[category] || '10:00';
  if (!date) {
    const [h, mi] = time.split(':').map(Number);
    const cand = new Date(today); cand.setHours(h, mi);
    date = cand > now ? today : plus(1);
  }

  // ---------- lieux enregistrés ----------
  const byKind = (k) => places.find((p) => p.kind === k);
  const findPlace = (fromIdx = 0) => {
    let best = null;
    for (const p of places) {
      const n = strip(p.name).trim();
      if (n.length < 2) continue;
      const re = new RegExp('(^|[^a-z0-9])' + n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)');
      const r = re.exec(low.slice(fromIdx));
      if (r && (!best || n.length > best.len)) best = { p, idx: fromIdx + r.index, len: n.length };
    }
    return best;
  };

  // ---------- départ ----------
  let origin = null, originName = null;
  const om = /\b(?:depuis|en partant d[eu]|au depart d[eu]|en sortant d[eu])\s+(?:le |la |l'|chez |du )?([a-z' -]{2,30}?)(?=$|[,.]|\s+(?:pour|a|au|aux|vers|le|demain|apres|ce|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b)/.exec(low);
  if (om) {
    const w = om[1].trim();
    let p = null;
    if (/^(travail|boulot|bureau|taf)$/.test(w)) p = byKind('work');
    else if (/^(maison|nous|moi|la maison)$/.test(w)) p = byKind('home');
    else p = places.find((x) => strip(x.name).trim() === w);
    if (p) { origin = p.address; originName = p.name; take(om[0], om.index); }
  }

  // ---------- destination ----------
  let location = null, locationName = null;
  const blocked = (i) => spans.some(([a, b]) => i >= a && i < b);
  // 1) adresse écrite
  const am = new RegExp('(?:\\b(?:au|a|chez)\\s+)?\\b(\\d{1,4}\\s*(?:bis|ter)?\\s*,?\\s*)?' + STREET + '\\b').exec(low);
  if (am && !blocked(am.index + (am[0].length - 1))) {
    const startCut = am.index;
    const startAddr = am.index + am[0].search(/\d|[a-z]/) + (/^(au|a|chez)\s+/.test(am[0]) ? am[0].match(/^(au|a|chez)\s+/)[0].length : 0);
    let end = orig.length;
    for (const [a] of spans) if (a > startAddr && a < end) end = a;
    const pm = /\s(?:pour|avec)\s/.exec(low.slice(startAddr));
    if (pm && startAddr + pm.index < end) end = startAddr + pm.index;
    let addr = orig.slice(startAddr, end).replace(/[\s,.;-]+$/, '').replace(/\s+(?:à|a|le|au)$/i, '');
    addr = addr.replace(/\s+(?:à|a)\s+(?=[A-ZÀ-Ý])/, ', ');
    if (addr.length >= 4) { location = addr; spans.push([startCut, end]); }
  }
  // 2) lieu enregistré
  if (!location) {
    const hit = findPlace();
    if (hit && hit.p.kind !== 'home') { location = hit.p.address; locationName = hit.p.name; }
    else if (/\b(?:au|a la|au bureau|au)\s+(?:travail|boulot|bureau|taf)\b/.test(low) && byKind('work')) { location = byKind('work').address; locationName = byKind('work').name; }
    else if (/\b(?:a la maison|chez nous|rentrer)\b/.test(low) && byKind('home')) { location = byKind('home').address; locationName = byKind('home').name; }
  }
  // 3) "au Café de Paris", "à Odysseum", "à Lyon"
  if (!location) {

function impDate(txt){
  const t=norm(txt);

  if((m=/(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{1,2}):(\d{2}))?/.exec(t))){y=+m[1];mo=+m[2];d=+m[3];if(m[4]!=null){h=+m[4];mi=+m[5];}idx=m.index;len=m[0].length;}
  else if((m=/(\d{1,2})[/.](\d{1,2})[/.](\d{2,4})/.exec(t))){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;idx=m.index;len=m[0].length;}
  else if((m=/(\d{1,2})(?:er)?\s+([a-z]{3,9})\.?\s+(\d{4})/.exec(t))&&IMP_MONTHS[m[2]]){d=+m[1];mo=IMP_MONTHS[m[2]];y=+m[3];idx=m.index;len=m[0].length;}
  else if((m=/([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/.exec(t))&&IMP_MONTHS[m[1]]){mo=IMP_MONTHS[m[1]];d=+m[2];y=+m[3];idx=m.index;len=m[0].length;}
  else return null;
  if(h==null){const rest=t.slice(idx+len);const tm=/(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(am|pm)?/.exec(rest);
    if(tm){h=+tm[1];mi=tm[2]?+tm[2]:0;if(tm[3]==="pm"&&h<12)h+=12;if(tm[3]==="am"&&h===12)h=0;len+=tm.index+tm[0].length;}}

  return {date:y+"-"+pad(mo)+"-"+pad(d),time:h==null?null:pad(h)+":"+pad(mi),idx,len};
}
// Une ligne par évènement : « Titre | Début | Lieu ». Une ligne sans date complète le lieu de la précédente.
function parseImport(text){
  const out=[];
  for(const raw of String(text||"").split(/\r?\n/)){
    const line=raw.replace(/["«»“”]/g," ").replace(/\s+/g," ").trim();if(!line)continue;
    const parts=line.split(/\s*\|\s*/);
    let found=null,pi=-1;
    for(let i=0;i<parts.length;i++){const dd=impDate(parts[i]);if(dd){found=dd;pi=i;break;}}
    if(!found){ if(out.length){const l=out[out.length-1];l.location=[l.location,line.replace(/\|/g," ").trim()].filter(Boolean).join(", ");} continue; }
    let title=parts.slice(0,pi).join(" ").trim();
    const after=parts.slice(pi+1).filter(x=>x&&!impDate(x)).join(", ").trim();
    if(!title){title=parts[pi].slice(0,found.idx).trim();}
    const allDay=!found.time||found.time==="00:00";
    out.push({title:title||"Évènement",date:found.date,time:allDay?"00:00":found.time,allDay,location:after});
  }

}

function alarmTime(ev){return hasTrip(ev)?departOf(ev):new Date(startOf(ev).getTime()-15*60000);}
function alarmPossible(ev){if(isAllDay(ev))return false;const t=alarmTime(ev).getTime(),now=Date.now();return t>now+60000&&t-now<24*3600000;}
function alarmsDone(){try{return JSON.parse(localStorage.getItem("a2.alarms")||"{}");}catch(_){return {};}}
function alarmDone(ev){const a=alarmsDone()[ev.id];return a&&a===hhmm(alarmTime(ev))+"|"+ev.date;}
function runAlarmShortcut(hm){location.href="shortcuts://run-shortcut?name="+encodeURIComponent(SC_NAME)+"&input=text&text="+encodeURIComponent(hm);}
function createClockAlarm(ev){
  const hm=hhmm(alarmTime(ev));
  try{const a=alarmsDone();a[ev.id]=hm+"|"+ev.date;localStorage.setItem("a2.alarms",JSON.stringify(a));}catch(_){}
  runAlarmShortcut(hm);
  setTimeout(()=>render(),800);
}
function alarmButton(ev,cls){
  if(!alarmPossible(ev)) return null;
  const done=alarmDone(ev);
  return el("button",{type:"button",class:"btn"+(cls?" "+cls:""),onclick:e=>{e.stopPropagation();createClockAlarm(ev);}},(done?"Alarme créée ":"Créer l'alarme ")+hhmm(alarmTime(ev)));
}

async function forceUpdate(){

function registerSW(){
  if(!("serviceWorker" in navigator)||location.protocol!=="https:")return;
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  // Nouvelle version en ligne : l'app se recharge toute seule, une fois
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload();}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{
    const check=()=>r.update().catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")check();});
  }).catch(()=>{});
}

let REC=null,recOn=false,recBtn=null;
function getRec(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  if(!REC){try{REC=new SR();}catch(_){REC=null;}}
  if(REC){REC.lang="fr-FR";REC.interimResults=true;REC.continuous=false;REC.maxAlternatives=1;}
  return REC;

function startVoice(ta,btn,help,onDone,retry){

      el("div",{},el("strong",{},!SR?"Dictée indisponible sur ce navigateur":denied?"Le micro a été refusé":"Le micro n'a pas démarré"),
        el("span",{},!SR?"Ouvre l'app depuis son icône sur l'iPhone pour dicter.":denied?"Touche à nouveau Parler et réponds « Autoriser ». Pour ne plus avoir la question : Réglages, Apps, Safari, Micro, puis « Autoriser ».":"Touche à nouveau Parler. Vérifie que Siri et Dictée sont activés (Réglages, Général, Clavier).")));
    help.hidden=false;
  };
  if(!SR){fallback(false);return;}
  if(recOn){try{REC.stop();}catch(_){}return;}
  const rec=getRec();
  if(!rec){fallback(false);return;}
  const before=ta.value.trim();let finalText="",gotAny=false,errored=false,silence=null;
  const armSilence=()=>{clearTimeout(silence);silence=setTimeout(()=>{try{rec.stop();}catch(_){}},gotAny?2500:9000);};
  recBtn=btn;btn.classList.add("on");btn.querySelector("span").textContent="J'écoute…";
  help.textContent="";help.append(el("div",{class:"mic-wave"},el("i"),el("i"),el("i"),el("i")),el("div",{},el("strong",{},"Parle maintenant"),el("span",{},"Quoi, quand et où. Touche à nouveau le bouton pour arrêter.")));help.hidden=false;
  rec.onstart=()=>{recOn=true;armSilence();};

  rec.onerror=e=>{

    if(code==="aborted"||code==="no-speech")return;
    errored=true;
    if(code==="not-allowed"||code==="service-not-allowed"){REC=null;fallback(true);}
    else fallback(false);

  rec.onend=()=>{
    clearTimeout(silence);recOn=false;micIdle(btn);
    if(errored)return;

    if(gotAny&&said&&onDone) onDone();
  };
  try{rec.start();}
  catch(_){
    // L'iPhone garde parfois l'ancienne écoute ouverte : on la ferme et on recommence une fois
    try{rec.abort();}catch(__){}
    REC=null;recOn=false;micIdle(btn);
    if(!retry) setTimeout(()=>startVoice(ta,btn,help,onDone,true),250);
    else fallback(false);
  }
}

function pickupFromText(text){

  let m=text.match(PK_ME),who=myId,clause="";
  if(m){clause=m[1]||"";}else{m=text.match(PK_OTHER);if(!m)return null;who=o;clause=m[1]||"";
    // seulement s'il s'agit bien de l'autre (« récupérer un colis » reste un rendez-vous normal)
    const nc0=norm(clause);if(!(nc0.includes(norm(firstName(o)))||/^(la|le)\b|\b(madame|ma femme|ma copine|ma cherie|mon mari|monsieur|mon copain|mon cheri|ma moitie|elle|lui)\b/.test(nc0)||/\bje\s+(la|le)\s+(recupere|passe prendre)/.test(norm(text))))return null;}
  const nc=norm(clause);
  const pl=placesSorted().filter(p=>p.name&&nc.includes(norm(p.name))).sort((a,b)=>norm(b.name).length-norm(a.name).length)[0];
  let addr=pl?pl.address:"";
  if(!addr&&/\b(travail|boulot|bureau|taf|job)\b/.test(nc)){const nm=norm(firstName(who));const w=placesSorted().filter(p=>p.kind==="work");addr=(w.find(p=>norm(p.name).includes(nm))||{}).address||"";}
  if(!addr)addr=(lastPickups()[who]||[])[0]||"";
  return {who,addr,rest:text.replace(m[0]," ").replace(/\s+/g," ").trim()};
}
const DAYTIME=new Set(["zoo","parc","plage","visite","fun","aqua","neige"]);
function whoFromText(text){
  const o=otherId();if(!o)return null;
  const nt=norm(text),esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  for(const [uid,raw] of [[o,firstName(o)],[myId,firstName(myId)]]){
    const n=norm(raw);if(n.length<2||n==="moi"||n==="ma moitie")continue;
    if(new RegExp("^"+esc(n)+"\\s+(?!et\\b|avec\\b|&)").test(nt))return {uid,strip:esc(raw)};
    if(new RegExp("\\bpour\\s+"+esc(n)+"\\b").test(nt))return {uid,strip:null};
  }
  if(/^(moi|pour moi)\b/.test(nt))return {uid:myId,strip:null};
  return null;
}
async function prepareText(text,b,label){
  // « ajoute du lait et des œufs » : ça va dans la liste de courses, pas dans l'agenda
  try{const p0=parseText(text,{places:[]});const s0=shopIntent(text,p0);
    if(s0){const add=await addToShop(s0);if(add.length){closeSheet();const t=shopTarget();toast("Ajouté à la liste : "+add.map(x=>x.t).join(", "));openShop(t?t.id:null);return;}}}catch(_){}
  b.disabled=true;b.textContent="";b.append(el("span",{class:"spinner"}),"Calcul du trajet…");
  const info=[];
  try{
    const pk=pickupFromText(text);if(pk)text=pk.rest;
    const p=parseText(text,{places:placesSorted().map(x=>({name:x.name,kind:x.kind,address:x.address}))});
    const d=blankDraft();
    if(pk){d.who="both";d.pickupWho=pk.who;d.driver=memberIds().find(m=>m!==pk.who)||myId;d.pickup=pk.addr;d.pickupWait=5;
      if(!pk.addr)info.push("Indique où "+(pk.who===myId?firstName(otherId())+" te récupère":"récupérer "+firstName(pk.who))+" (touche Modifier).");}
    Object.assign(d,{title:p.title,category:CATS[p.category]?p.category:"autre",date:p.date,time:p.time});
    d.marginMin=DEF_MARGIN[d.category]??10;d.durationMin=DEF_DUR[d.category]||60;
    // « Hajjour dentiste mardi 9h » ou « dentiste pour Hajjour » : l'évènement est pour elle seule
    if(!pk){const w=whoFromText(text);if(w){d.who=w.uid;if(w.strip)d.title=(d.title.replace(new RegExp("^"+w.strip+"\\s+","i"),"")||d.title).replace(/^./,c=>c.toUpperCase());}}
    // sortie de jour sans heure précisée (zoo, parc, plage, musée…) : l'après-midi plutôt que 20h
    if(p.assumed&&p.assumed.time&&DAYTIME.has(motifOf({title:d.title,category:d.category}))){d.time="14:00";
      if(p.assumed.date&&startOf(d).getTime()<Date.now()){const t=new Date();t.setDate(t.getDate()+1);d.date=ymd(t);}}
    if(p.origin) d.origin=p.origin;
    let loc=p.location||"";
    // Enseigne cochée (« courses chez Action ») : magasin le plus proche de la maison
    const nt=norm(text);
    const br=brands.find(x=>{const n=norm(x);return n&&(norm(loc).startsWith(n)||new RegExp("(^|[^a-z0-9])"+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z0-9]|$)").test(nt));});
    if(br&&!/\d/.test(loc)&&!placeFor(loc)){
      const st=await brandStores(br).catch(()=>[]);
      if(st.length){loc=st[0].address;if(!/courses/i.test(d.title)&&norm(d.title)===norm(br))d.title=st[0].name;}
    }
    if(!loc){const pl=placeByTitle(d.title);if(pl)loc=pl.address;}
    d.location=loc;
    if(d.location){
      const r=await estimateTrip(d).catch(()=>null);
      if(r&&r.ok){
        d.travelMin=r.travelMin;d.routeGeo=cleanGeo(r.geo);d.travelNote=r.travelNote;if(r.pickupMin!=null)d.pickupMin=r.pickupMin;
        if(r.to&&!placeFor(d.location)&&!/\b\d{5}\b/.test(d.location)) d.location=r.to;
        if(r.from&&d.origin&&!placeFor(d.origin)&&!/\b\d{5}\b/.test(d.origin)) d.origin=r.from;
      }else if(r) info.push(r.problem);
      else info.push("Trajet non calculé : vérifie ta connexion.");
    }
    d.reminders=suggestReminders(d);d.reminders.forEach(r=>{r.min=remMinFor(d,r);});
    if(p.assumed&&p.assumed.date&&p.assumed.time) info.unshift("Date et heure non précisées : vérifie-les.");
    else if(p.assumed&&p.assumed.time) info.unshift("Heure non précisée : vérifie-la.");
    else if(p.assumed&&p.assumed.date) info.unshift("Date non précisée : vérifie-la.");
    if(!homeAddr()) info.push("Enregistre ta maison dans les réglages pour calculer les trajets.");
    openConfirm(d,info.join(" ")||null);
  }catch(e){console.error(e);toast("Préparation impossible. Réessaie, ou remplis toi-même.");}
  b.disabled=false;b.textContent=label;
}

/* ---------- Trajet en direct : je passe prendre l'autre, qui suit ma voiture sur la carte (comme Uber) ----------
   iOS ne laisse pas une app web lire la position quand elle n'est pas à l'écran : Together reste donc allumé chez le
   conducteur pendant le trajet (avec CarPlay, le guidage est sur l'écran de la voiture). Seule la vraie position est
   montrée : si elle n'arrive plus, la voiture reste à la dernière position reçue, avec son heure. Jamais de position
   inventée. Si Together passe en arrière-plan, une notification rappelle au conducteur de le rouvrir. */
let trips=new Map(),tripPos=new Map(),tripPosOff=new Map(),share=null,tripUI=null,firstTrips=true,tripsReady=false;
let tripSendMs=4000;                 // au plus une position toutes les 4 s
const TRIP_HERE_M=120,TRIP_FRESH_S=25;
const okPt=p=>!!p&&typeof p==="object"&&Number.isFinite(+p.lat)&&Number.isFinite(+p.lon);
function distM(a,b){const r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;
  const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*6371000*Math.asin(Math.min(1,Math.sqrt(h)));}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);
  return (Math.atan2(y,x)/r+360)%360;}
function pathLen(p){let d=0;for(let i=1;i<p.length;i++)d+=distM(p[i-1],p[i]);return d;}
// Où en est-on sur le trajet : distance déjà faite et écart à la route (en mètres)
function along(route,p){
  const kx=Math.cos(p.lat*Math.PI/180)*111320,ky=110574;let best={s:0,off:Infinity},acc=0;
  for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1],L=distM(a,b);
    const ax=(a.lon-p.lon)*kx,ay=(a.lat-p.lat)*ky,dx=(b.lon-a.lon)*kx,dy=(b.lat-a.lat)*ky,L2=dx*dx+dy*dy;
    const t=L2?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L2)):0,off=Math.hypot(ax+t*dx,ay+t*dy);
    if(off<best.off)best={s:acc+t*L,off};acc+=L;}
  return {s:best.s,off:best.off,total:acc};
}
function pointAt(route,s){let acc=0;
  for(let i=0;i<route.length-1;i++){const a=route[i],b=route[i+1],L=distM(a,b);
    if(acc+L>=s){const t=L?Math.max(0,s-acc)/L:0;return {lat:a.lat+(b.lat-a.lat)*t,lon:a.lon+(b.lon-a.lon)*t,hdg:bearing(a,b)};}acc+=L;}
  const z=route[route.length-1],y=route[route.length-2]||z;return {lat:z.lat,lon:z.lon,hdg:bearing(y,z)};
}
function tripLive(t){return !!t&&(t.stage==="go"||t.stage==="here")&&Date.now()-(t.updatedAt||t.startedAt||0)<4*3600000;}
function tripFor(id){const t=trips.get(id);return tripLive(t)?t:null;}
function myLiveTrip(){return [...trips.values()].filter(t=>tripLive(t)&&(t.to===myId||t.by===myId)&&events.has(t.id)).sort((a,b)=>(b.startedAt||0)-(a.startedAt||0))[0]||null;}
// Le conducteur peut partir de 2 h avant l'heure de départ jusqu'à l'heure du rendez-vous
function canStartTrip(ev){
  if(!ev||!tripsReady||!hasPickup(ev)||isAllDay(ev)||driverOf(ev)!==myId)return false;
  const t=trips.get(ev.id);if(tripLive(t)||(t&&t.stage==="together"))return false;
  const now=Date.now();return now>=departOf(ev).getTime()-2*3600000&&now<=startOf(ev).getTime()+30*60000;
}
function fixOf(p){const c=(p&&p.coords)||{},n=(x,d)=>x!=null&&Number.isFinite(+x)?+(+x).toFixed(d):null;
  return {lat:+(+c.latitude).toFixed(6),lon:+(+c.longitude).toFixed(6),acc:Math.round(+c.accuracy||0),spd:n(c.speed,1),
    hdg:c.heading!=null&&Number.isFinite(+c.heading)&&+c.heading>=0&&(+c.speed||0)>0.5?Math.round(+c.heading):null,t:Date.now()};}
// ms : attente totale (la fenêtre « Autoriser la position ? » en fait partie) ; la mesure elle-même a 15 s
function getFix(ms){return new Promise(res=>{let done=false;const end=v=>{if(!done){done=true;res(v);}};setTimeout(()=>end(null),ms);
  try{navigator.geolocation.getCurrentPosition(p=>end(fixOf(p)),e=>end(e&&e.code===1?"denied":null),{enableHighAccuracy:true,maximumAge:20000,timeout:Math.min(ms,15000)});}catch(_){end(null);}});}
async function tripTarget(ev){
  const m=ev.routeGeo&&(ev.routeGeo.marks||[])[0];
  if(m&&okPt(m.at))return {lat:+m.at.lat,lon:+m.at.lon};
  const g=ev.pickup?await geocode(ev.pickup).catch(()=>null):null;
  return okPt(g)?{lat:+g.lat,lon:+g.lon}:null;
}
// Trajet routier depuis là où l'on est ; s'il paraît faux (service en panne), une ligne droite fait l'affaire
async function tripRoute(from,to,mode){
  let path=null,min=0;
  try{const r=await Promise.race([computeTrip(from,to,mode||"car",new Date()),new Promise((_,no)=>setTimeout(()=>no(new Error("lent")),8000))]);
    const P=((r&&r.path)||[]).filter(okPt);
    if(P.length>1&&distM(P[0],from)<2500&&distM(P[P.length-1],to)<2500){path=[from,...P,to];min=+r.rawMin||+r.travelMin||0;}}catch(_){}
  if(!path){path=[from,to];min=distM(from,to)*1.35/1000/({walk:4.8,bike:15,transit:18}[mode]||28)*60;}
  path=path.map(p=>({lat:+(+p.lat).toFixed(5),lon:+(+p.lon).toFixed(5)}));
  const L=pathLen(path),v=Math.max(1.2,Math.min(30,L/Math.max(60,min*60)));
  return {route:path,routeM:Math.round(L),v:+v.toFixed(2),eta:Date.now()+Math.round(L/v*1000)};
}
async function startTrip(id,btn){
  const ev=events.get(id);if(!ev||!canStartTrip(ev))return false;
  if(!navigator.geolocation){toast("Ce téléphone ne donne pas sa position.");return false;}
  const lbl=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="Position…";}
  try{
    const fix=await getFix(45000);
    if(fix==="denied"){toast("Position refusée. Pour l'autoriser : Réglages de l'iPhone, Confidentialité, Service de localisation.");return false;}
    if(!fix){toast("Position introuvable pour l'instant. Réessaie dans un instant.");return false;}
    const target=await tripTarget(ev);
    if(!target){toast("Adresse de "+firstName(ev.pickupWho)+" introuvable : vérifie-la dans l'évènement.");return false;}
    const r=await tripRoute(fix,target,ev.mode);
    const now=Date.now(),doc={ev:id,by:myId,to:ev.pickupWho,mode:ev.mode||"car",stage:"go",startedAt:now,updatedAt:now,
      title:String(ev.title||"").slice(0,80),target:{...target,addr:String(ev.pickup||"").slice(0,200)},...r,near:r.eta-now<=6*60000?now:0};
    await db.doc("trips/"+id).set(doc);trips.set(id,{id,...doc});
    await db.doc("tripPos/"+id).set({...fix,bg:false});tripPos.set(id,{...fix,bg:false});
    pushTo([ev.pickupWho],firstName(myId)+" est en route","Arrivée prévue vers "+hhmm(new Date(r.eta))+(ev.pickup?", "+shortAddr(ev.pickup):"")+". Touche pour suivre le trajet en direct.","trip-"+id,"./?trip="+id)
      .then(res=>{const ok=!!(res&&res.sent>0),cur=trips.get(id);if(cur)cur.notified=ok?1:-1;
        db.doc("trips/"+id).update({notified:ok?1:-1}).catch(()=>{});
        if(!ok)toast("La notification n'a pas pu partir vers le téléphone de "+firstName(ev.pickupWho)+(res&&res.codes&&res.codes.includes(-1)?" : ses notifications ne sont pas activées dans Together.":"."));
        tripTick(true);});
    beginShare(id,fix);
    if(tripUIOpen(id)){tripUI.key="";tripPanel();}else openTrip(id);
    syncPush(true);scheduleRender();
    return true;
  }catch(e){console.error(e);toast("Départ impossible pour l'instant. Réessaie.");return false;}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=lbl;}}
}
/* le téléphone du conducteur envoie sa position */
function geoWatch(){try{return navigator.geolocation.watchPosition(onFix,onFixErr,{enableHighAccuracy:true,maximumAge:2000,timeout:30000});}catch(_){return null;}}
function beginShare(id,fix){
  endWatch();
  share={id,watch:null,sentAt:fix?Date.now():0,lastSent:fix||null,lastFix:fix||null,etaAt:0,offN:0,rerouteAt:0,local:false};
  share.watch=geoWatch();keepAwake(true);lsSet("a2.share",id);
}
function endWatch(){if(share&&share.watch!=null){try{navigator.geolocation.clearWatch(share.watch);}catch(_){}share.watch=null;}}
function endShare(){endWatch();share=null;lsSet("a2.share",null);pauseNote(null,false);if(typeof shopRefresh==="undefined"||!shopRefresh)keepAwake(false);}
function pauseNote(t,on){
  try{if(!("serviceWorker" in navigator)||typeof Notification==="undefined"||Notification.permission!=="granted")return;
    navigator.serviceWorker.ready.then(r=>{
      if(on&&t)return r.showNotification("Partage en pause",{body:"Rouvre Together pour que "+firstName(t.to)+" voie ta vraie position.",tag:"share-pause",renotify:true,icon:"icons/icon-192.png",badge:"icons/icon-192.png",data:{url:"./?trip="+t.id}});
      return r.getNotifications?r.getNotifications({tag:"share-pause"}).then(ns=>ns.forEach(n=>n.close())):null;
    }).catch(()=>{});
  }catch(_){}
}
function onFixErr(e){if(e&&e.code===1&&share&&!share.local){const t=trips.get(share.id);toast("Position refusée : "+(t?firstName(t.to):"l'autre")+" ne voit plus ton trajet.");if(t)tripStop(t);}}
function onFix(p){
  if(!share)return;
  const fix=fixOf(p);if(!okPt(fix)||!(fix.acc<=250))return;
  const prev=share.lastFix;
  if(fix.hdg==null&&prev)fix.hdg=distM(prev,fix)>6?Math.round(bearing(prev,fix)):prev.hdg;
  share.lastFix=fix;
  const ev=events.get(share.id),now0=Date.now();
  if(share.local){   // après la prise en charge : l'aperçu continue ici, rien n'est partagé
    const g=ev&&ev.routeGeo;
    if((g&&okPt(g.to)&&distM(fix,g.to)<120)||!ev||now0>startOf(ev).getTime()+30*60000){endShare();tripTick(true);return;}
    tripTick();return;}
  const t=trips.get(share.id);
  if(!t||t.by!==myId||!tripLive(t)){endShare();return;}
  // le partage ne dure jamais : 15 min sur place au plus, et rien après l'heure du rendez-vous
  if(t.stage==="here"&&now0-(+t.hereAt||now0)>15*60000){tripTogether(t);return;}
  if(ev&&now0>startOf(ev).getTime()+45*60000){tripStop(t);return;}
  const dT=okPt(t.target)?distM(fix,t.target):Infinity;
  if(t.stage==="go"&&dT<=TRIP_HERE_M+Math.min(fix.acc,60))tripArrived(t);
  else if(t.stage==="here"&&dT>350){tripTogether(t);return;}
  const now=Date.now();
  if(now-share.sentAt>=tripSendMs&&(!share.lastSent||distM(share.lastSent,fix)>12||now-share.sentAt>=15000)){
    share.sentAt=now;share.lastSent=fix;tripPos.set(t.id,{...fix,bg:false});
    db.doc("tripPos/"+t.id).set({...fix,bg:false}).catch(()=>{});
    tripEta(t,fix);
  }
  tripTick();
}
// Heure d'arrivée d'après ce qu'il reste à faire ; nouveau trajet si l'on a quitté la route prévue
function tripEta(t,fix){
  if(t.stage!=="go"||!Array.isArray(t.route)||t.route.length<2||!share)return;
  const a=along(t.route,fix),now=Date.now();
  if(a.off>250){
    share.offN++;
    if(share.offN>=2&&now-share.rerouteAt>90000){share.rerouteAt=now;share.offN=0;
      tripRoute(fix,t.target,t.mode).then(r=>{const cur=trips.get(t.id);if(!cur||cur.stage!=="go")return;Object.assign(cur,r,{updatedAt:Date.now()});
        db.doc("trips/"+t.id).update({...r,updatedAt:Date.now()}).catch(()=>{});tripTick(true);syncPush();});}
    return;
  }
  share.offN=0;
  const remS=Math.max(0,a.total-a.s)/Math.max(1.2,+t.v||8),eta=now+Math.round(remS*1000);
  // à 5 minutes de l'arrivée, d'après la vraie position : l'autre est prévenu une fois
  if(!t.near&&remS<=300){t.near=now;db.doc("trips/"+t.id).update({near:now}).catch(()=>{});
    pushTo([t.to],firstName(myId)+" arrive dans "+Math.max(1,Math.round(remS/60))+" min","Position en direct : touche pour suivre le trajet.","trip-"+t.id,"./?trip="+t.id);}
  if(Math.abs(eta-(+t.eta||0))>=60000&&now-share.etaAt>=20000){share.etaAt=now;t.eta=eta;t.updatedAt=now;db.doc("trips/"+t.id).update({eta,updatedAt:now}).catch(()=>{});syncPush();}
}
// « en bas de chez vous » pour la maison, sinon l'adresse (ou le nom du lieu enregistré)
function waitWhere(addr){const p=addr&&placeFor(addr);return p&&p.kind==="home"?" en bas de chez vous":" en bas"+(addr?", "+shortAddr(addr):"");}
function tripArrived(t){
  if(!t||t.stage!=="go")return;
  const now=Date.now(),nm=firstName(t.by);t.stage="here";t.hereAt=now;t.updatedAt=now;
  db.doc("trips/"+t.id).update({stage:"here",hereAt:now,updatedAt:now}).catch(()=>{});
  pushTo([t.to],nm+" est en bas",nm+" t'attend"+waitWhere(t.target&&t.target.addr)+".","trip-"+t.id,"./?trip="+t.id);
  if(!tripUIOpen(t.id))toast("Message envoyé à "+firstName(t.to)+" : tu es en bas");
  tripTick(true);syncPush(true);
}
// L'autre est à bord : le partage s'arrête, l'aperçu du trajet continue sur ce téléphone jusqu'au rendez-vous
function tripTogether(t){
  if(!t)return;
  // d'abord ce téléphone (la base peut répondre tout de suite), ensuite la base
  if(share&&share.id===t.id){share.local=true;lsSet("a2.share",null);if(!tripUIOpen(t.id))endShare();}
  const now=Date.now();t.stage="together";t.endedAt=now;t.updatedAt=now;
  db.doc("trips/"+t.id).update({stage:"together",endedAt:now,updatedAt:now}).catch(()=>{});
  db.doc("tripPos/"+t.id).delete().catch(()=>{});tripPos.delete(t.id);
  tripTick(true);syncPush(true);
}
function tripStop(t){
  if(!t)return;
  if(share&&share.id===t.id)endShare();
  const now=Date.now();t.stage="stop";t.endedAt=now;t.updatedAt=now;
  db.doc("trips/"+t.id).update({stage:"stop",endedAt:now,updatedAt:now}).catch(()=>{});
  db.doc("tripPos/"+t.id).delete().catch(()=>{});tripPos.delete(t.id);
  tripTick(true);syncPush(true);
}
function tripReply(t,text){
  if(!t)return;
  const now=Date.now();t.reply={by:myId,text,at:now};
  db.doc("trips/"+t.id).update({reply:{by:myId,text,at:now},updatedAt:now}).catch(()=>{});
  pushTo([t.by],firstName(myId),text,"trip-"+t.id+"-r","./?trip="+t.id);
  if(tripUIOpen(t.id))tripPanel();else toast("Envoyé à "+firstName(t.by)+" : « "+text+" »");
}
/* réception : la liste des trajets, et la position de celui qu'on suit */
function onTripsSnap(snap){

    el("div",{class:"what"},(t.title||(S.ev&&S.ev.title)||"")+(S.stale&&!here?" · dernière position "+agoShort(S.age):"")),b);
}
/* liens directs (notifications) : ?trip=<id> ouvre le trajet, ?ev=<id> l'évènement */
let pendingLink=/[?&](trip|ev)=/.test(location.search)?location.search:null;
function runPendingLink(){
  if(!pendingLink||firstSnap||!tripsReady)return;
  const q=pendingLink;pendingLink=null;
  try{if(/[?&](trip|ev)=/.test(location.search))history.replaceState(null,"",location.pathname+location.hash);}catch(_){}
  setTimeout(()=>{if(!handleDeepLink(q))toast("Cet évènement n'existe plus.");},150);
}
function handleDeepLink(q){
  let p;try{p=new URLSearchParams(String(q||"").replace(/^[^?]*\?/,""));}catch(_){return false;}
  const tid=p.get("trip"),eid=p.get("ev");
  if(tid&&(trips.has(tid)||events.has(tid))){openTrip(tid);return true;}
  if(eid&&events.has(eid)){const e=events.get(eid);if(canStartTrip(e)||tripFor(eid))openTrip(eid);else openEventCard(eid);return true;}
  return false;
}
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("message",e=>{const d=e.data||{};
  if(d.type==="open"&&d.url){if(firstSnap||!tripsReady)pendingLink=d.url;else handleDeepLink(d.url);}});
// Together repasse à l'écran : la position repart tout de suite ; il s'en va : on prévient que la position devient estimée
document.addEventListener("visibilitychange",()=>{
  if(!share||share.local)return;
  if(document.visibilityState==="hidden"){
    const t=trips.get(share.id);
    if(tripLive(t)){if(share.lastFix)db.doc("tripPos/"+share.id).set({...share.lastFix,bg:true}).catch(()=>{});if(t.stage==="go")pauseNote(t,true);}
  }else{pauseNote(null,false);endWatch();share.watch=geoWatch();share.sentAt=0;keepAwake(true);}
});

/* ---------- Démarrage instantané : dernière copie de l'agenda gardée sur le téléphone ---------- */
const BOOT_KEY="a2.boot";let bootSaveT=null,booted=false;
function saveBoot(){
  clearTimeout(bootSaveT);
  bootSaveT=setTimeout(()=>{
    if(firstSnap||!coupleId||!myId)return;
    const from=Date.now()-60*864e5;
    const ev=[...events.values()].filter(e=>startOf(e).getTime()>from).sort((a,b)=>startOf(a)-startOf(b)).slice(0,600)
      .map(e=>{const o={...e};delete o.routeGeo;delete o.route;return o;});
    const data={v:1,c:coupleId,me:myId,at:Date.now(),couple,ev,wi:[...wishes.values()].slice(0,200),pl:[...places.values()].slice(0,100),sh:shopList,mem:[...memories.values()].slice(0,300).map(m=>{const o={...m};delete o.cover;return o;})};
    try{localStorage.setItem(BOOT_KEY,JSON.stringify(data));}
    catch(_){try{data.mem=[];data.ev=data.ev.slice(-200);localStorage.setItem(BOOT_KEY,JSON.stringify(data));}catch(_){}}
  },1200);
}
function bootFromCache(){
  try{
    const cid=lsGet(COUPLE_KEY);if(!cid)return false;
    const b=JSON.parse(localStorage.getItem(BOOT_KEY)||"null");
    if(!b||b.c!==cid||!Array.isArray(b.ev))return false;
    coupleId=cid;myId=b.me||null;user=userShim;couple=b.couple||null;
    events=new Map(b.ev.map(e=>[e.id,e]));
    wishes=new Map((b.wi||[]).map(w=>[w.id,w]));
    places=new Map((b.pl||[]).map(x=>[x.id,x]));
    memories=new Map((b.mem||[]).map(x=>[x.id,x]));
    if(b.sh&&Array.isArray(b.sh.items))shopList=b.sh;
    booted=true;render();
    return true;
  }catch(_){return false;}
}
(async function init(){
  registerSW();
  bootFromCache();
  const cfg=readFbConfig();
  if(!window.firebase){notice(booted?"Hors connexion : voici la dernière version de votre agenda.":"Connexion internet nécessaire au premier lancement.");render();return;}
  if(!cfg){showSetup();return;}
  try{firebase.initializeApp(cfg);}catch(e){}
  fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true});}catch(_){}
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(_){}
  fauth=firebase.auth();
  let u;
  try{
    u=await new Promise((res,rej)=>{const off=fauth.onAuthStateChanged(x=>{if(x){off();res(x);}else fauth.signInAnonymously().catch(rej);});});
  }catch(e){notice("Connexion impossible : active la connexion « Anonyme » dans Firebase Authentication. ("+(e&&e.code||e)+")");render();return;}
  myId=u.uid;user=userShim;
  const m=/join=([A-Z0-9]{6})/i.exec(location.hash||"");
  coupleId=lsGet(COUPLE_KEY);
  if(!coupleId){showPair(m?m[1].toUpperCase():"");return;}
  db=makeDb("couples/"+coupleId);
  fs.doc("couples/"+coupleId).onSnapshot(s=>{
    if(!s.exists){lsSet(COUPLE_KEY,null);lsSet(BOOT_KEY,null);location.reload();return;}
    couple=s.data();syncRecovery();if(events.size)scheduleRender();saveBoot();
  },e=>{notice("Accès à votre agenda impossible. Quitte puis rejoins-le avec le code.");});
  const hint=installHint();if(hint){const n=$("#notice");n.textContent="";n.append(...hint.childNodes);n.hidden=false;}
  db.collection("wishes").onSnapshot(snap=>{
    wishes=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    wishNotify(wishes);
    const bw=$("#btn-wish");bw.hidden=false;const n=wishList().filter(w=>!w.planned).length,td=wishTodos().length;bw.textContent=(td?"● ":"")+(n?"Nos envies ("+n+")":"Nos envies");
    if(openWishes.redraw)openWishes.redraw();updateTabs();
    scheduleRender();saveBoot();
  },()=>{});
  db.doc("config/shortcuts").onSnapshot(snap=>{scLinks=snap.exists?snap.data():{};},()=>{});
  db.collection("memories").onSnapshot(snap=>{
    memories=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    if(view==="mem")renderMemView();updateTabs();
    const bm=$("#btn-mem");bm.hidden=false;bm.textContent=memories.size?"Nos souvenirs ("+memories.size+")":"Nos souvenirs";
    if(events.size)scheduleRender();saveBoot();
  },()=>{});
  db.collection("places").onSnapshot(snap=>{
    places=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    refreshPlaceUI();scheduleRender();
  },()=>{});
  db.doc("config/templates").onSnapshot(snap=>{templates=snap.exists&&Array.isArray(snap.data().list)?snap.data().list:null;if(templatesRefresh)templatesRefresh();},()=>{});
  db.doc("config/brands").onSnapshot(snap=>{brands=snap.exists&&Array.isArray(snap.data().list)?snap.data().list:[];refreshBrandUI();},()=>{});
  startInbox();
  db.doc("config/shop").onSnapshot(snap=>{const x=snap.exists?snap.data():{};shopList={items:Array.isArray(x.items)?x.items:[],freq:x.freq&&typeof x.freq==="object"?x.freq:{}};scheduleRender();if(shopRefresh)shopRefresh();},()=>{});
  db.doc("config/home").onSnapshot(snap=>{if(snap.exists){const x=snap.data();settings={home:x.home||"",mode:x.mode||"car"};}},()=>{});
  db.collection("trips").onSnapshot(onTripsSnap,()=>{tripsReady=true;});
  db.collection("events").orderBy("startTs").onSnapshot(snap=>{
    if(!firstSnap){
      for(const ch of snap.docChanges()){
        const x=ch.doc.data()||{};
        if(ch.type==="removed") continue;
        if(x.updatedBy&&x.updatedBy!==myId&&!ch.doc.metadata.hasPendingWrites){
          const prev=events.get(ch.doc.id);
          const who=(couple&&couple.names&&couple.names[x.updatedBy])||"L'autre";
          if(!prev) toast(who+" a ajouté « "+x.title+" »");
          else if(prev.updatedAt!==x.updatedAt){
            const a=itemsOf(prev),b2=itemsOf(x),was=new Map(a.map(i=>[norm(i.t),i]));
            const took=b2.filter(i=>i.done&&!(was.get(norm(i.t))||{}).done&&was.has(norm(i.t))),added=b2.filter(i=>!was.has(norm(i.t)));
            if(took.length) toast(who+" a pris « "+took.map(i=>i.t).slice(0,3).join(", ")+" »"+(took.length>3?" et "+(took.length-3)+" autres":""));
            else if(added.length) toast(who+" a ajouté « "+added.map(i=>i.t).slice(0,3).join(", ")+" » à la liste");
            else if(JSON.stringify(a)===JSON.stringify(b2)) toast(who+" a modifié « "+x.title+" »");
          }
        }
      }
    }
    const wasFirst=firstSnap;firstSnap=false;
    events=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    if(wasFirst){maybeCalPopup();setTimeout(checkPush,1500);runPendingLink();}
    if(shopRefresh)shopRefresh();
    saveBoot();
    scheduleRender();
  },()=>notice("La synchronisation s'est interrompue. Vérifie ta connexion puis rouvre l'app."));
})();
</script>
