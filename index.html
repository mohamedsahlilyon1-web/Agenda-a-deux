const WISH_TAIL=/\s+(?:(?:à|a|dans)\s+(?:nos|les|mes)\s+envies|aux\s+envies)\s*[.!]?\s*$/i;

  if(tail)s=s.replace(WISH_TAIL,"").replace(/^\s*(?:ajoute|rajoute|mets|note)\s+/i,"");
  for(const re of WISH_LEAD){const m=s.match(re);if(m){s=s.slice(m[0].length);hit=true;break;}}

  const noWhen=!p||(p.assumed&&p.assumed.date&&p.assumed.time);
  if(!noWhen&&!tail)return null;
  const link=(s.match(/https?:\/\/[^\s<>"]+/)||[])[0]||"";
  s=s.replace(link,"").replace(/^(?:(?:à|a)\s+la\s+|(?:à|a)\s+l['’]\s*|au\s+|aux\s+|(?:à|a)\s+|en\s+|dans\s+)/i,"")

// Les moments libres pour vous deux, dans l'ordre : ce soir, demain soir, samedi après-midi…
function pickSlots(days){return freeSlots(days||8).flatMap(g=>g.free.map(x=>({...x,d:g.d}))).slice(0,12);}

// Le classement : ce qui ne colle pas du tout au moment est écarté (pluie pour une sortie dehors, zoo le soir,

    const k=motifOf({title:w.title}),tags=new Set(w.tags||[]),why=[];let s=0;

    if(evening&&dayOnly)continue;

// « Ça fait 3 semaines sans sortie à deux » : le vendredi à 18 h 30, si rien n'est prévu pour les 10 jours qui viennent
const OUTING_MOTIFS=new Set(["amour","fun","zoo","aqua","plage","neige","parc","visite","jeux","table","ecran","scene","voyage","fete"]);

  if((notifCfg&&notifCfg.nudgeOff)||memberIds().length<2)return null;

  if(!past)return null;

let pushBase=null,pushBaseP=null;
function pushUrl(){
  if(pushBase!==null)return Promise.resolve(pushBase);
  if(!pushBaseP)pushBaseP=(async()=>{
    for(const u of ["push.json?v="+Date.now(),"https://raw.githubusercontent.com/Mohamedsahlilyon1-web/agenda-a-deux/main/push.json?v="+Date.now()]){
      try{const r=await fetch(u,{cache:"no-store"});if(r.ok){const j=await r.json();if(j&&/^https:\/\//.test(j.url||"")){pushBase=j.url.replace(/\/$/,"");return pushBase;}}}catch(_){}

}

/* ---------- Calendrier Together : dans l'app Calendrier, donc sur l'écran CarPlay et pour Siri ----------

  return "X-APPLE-STRUCTURED-LOCATION;VALUE=URI;X-ADDRESS=\""+icsQ(addr)+"\";X-APPLE-RADIUS=70;X-TITLE=\""+icsQ(shortAddr(addr))+"\":geo:"+(+pt.lat)+","+(+pt.lon);

// Ce que voit chacun : ses évènements et ceux à deux, sauf ceux déjà copiés dans son propre calendrier
function calList(uid){
  const now=Date.now(),from=now-21*864e5,to=now+200*864e5;
  return [...events.values()].filter(e=>{const w=whoOf(e);if(w!=="both"&&w!==uid)return false;
      const t=startOf(e).getTime();if(!(t>=from&&t<=to))return false;

function calVevents(ev,uid){

  const dn=pk?firstName(driverOf(ev)):"",pn=pk?firstName(ev.pickupWho):"",title=ev.title||"Évènement";
  const other=memberIds().find(m=>m!==uid);

  if(pk){const at=pickupAt(ev);

// Pas d'alarme ici : les rappels arrivent déjà en notification (sinon ils sonneraient deux fois)
function calFeed(uid){

function computeOverlaps(list){
  const m=new Map(),sp=[];
  for(const e of list){if(!e||!e.date||isAllDay(e))continue;const [a,b]=busySpan(e);sp.push({e,a,b,p:peopleOf(e)});}
  sp.sort((x,y)=>x.a-y.a);
  const act=[];
  for(const s of sp){
    for(let i=act.length-1;i>=0;i--)if(act[i].b<=s.a)act.splice(i,1);
    for(const o of act)if(o.b>s.a&&s.p.some(x=>o.p.includes(x))){if(!m.has(s.e.id))m.set(s.e.id,o.e);if(!m.has(o.e.id))m.set(o.e.id,s.e);}
    act.push(s);
  }
  return m;
}

// Soirées en semaine ; matin, après-midi et soirée le week-end. Un créneau compte s'il reste au moins 1 h 30 sans rien pour vous deux.
const FREE_SLOTS={wk:[["Soirée","19:00","23:00"]],we:[["Matin","09:30","12:00"],["Après-midi","14:00","18:30"],["Soirée","19:00","23:00"]]};
function freeSlots(days){
  const out=[],now=Date.now(),ppl=memberIds();
  const spans=[...events.values()].filter(e=>e&&e.date&&!isAllDay(e)).map(e=>{const [a,b]=busySpan(e);return {a,b,p:peopleOf(e)};}).filter(x=>x.p.some(u=>ppl.includes(u)));
  const base=new Date();base.setHours(0,0,0,0);
  for(let i=0;i<days;i++){
    const d=new Date(base);d.setDate(base.getDate()+i);
    const key=ymd(d),we=d.getDay()===0||d.getDay()===6,free=[];
    for(const [lab,f,t] of (we?FREE_SLOTS.we:FREE_SLOTS.wk)){
      const a=new Date(key+"T"+f+":00").getTime(),b=new Date(key+"T"+t+":00").getTime();
      const a2=Math.max(a,Math.ceil(now/1800000)*1800000);if(b-a2<90*60000)continue;
      let segs=[[a2,b]];
      for(const x of spans){if(x.b<=a2||x.a>=b)continue;segs=segs.flatMap(([u,v])=>x.b<=u||x.a>=v?[[u,v]]:[[u,x.a],[x.b,v]].filter(([p,q])=>q-p>0));}
      const best=segs.sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]))[0];
      if(best&&best[1]-best[0]>=90*60000)free.push({lab,date:key,from:hhmm(new Date(best[0])),to:hhmm(new Date(best[1]))});
    }
    if(free.length)out.push({d,key,free,notes:[...events.values()].filter(e=>e.date===key&&isAllDay(e)).map(e=>e.title).slice(0,2)});
  }

}

/* ---------- Services réels : adresses (BAN / IGN), itinéraires (IGN), magasins (OpenStreetMap) ---------- */
const GEO="https://data.geopf.fr/geocodage", BAN="https://api-adresse.data.gouv.fr", ROUTE="https://data.geopf.fr/navigation/itineraire";
const DEF_MARGIN={medecin:15,rdv:10,travail:10,sortie:5,courses:0,autre:5};
const DEF_DUR={medecin:45,rdv:60,travail:60,sortie:120,courses:60,autre:60};
function sampleErr(e){return (e&&e.name==="AbortError")?"":"Service indisponible. Vérifie ta connexion internet et réessaie.";}
async function getJson(url,signal,ms=7000,opts){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  if(signal){if(signal.aborted)ctl.abort();else signal.addEventListener("abort",()=>ctl.abort());}
  try{const r=await fetch(url,{...(opts||{}),signal:ctl.signal,headers:{Accept:"application/json",...((opts&&opts.headers)||{})}});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}

const geoCache=new Map();
function rememberGeo(label,lat,lon){if(label&&Number.isFinite(+lat)&&Number.isFinite(+lon))geoCache.set(norm(label),{lat:+lat,lon:+lon,label});}
function featLabel(f){const p=f.properties||{};const city=[p.postcode,p.city].filter(Boolean).join(" ");if(p.type==="municipality")return p.label;return p.name&&city?p.name+", "+city:p.label;}

async function homeCoords(){
  const h=homeAddr();if(!h)return null;
  const p=defaultHome();if(p&&p.lat)return {lat:p.lat,lon:p.lon};
  if(homeGeo&&homeGeo.addr===h)return homeGeo;
  const r=await searchAddresses(h,null,null).catch(()=>[]);
  if(r.length){homeGeo={lat:r[0].lat,lon:r[0].lon,addr:h};return homeGeo;}
  return null;

async function searchAddresses(q,signal,near){
  q=String(q||"").trim();if(q.length<3)return [];
  if(near===undefined) near=await homeCoords().catch(()=>null);
  const bias=near?`&lat=${near.lat}&lon=${near.lon}`:"";const enc=encodeURIComponent(q);
  const a=getJson(`${GEO}/search?q=${enc}&limit=5&autocomplete=1${bias}`,signal)
    .catch(()=>getJson(`${BAN}/search/?q=${enc}&limit=5&autocomplete=1${bias}`,signal))
    .then(j=>(j.features||[]).map(f=>({address:featLabel(f),name:"",lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}))).catch(()=>[]);
  const p=getJson(`${GEO}/completion?text=${enc}&type=PositionOfInterest&maximumResponses=4${near?`&lonlat=${near.lon},${near.lat}`:""}`,signal)
    .then(j=>(j.results||[]).filter(r=>r.kind!=="street"&&r.fulltext).map(r=>({address:r.fulltext,name:"",lat:r.y,lon:r.x}))).catch(()=>[]);
  const [x,y]=await Promise.all([a,p]);
  const seen=new Set();
  const out=[...x,...y].filter(r=>{const k=norm(r.address);if(!r.address||!Number.isFinite(r.lat)||seen.has(k))return false;seen.add(k);return true;}).slice(0,7);
  out.forEach(r=>rememberGeo(r.address,r.lat,r.lon));

async function geocode(text){
  const k=norm(text);if(!k)return null;

  const p=placeFor(text);if(p&&p.lat){rememberGeo(p.address,p.lat,p.lon);return geoCache.get(k);}
  const r=await searchAddresses(text);
  if(!r.length)return null;
  const g={lat:r[0].lat,lon:r[0].lon,label:r[0].address};geoCache.set(k,g);return g;

function decodePolyline(str){
  const pts=[];let i=0,lat=0,lng=0;

    let b,shift=0,res=0;do{b=str.charCodeAt(i++)-63;res|=(b&0x1f)<<shift;shift+=5;}while(b>=0x20);lat+=res&1?~(res>>1):res>>1;

async function computeTrip(from,to,mode,arriveAt){

    const j=await getJson(`${srv}/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=polyline`,null,15000);

      travelNote:fmtDur(a.travelMin)+" jusqu'à "+nm+(wait?", "+wait+" min sur place":"")+", puis "+fmtDur(b.travelMin)+" jusqu'au rendez-vous",

/* ---------- Address suggestions ---------- */
const norm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const KIND_LABEL={home:"Maison",work:"Travail",place:"Lieu"};
function placesSorted(order){
  const o=order||{home:0,work:1,place:2};
  return [...places.values()].sort((a,b)=>(o[a.kind]??2)-(o[b.kind]??2)||String(a.name).localeCompare(String(b.name),"fr"));

function defaultHome(){const hs=placesSorted().filter(p=>p.kind==="home");return hs.find(p=>p.isDefault)||hs[0]||null;}
function isDefaultHome(p){const h=defaultHome();return !!h&&h.id===p.id;}
function homeAddr(){const h=defaultHome();return h?h.address:(settings.home||"");}
function placeFor(addr){const n=norm(addr);return n?placesSorted().find(p=>norm(p.address)===n):null;}
function knownPlaces(){

const SVGNS="http://www.w3.org/2000/svg";

function routeMap(g,ev){

async function saveEventDraft(x,d,repeat,opts){
  const quiet=!!(opts&&opts.quiet);
  if(!x.title){toast("Donne un titre à l'évènement.");return false;}
  if(!x.date||!x.time){toast("Indique la date et l'heure.");return false;}
  if(!db){toast("Synchronisation indisponible. Vérifie ta connexion.");return false;}
  const isNew=!d.id;
  try{
    const rp=REPEATS[repeat]||REPEATS.none;
    if(isNew&&rp[2]>0){
      const seriesId="s"+Date.now().toString(36);
      const base=startOf(x),dates=[],days=repeat==="week"?repDaysOf(x):null;
      // « tous les mardis et jeudis » : chaque jour choisi, pendant 8 semaines
      if(days){for(let i=0;i<rp[2]*7;i++){const dt=new Date(base);dt.setDate(dt.getDate()+i);if(i===0||days.includes(dt.getDay()))dates.push(dt);}}
      else for(let i=0;i<rp[2];i++){
        const dt=new Date(base);
        if(repeat==="year"){dt.setDate(1);dt.setFullYear(base.getFullYear()+i);dt.setDate(Math.min(base.getDate(),new Date(dt.getFullYear(),base.getMonth()+1,0).getDate()));}
        else if(repeat==="month"){const day=base.getDate();dt.setDate(1);dt.setMonth(base.getMonth()+i);dt.setDate(Math.min(day,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()));}
        else dt.setDate(dt.getDate()+rp[1]*i);
        dates.push(dt);
      }
      const extra=repeat==="year"&&!(x.reminders||[]).some(r=>+r.day===7)?{reminders:[...(x.reminders||[]),{day:7,at:"18:00",label:"Dans une semaine : "+(x.title||"date importante")}]}:{};
      for(const dt of dates) await db.doc("events/"+db.collection("events").doc().id).set(buildBody(x,d,{date:ymd(dt),seriesId,...extra}));
      const how=repeatText(x,repeat).replace(/\s*\([^)]*\)$/,"").toLowerCase();
      if(!quiet){toast(dates.length+" évènements créés ("+how+")");
        pushOther("Nouveau : "+x.title,firstName(myId)+" a ajouté « "+x.title+" » ("+how+").","ev",{k:"add",t:x.title,when:"("+how+")"});}
    }else{
      await db.doc("events/"+(d.id||db.collection("events").doc().id)).set(buildBody(x,d));
      if(!quiet){pushOther((isNew?"Nouveau : ":"Modifié : ")+x.title,isNew?firstName(myId)+" a ajouté « "+x.title+" », "+dayParts(startOf(x))[0].toLowerCase()+" à "+x.time+".":changeText(d,x),"ev",{k:isNew?"add":"edit",t:x.title,when:dayWord(startOf(x))+(isAllDay(x)?"":" à "+x.time)});
        toast(isNew?"Enregistré, visible sur vos deux téléphones":"Modifications enregistrées pour vous deux");}
    }
    $("#input").value="";
    return true;
  }catch(e){toast(e&&e.code==="invalid_argument"?"Enregistrement refusé. Vérifie que tu as bien rejoint l'agenda.":"Enregistrement impossible. Réessaie.");return false;}
}

/* ---------- Lecture des phrases en français (sans connexion) ---------- */
const parseText=(()=>{
// Lecture d'une phrase en français : "Dentiste vendredi 14h30 12 rue de la République à Lyon"
// -> { title, category, date, time, location, origin, ... }. Aucune connexion nécessaire.

const DEFAULT_TIME = { medecin: '09:00', rdv: '10:00', travail: '09:00', sortie: '20:00', courses: '10:00', autre: '10:00' };

const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const WEEKDAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MONTHS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
const STREET = '(?:rue|avenue|av\\.?|boulevard|bd|place|pl\\.|chemin|allee|impasse|quai|route|rte|cours(?!\\s*$|\\s+(?:de|d\'|du|des|particuliers?|collectifs?|qui|en|a|au|avec|pour|ce|cet|cette|le|la|les|demain|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|\\d)\\b)|square|residence|rond-point|lotissement|faubourg|passage|esplanade|promenade)';

const CAT_WORDS = {
  medecin: ['medecin', 'docteur', 'dr ', 'dentiste', 'kine', 'osteo', 'ophtalmo', 'dermato', 'gyneco', 'pediatre', 'hopital', 'clinique', 'pharmacie', 'radio', 'irm', 'scanner', 'analyse', 'prise de sang', 'labo', 'vaccin', 'orthodontiste', 'psy', 'veterinaire', 'veto', 'sage-femme', 'echographie'],
  courses: ['courses', 'supermarche', 'carrefour', 'leclerc', 'auchan', 'lidl', 'intermarche', 'monoprix', 'casino', 'franprix', 'marche', 'drive', 'boulangerie', 'ikea', 'magasin', 'shopping'],
  sortie: ['resto', 'restaurant', 'cinema', 'cine', 'bar', 'concert', 'soiree', 'anniversaire', 'anniv', 'apero', 'theatre', 'musee', 'balade', 'diner', 'dejeuner', 'brunch', 'spectacle', 'match', 'piscine', 'plage', 'zoo', 'expo', 'mariage', 'bowling', 'sport', 'salle de sport'],
  travail: ['reunion', 'travail', 'boulot', 'bureau', 'entretien', 'rendez-vous client', 'formation', 'seminaire'],
  rdv: ['rdv', 'rendez-vous', 'rendez vous', 'banque', 'notaire', 'mairie', 'prefecture', 'garage', 'coiffeur', 'controle technique', 'avocat', 'assurance', 'poste'],
};

function guessCategory(low) {
  for (const cat of ['medecin', 'courses', 'sortie', 'travail', 'rdv']) {
    if (CAT_WORDS[cat].some((w) => new RegExp('(^|[^a-z])' + w.replace(/[-]/g, '[- ]').trim() + '([^a-z]|$)').test(low))) return cat;
  }
  return 'autre';
}

function nextWeekday(now, wd, allowToday) {
  const d = new Date(now); d.setHours(0, 0, 0, 0);
  let diff = (wd - d.getDay() + 7) % 7;
  if (diff === 0 && !allowToday) diff = 7;
  d.setDate(d.getDate() + diff);
  return d;
}

function parseText(text, opts = {}) {
  const now = opts.now ? new Date(opts.now) : new Date();
  const places = opts.places || [];
  const orig = String(text || '').replace(/\s+/g, ' ').trim();
  const low = strip(orig).replace(/[’‘]/g, "'");
  const spans = []; // [start, end) to remove from the title
  const take = (m, idx) => { spans.push([idx, idx + m.length]); };
  const blockedSpan = (i) => spans.some(([a, b]) => i >= a && i < b);

  // ---------- durée : « pendant 2 h », « pendant 1h30 », « pendant 45 min », « pendant une heure et demie » ----------
  let durationMin = null, allDay = false;
  {
    const r = /\b(?:pendant|durant|duree\s*(?:de|:)?|qui\s+dure|dure)\s+(?:(\d{1,2})\s*h(?:eures?)?\s*(?:et\s+)?([0-5]\d)?(?:\s*min(?:utes?)?)?|(\d{1,3})\s*(?:min(?:utes?)?|mn)|(une|1)\s+heure(?:\s+et\s+demie)?|(?:une\s+)?demi[- ]heure|(deux|trois|quatre|cinq)\s+heures)\b/.exec(low);
    if (r) {
      let du = null;
      if (r[1]) du = (+r[1]) * 60 + (r[2] ? +r[2] : 0);
      else if (r[3]) du = +r[3];
      else if (r[4]) du = /demie/.test(r[0]) ? 90 : 60;
      else if (r[5]) du = { deux: 120, trois: 180, quatre: 240, cinq: 300 }[r[5]];
      else if (/demi/.test(r[0])) du = 30;
      if (du > 0 && du <= 24 * 60) { durationMin = du; take(r[0], r.index); }
    }
    const ad = /\b(?:toute\s+la\s+journee|(?:la\s+)?journee\s+entiere)\b/.exec(low);
    if (ad) { allDay = true; take(ad[0], ad.index); }
  }
  // ---------- heure ----------
  let time = null, timeIdx = -1, m = null;
  const mins = (h, mi) => (+h) * 60 + (mi ? +mi : 0);
  // plage : « de 14h à 16h », « 9h30-10h15 », « entre 14h et 16h »
  {
    const T = '([01]?\\d|2[0-3])\\s*(?:h|:)\\s*([0-5]\\d)?';
    for (const re of [new RegExp('\\bentre\\s+' + T + '\\s+et\\s+' + T + '(?![\\d/])'), new RegExp('\\b(?:de\\s+)?' + T + '\\s*(?:a|-|–|jusqu\'?a)\\s*' + T + '(?![\\d/])')]) {
      const r = re.exec(low);
      if (r && !blockedSpan(r.index)) {
        let du = mins(r[3], r[4]) - mins(r[1], r[2]); if (du <= 0) du += 24 * 60;
        if (du <= 16 * 60) { time = pad(+r[1]) + ':' + pad(r[2] ? +r[2] : 0); timeIdx = r.index; take(r[0], r.index); if (durationMin == null) durationMin = du; break; }
      }
    }
  }
  if (!time) {
    const re = /(?:\b(?:a|vers|pour|des)\s+)?\b([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)?(?![\d/])/g;
    let r;
    while ((r = re.exec(low))) { if (blockedSpan(r.index + r[0].length - 1)) continue; time = pad(+r[1]) + ':' + pad(r[2] ? +r[2] : 0); timeIdx = r.index; take(r[0], r.index); break; }
  }
  // « … 16h jusqu'à 18h »
  if (time && durationMin == null) {
    const r = /\bjusqu'?\s*(?:a|au)\s+([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)?(?![\d/])/.exec(low);
    if (r && !blockedSpan(r.index)) { const [h0, m0] = time.split(':'); let du = mins(r[1], r[2]) - mins(h0, m0); if (du <= 0) du += 24 * 60; if (du <= 16 * 60) { durationMin = du; take(r[0], r.index); } }
  }
  if (!time && (m = /\b(?:a\s+)?midi\b/.exec(low)) && !/apres-?\s?midi/.test(low.slice(Math.max(0, m.index - 6), m.index + 5))) { time = '12:00'; timeIdx = m.index; take(m[0], m.index); }
  if (!time && (m = /\b(?:a\s+)?minuit\b/.exec(low))) { time = '23:59'; timeIdx = m.index; take(m[0], m.index); }

  // ---------- date ----------
  let date = null, dateIdx = -1;
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const plus = (n) => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
  const tryDate = (re, fn) => {
    if (date) return;
    const r = re.exec(low);
    if (r) { const d = fn(r); if (d && !isNaN(d)) { date = d; dateIdx = r.index; take(r[0], r.index); } }
  };
  let repeat = null, repTime = null, repDays = null, repDay = 0;
  {
    const WD = WEEKDAYS.join('|'), dim = (y, mo) => new Date(y, mo + 1, 0).getDate();
    const wdList = (t) => [...new Set([...t.matchAll(new RegExp('(' + WD + ')', 'g'))].map((x) => WEEKDAYS.indexOf(x[1])))];
    let r;
    if ((r = new RegExp('\\b(?:tous\\s+les|chaque)\\s+((?:' + WD + ')s?(?:\\s*(?:,|et)\\s*(?:les?\\s+)?(?:' + WD + ')s?)*)\\b').exec(low))) {
      repeat = 'week'; repDays = wdList(r[1]); take(r[0], r.index); dateIdx = r.index;
    }
    else if ((r = /\b(?:du\s+lundi\s+au\s+vendredi|en\s+semaine|tous\s+les\s+jours\s+de\s+la\s+semaine|les\s+jours\s+de\s+semaine)\b/.exec(low))) { repeat = 'week'; repDays = [1, 2, 3, 4, 5]; take(r[0], r.index); dateIdx = r.index; }
    else if ((r = new RegExp('\\b(?:un|1)\\s+(' + WD + ')\\s+sur\\s+(?:deux|2)\\b').exec(low))) { repeat = 'week2'; repDays = [WEEKDAYS.indexOf(r[1])]; take(r[0], r.index); dateIdx = r.index; }
    else if ((r = /\b(?:toutes\s+les\s+(?:deux|2)\s+semaines|une\s+semaine\s+sur\s+deux|tous\s+les\s+(?:quinze|15)\s+jours)\b/.exec(low))) { repeat = 'week2'; take(r[0], r.index); }
    else if ((r = /\b(?:toutes\s+les\s+semaines|chaque\s+semaine|une\s+fois\s+par\s+semaine)\b/.exec(low))) { repeat = 'week'; take(r[0], r.index); }
    else if ((r = /\b(?:le\s+)?(1er|\d{1,2})\s+(?:de\s+)?(?:chaque|tous\s+les)\s+mois\b/.exec(low)) || (r = /\b(?:tous\s+les|chaque)\s+(1er|\d{1,2})\s+du\s+mois\b/.exec(low))) {
      const n = r[1] === '1er' ? 1 : +r[1];
      if (n >= 1 && n <= 31) {
        repeat = 'month'; repDay = n;
        let d = new Date(now.getFullYear(), now.getMonth(), Math.min(n, dim(now.getFullYear(), now.getMonth())));
        if (d < today) { const y = now.getMonth() === 11 ? now.getFullYear() + 1 : now.getFullYear(), mo = (now.getMonth() + 1) % 12; d = new Date(y, mo, Math.min(n, dim(y, mo))); }
        date = d; dateIdx = r.index; take(r[0], r.index);

// « https://maps.apple.com/place?address=…&name=Café des Arts » devient « Café des Arts, 12 rue … »
function sharedText(t){
  t=String(t||"").replace(/\r/g,"").trim();
  if(/BEGIN:VCARD/i.test(t)){
    const fn=(/^FN[^:]*:(.+)$/im.exec(t)||[])[1]||"",adr=(/^(?:item\d+\.)?ADR[^:]*:(.+)$/im.exec(t)||[])[1]||"";
    const a=adr.split(";").map(x=>x.replace(/\\n/g," ").replace(/\\,/g,",").trim()).filter(Boolean);
    const v=[fn.trim(),a.length?a.slice(0,1).concat(a.slice(1).join(" ")).join(", "):""].filter(Boolean).join(", ");
    if(v)t=v;
  }
  t=t.replace(/https?:\/\/[^\s<>"]+/g,u=>{
    let x;try{x=new URL(u);}catch(_){return u;}
    const h=x.hostname.replace(/^www\./,""),q=k=>(x.searchParams.get(k)||"").trim();
    if(/(^|\.)maps\.apple\.com$/.test(h)){const name=q("name")||q("q"),addr=q("address")||q("daddr");
      return [name,addr&&norm(addr)!==norm(name)?addr:""].filter(Boolean).join(", ")||u;}
    if((/(^|\.)google\.[a-z.]+$/.test(h)&&/^\/maps/.test(x.pathname))||/^maps\.google\./.test(h)){
      const m=/\/maps\/place\/([^/@]+)/.exec(x.pathname);let name="";try{name=m?decodeURIComponent(m[1].replace(/\+/g," ")):"";}catch(_){}

}

    const m=S.eta?Math.max(0,Math.round((S.eta-now)/60000)):null;
    // le conducteur (CarPlay, « En cours de lecture ») voit son arrivée chez l'autre ; l'autre voit l'arrivée du conducteur
    title=drv?(S.eta?({pick:"Chez "+to+" à ",meet:"Arrivée à ",home:"À la maison à "}[tripKind(t)])+hhmm(new Date(S.eta)):"Vers "+to):by+(S.eta?" arrive à "+hhmm(new Date(S.eta)):" est en route");
    artist=[S.stale?"Dernière position "+agoShort(S.age):m==null?"":m<=0?"Arrivée imminente":"Dans "+fmtDur(m),S.remain!=null&&S.remain>0?kmTxt(S.remain):""].filter(Boolean).join(" · ");
  }
  // la ligne du dessous dit ce que fait ⏭ (ou que c'est envoyé)
  const q=TRIP_QUICK[tripKind(t)][0],sent=L.sent&&now-L.sentAt<5*60000?L.sent:"";
  const album=t.to===myId?(sent?"« "+sent+" » envoyé à "+by:"⏭ = « "+q+" »"):(t.by===myId&&S.phase==="go"?"⏭ à l'arrivée = « "+arriveTxt(t,"").trim().replace(/^est /,"Je suis ").replace(/^Je suis là$/,"Je suis là")+" »":"Together · "+(t.title||"trajet"));
  const artKey=[S.phase,Math.round((S.done||0)*30),S.eta?hhmm(new Date(S.eta)):"",S.stale?1:0,S.remain!=null?Math.round(S.remain/100):""].join("|");
  if(force||artKey!==L.artKey||!L.art){L.artKey=artKey;L.art=lockArt(S);}
  const key=[title,artist,L.artKey].join("|");
  try{
    if(force||key!==L.key){L.key=key;
      navigator.mediaSession.metadata=new MediaMetadata({title,artist,album,artwork:[{src:L.art,sizes:"384x384",type:L.art.startsWith("data:image/jpeg")?"image/jpeg":"image/png"}]});}
    navigator.mediaSession.playbackState="playing";
    // barre de progression de l'écran verrouillé = le trajet ; le temps restant affiché est celui avant l'arrivée
    if(navigator.mediaSession.setPositionState){
      if(S.phase==="go"&&S.eta&&t.startedAt){const dur=Math.max(60,(Math.max(S.eta,now)-t.startedAt)/1000);
        navigator.mediaSession.setPositionState({duration:dur,position:Math.min(dur,Math.max(0,(now-t.startedAt)/1000)),playbackRate:1});}
      else if(S.phase==="here"){navigator.mediaSession.setPositionState({duration:60,position:60,playbackRate:1});}
    }
  }catch(_){}
}

/* ---------- Démarrage instantané : dernière copie de l'agenda gardée sur le téléphone ---------- */
const BOOT_KEY="a2.boot";let bootSaveT=null,booted=false;
function saveBoot(){
  clearTimeout(bootSaveT);
  bootSaveT=setTimeout(()=>{
    if(firstSnap||!coupleId||!myId)return;
    const from=Date.now()-60*864e5;
    const ev=[...events.values()].filter(e=>startOf(e).getTime()>from).sort((a,b)=>startOf(a)-startOf(b)).slice(0,600)
      .map(e=>{const o={...e};delete o.routeGeo;delete o.route;return o;});
    const data={v:1,c:coupleId,me:myId,at:Date.now(),couple,ev,wi:[...wishes.values()].slice(0,200),pl:[...places.values()].slice(0,100),sh:shopList,mem:[...memories.values()].slice(0,300).map(m=>{const o={...m};delete o.cover;return o;})};
    try{localStorage.setItem(BOOT_KEY,JSON.stringify(data));}
    catch(_){try{data.mem=[];data.ev=data.ev.slice(-200);localStorage.setItem(BOOT_KEY,JSON.stringify(data));}catch(_){}}
  },1200);
}
function bootFromCache(){
  try{
    const cid=lsGet(COUPLE_KEY);if(!cid)return false;
    const b=JSON.parse(localStorage.getItem(BOOT_KEY)||"null");
    if(!b||b.c!==cid||!Array.isArray(b.ev))return false;
    coupleId=cid;myId=b.me||null;user=userShim;couple=b.couple||null;
    events=new Map(b.ev.map(e=>[e.id,e]));
    wishes=new Map((b.wi||[]).map(w=>[w.id,w]));
    places=new Map((b.pl||[]).map(x=>[x.id,x]));
    memories=new Map((b.mem||[]).map(x=>[x.id,x]));
    if(b.sh&&b.sh.list&&typeof b.sh.list==="object")shopList=normShop(b.sh);
    booted=true;render();
    return true;
  }catch(_){return false;}
}
(async function init(){
  registerSW();
  bootFromCache();
  const cfg=readFbConfig();
  if(!window.firebase){notice(booted?"Hors connexion : voici la dernière version de votre agenda.":"Connexion internet nécessaire au premier lancement.");render();return;}
  if(!cfg){showSetup();return;}
  try{firebase.initializeApp(cfg);}catch(e){}
  fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,experimentalAutoDetectLongPolling:true,merge:true});}catch(_){}
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});}catch(_){}
  fauth=firebase.auth();
  let u;
  try{
    u=await new Promise((res,rej)=>{const off=fauth.onAuthStateChanged(x=>{if(x){off();res(x);}else fauth.signInAnonymously().catch(rej);});});
  }catch(e){notice("Connexion impossible : active la connexion « Anonyme » dans Firebase Authentication. ("+(e&&e.code||e)+")");render();return;}
  myId=u.uid;user=userShim;
  const m=/join=([A-Z0-9]{6})/i.exec(location.hash||"");
  coupleId=lsGet(COUPLE_KEY);
  if(!coupleId){showPair(m?m[1].toUpperCase():"");return;}
  db=makeDb("couples/"+coupleId);
  fs.doc("couples/"+coupleId).onSnapshot(s=>{
    if(!s.exists){lsSet(COUPLE_KEY,null);lsSet(BOOT_KEY,null);location.reload();return;}
    couple=s.data();syncRecovery();if(events.size)scheduleRender();saveBoot();
  },e=>{notice("Accès à votre agenda impossible. Quitte puis rejoins-le avec le code.");});
  const hint=installHint();if(hint){const n=$("#notice");n.textContent="";n.append(...hint.childNodes);n.hidden=false;}
  db.collection("wishes").onSnapshot(snap=>{
    wishes=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    wishNotify(wishes);
    const bw=$("#btn-wish");bw.hidden=false;const n=wishList().filter(w=>!w.planned).length,td=wishTodos().length;bw.textContent=(td?"● ":"")+(n?"Nos envies ("+n+")":"Nos envies");
    if(openWishes.redraw)openWishes.redraw();updateTabs();
    scheduleRender();saveBoot();
  },()=>{});
  db.doc("config/shortcuts").onSnapshot(snap=>{scLinks=snap.exists?snap.data():{};},()=>{});
  db.doc("config/notif").onSnapshot(snap=>{notifCfg=snap.exists?snap.data():{};syncPush();},()=>{});
  db.doc("config/budget").onSnapshot(snap=>{budgetCfg=snap.exists?snap.data():{};if(openWishes.redraw)openWishes.redraw();scheduleRender();},()=>{});
  db.collection("memories").onSnapshot(snap=>{
    memories=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    if(view==="mem")renderMemView();updateTabs();
    const bm=$("#btn-mem");bm.hidden=false;bm.textContent=memories.size?"Nos souvenirs ("+memories.size+")":"Nos souvenirs";
    if(events.size)scheduleRender();saveBoot();
  },()=>{});
  db.collection("places").onSnapshot(snap=>{
    places=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    refreshPlaceUI();scheduleRender();
  },()=>{});
  db.doc("config/templates").onSnapshot(snap=>{templates=snap.exists&&Array.isArray(snap.data().list)?snap.data().list:null;if(templatesRefresh)templatesRefresh();},()=>{});
  db.doc("config/brands").onSnapshot(snap=>{brands=snap.exists&&Array.isArray(snap.data().list)?snap.data().list:[];refreshBrandUI();},()=>{});
  startInbox();
  db.doc("config/shop").onSnapshot(snap=>{const x=snap.exists?snap.data():{};const prev=shopList;shopRaw=x;shopList=normShop(x);
    try{shopNews(prev,shopList,snap);}catch(_){}
    migrateShop(x);scheduleRender();if(shopRefresh)shopRefresh();},()=>{});
  db.doc("config/home").onSnapshot(snap=>{if(snap.exists){const x=snap.data();settings={home:x.home||"",mode:x.mode||"car"};}},()=>{});
  db.collection("trips").onSnapshot(onTripsSnap,()=>{tripsReady=true;});
  db.collection("events").orderBy("startTs").onSnapshot(snap=>{
    if(!firstSnap){
      for(const ch of snap.docChanges()){
        const x=ch.doc.data()||{};
        if(ch.type==="removed") continue;
        if(x.updatedBy&&x.updatedBy!==myId&&!ch.doc.metadata.hasPendingWrites){
          const prev=events.get(ch.doc.id);
          const who=(couple&&couple.names&&couple.names[x.updatedBy])||"L'autre";
          if(!prev) toast(who+" a ajouté « "+x.title+" »");
          else if(prev.updatedAt!==x.updatedAt){
            if(x.shopDone&&!prev.shopDone) toast(who+" a fini les courses");
            else toast(who+" a modifié « "+x.title+" »");
          }
        }
      }
    }
    const wasFirst=firstSnap;firstSnap=false;
    events=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    if(wasFirst){maybeCalPopup();setTimeout(checkPush,1500);runPendingLink();setTimeout(()=>checkAdds(true),1500);}
    if(shopRefresh)shopRefresh();
    migrateShop(shopRaw);
    saveBoot();
    scheduleRender();
  },()=>notice("La synchronisation s'est interrompue. Vérifie ta connexion puis rouvre l'app."));
})();
</script>
