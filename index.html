<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Together">
<meta name="theme-color" content="#EDEEF5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
.lmap{height:210px;cursor:pointer}
.lmap .leaflet-control-attribution{font-size:9px}
.dur-bubble span{display:inline-block;transform:translate(10px,-34px);background:var(--route);color:#fff;font:800 13px var(--f);padding:4px 10px;border-radius:13px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lmap .leaflet-tile{filter:brightness(.75) contrast(1.1) saturate(.7)}}
.setup{display:flex;flex-direction:column;gap:14px;padding-block:8px}
.setup h2{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.02em}
.setup p{margin:0;font-size:1rem}
.pair-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px}
.pair-in{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:12px;font-size:1.05rem;width:100%;min-width:0;color:var(--ink)}
.pair-in.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800}
.big-code{font-size:2.6rem;font-weight:800;letter-spacing:.25em;text-align:center;color:var(--line);border:2px dashed var(--line);border-radius:18px;padding:14px 8px}
</style>
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Polices chargées sans bloquer l'affichage : l'app s'ouvre tout de suite, même avec un réseau lent -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..800,0..100;1,9..144,500..800,0..100&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..800,0..100;1,9..144,500..800,0..100&display=swap"></noscript>
<style>
/* Layout: a transit-line timeline. Each outing is a stop on a vertical line: a yellow "départ" stop, then the arrival stop. Rows slide left to reveal Modifier / Supprimer. */
:root{
  --bg:#EDEEF5; --surface:#FFFFFF; --ink:#16163A; --muted:#606181; --hair:#DCDDEA;
  --line:#4338CA; --line-ink:#FFFFFF; --sun:#FFB547; --sun-ink:#2B1800;
  --danger:#D9344F; --danger-ink:#FFFFFF; --ok:#4338CA; --ok-soft:#E5E4FA; --warn:#B4600E;
  --scrim:rgba(12,10,40,.45);
  --map:#E9EAF1; --map-grid:#DDDFEA; --map-text:#5C5E7A; --road:#3B5BDB; --route:#4F46E5; --route-case:#FFFFFF; --go:#2FA84F;
  --f:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --c-rdv:#3F67D6; --c-sortie:#A64BC4; --c-medecin:#D2455A; --c-courses:#1F9A5E; --c-travail:#677580; --c-autre:#C98A12;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0E1C; --surface:#171930; --ink:#ECECF7; --muted:#9A9BB8; --hair:#272A45;
  --line:#8B84FF; --line-ink:#0F0C2E; --sun:#FFB547; --sun-ink:#2B1800;
  --danger:#F0607A; --danger-ink:#22040B; --ok:#A9A4FF; --ok-soft:#221F45; --warn:#F0A75A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
  --map:#15172A; --map-grid:#1E2138; --map-text:#A3A5C2; --road:#5B7BF0; --route:#8B84FF; --route-case:#0D0E1C; --go:#2FA84F}}
:root[data-theme="dark"]{
  --bg:#0D0E1C; --surface:#171930; --ink:#ECECF7; --muted:#9A9BB8; --hair:#272A45;
  --line:#8B84FF; --line-ink:#0F0C2E; --sun:#FFB547; --sun-ink:#2B1800;
  --danger:#F0607A; --danger-ink:#22040B; --ok:#A9A4FF; --ok-soft:#221F45; --warn:#F0A75A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
  --map:#15172A; --map-grid:#1E2138; --map-text:#A3A5C2; --road:#5B7BF0; --route:#8B84FF; --route-case:#0D0E1C; --go:#2FA84F}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--line);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:none}
h1{font-weight:800;font-size:1.55rem;letter-spacing:-.025em;margin:0;line-height:1}
.round{border:1px solid var(--hair);background:var(--surface);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:var(--ink)}
.round svg{width:20px;height:20px}

/* composer */
.composer{background:var(--surface);border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--hair)}
.composer textarea{width:100%;min-height:64px;resize:none;border:none;background:transparent;font-size:1.08rem;outline:none;line-height:1.4}
.composer textarea::placeholder{color:var(--muted)}
.composer .row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn.primary{background:var(--line);border-color:var(--line);color:var(--line-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding-inline:6px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn:disabled{opacity:.55;cursor:default}
.notice{border-radius:14px;padding:10px 14px;font-size:.9rem;background:var(--ok-soft);color:var(--ink)}

/* next departure sign */
.sign{background:var(--sun);color:var(--sun-ink);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:end}
.sign .k{font-size:.88rem;font-weight:500}
.sign .what{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.sign .big{grid-column:2;grid-row:1 / span 2;font-weight:800;font-size:2.4rem;letter-spacing:-.03em;line-height:1;text-align:right}
.sign .in{grid-column:1 / -1;font-size:.86rem}

/* day + timeline */
.days{display:flex;flex-direction:column;gap:26px}
.day h2{font-size:1.2rem;font-weight:800;letter-spacing:-.015em;margin:0 0 10px}
.day h2 span{font-weight:500;color:var(--muted)}
.stops{display:flex;flex-direction:column;gap:10px}

.swipe{position:relative;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--hair)}
.behind{position:absolute;inset:0 0 0 auto;display:flex;width:172px}
.behind button{flex:1;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:.85rem}
.behind svg{width:20px;height:20px}
.b-edit{background:var(--line);color:var(--line-ink)}
.b-del{background:var(--danger);color:var(--danger-ink)}
.front{position:relative;background:var(--surface);touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.front.dragging{transition:none}

.leg{display:grid;grid-template-columns:52px 22px 1fr;column-gap:8px;padding:0 12px 0 12px}
.leg .t{font-weight:800;font-size:1.02rem;padding-top:12px;text-align:right;letter-spacing:-.01em}
.leg .rail{position:relative}
.leg .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--line)}
.leg.first .rail::before{top:20px}
.leg.last .rail::before{bottom:auto;height:20px}
.leg.solo .rail::before{display:none}
.node{position:absolute;left:50%;top:13px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.node.dep{background:var(--sun);border-color:var(--line)}
.node.arr{border-color:var(--cat,var(--line));background:var(--cat,var(--line))}
.leg .body{padding:10px 0 12px;min-width:0}
.dep-line{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.82rem}
.small{font-size:.86rem;color:var(--muted)}
.ev-title{font-weight:800;font-size:1.12rem;letter-spacing:-.01em;overflow-wrap:anywhere;display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.ev-title .more{flex:none;border:none;background:transparent;color:var(--muted);width:34px;height:30px;border-radius:10px;margin:-4px -4px 0 0;display:grid;place-items:center}
.ev-title .more:hover{background:var(--bg)}
.ev-title .more svg{width:20px;height:20px}
.where{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:.8rem;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--ink)}
.tag.alarm{background:var(--sun);color:var(--sun-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.stale{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.links .btn{padding:7px 12px;font-size:.84rem}
.by{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:10px}
.by i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hint-swipe{font-size:.82rem;color:var(--muted);text-align:center;margin-top:-8px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--muted);padding:30px 14px;border:2px dashed var(--hair);border-radius:20px}
.empty strong{color:var(--ink);font-size:1.15rem;font-weight:800}
.empty p{margin:0;max-width:34ch}

/* floating add */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;height:58px;padding:0 22px 0 18px;border-radius:999px;border:none;background:var(--line);color:var(--line-ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(20,60,50,.32)}
.fab svg{width:22px;height:22px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--hair);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{margin:0;font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:.86rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.rem select,.rem input{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 11px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.calc{background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.calc .out{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc .dep{font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.calc .dep.has{background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:2px 10px}
.note{font-size:.86rem;color:var(--muted)}
.rems{display:flex;flex-direction:column;gap:8px}
.rem{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:8px}
.rem .rl{grid-column:1 / -1}
.rem .x{border:none;background:none;color:var(--muted);font-size:1.3rem;width:34px;height:34px}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.confirm{background:var(--surface);border:1px solid var(--danger);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.toast{position:fixed;left:16px;right:16px;margin:0 auto;max-width:440px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 12px 11px 16px;border-radius:14px;font-size:.92rem;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast button{border:none;background:transparent;color:var(--sun);font-weight:800;padding:4px 6px}

/* address suggestions */
.ac{position:relative;min-width:0}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:0 10px 28px rgba(10,30,24,.18);z-index:5;max-height:300px;overflow-y:auto}
.ac-item{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;border:none;background:none;padding:10px 12px;border-bottom:1px solid var(--hair)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:focus-visible{background:var(--bg)}
.ac-main{font-weight:700;min-width:0;overflow-wrap:anywhere}
.ac-sub{grid-column:1;font-size:.84rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.ac-tag{grid-column:2;grid-row:1;font-size:.76rem;color:var(--line);font-weight:700;align-self:center}
.ac-load{padding:10px 12px;font-size:.86rem;color:var(--muted);display:flex;gap:8px;align-items:center}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.front{transition:none}}
.toggle-past{align-self:center}
.route{border-top:1px dashed var(--hair);margin:0 12px;padding:12px 0 14px;display:flex;flex-direction:column;gap:10px}
.route-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-steps{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.route-steps li{position:relative;padding:0 0 9px 24px;font-size:.92rem;overflow-wrap:anywhere}
.route-steps li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.route-steps li::after{content:"";position:absolute;left:8px;top:17px;bottom:-1px;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 7px)}
.route-steps li:last-child{padding-bottom:0}
.route-steps li:last-child::after{display:none}
.route-steps li.from,.route-steps li.to{font-weight:700}
.route-steps li.from::before{background:var(--sun)}
.route-steps li.to::before{background:var(--cat,var(--line));border-color:var(--cat,var(--line))}
.route .links{margin-top:0}
.swipe:not(.open) .more-info{display:none}
.front{cursor:pointer}
.front:focus-visible{outline:2px solid var(--line);outline-offset:-2px}
.ev-right{display:flex;align-items:center;gap:2px;flex:none}
.chev{width:26px;height:26px;display:grid;place-items:center;color:var(--muted);transition:transform .2s ease}
.chev svg{width:20px;height:20px}
.swipe.open .chev{transform:rotate(180deg)}
.swipe:not(.open) .leg .body{padding-bottom:10px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.rmap{border-radius:18px;overflow:hidden;border:1px solid var(--hair)}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:18px;padding:12px 12px 12px 16px}
.go-l{min-width:0}
.go-t{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.go-btn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:64px;border-radius:16px;background:var(--go);color:#fff;font-weight:800;text-decoration:none}
.go-btn svg{width:22px;height:22px;display:block}
.rmap:not(.lmap) svg{display:block;width:100%;height:auto}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pchip{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:700;color:var(--ink)}
.pchip.on{background:var(--line);border-color:var(--line);color:var(--line-ink)}
.pchip.add{border-style:dashed;border-color:var(--line);color:var(--line);background:transparent}
.psave{display:grid;grid-template-columns:1fr auto;gap:6px;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:8px}
.psave-act{display:flex;gap:6px;justify-content:flex-end;grid-column:1 / -1}
.psave input,.psave select,.pform input,.pform select{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 11px;width:100%;min-width:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:10px 6px 10px 12px}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--c-autre)}
.pdot.home{background:var(--sun);box-shadow:0 0 0 3px var(--line) inset}
.pdot.work{background:var(--line)}
.pinfo{min-width:0}
.pname{font-weight:800}
.pinfo .small{overflow-wrap:anywhere}
.pform{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.ac-search .ac-main{color:var(--line)}
.sheet input.big-title{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;border:none;border-bottom:2px solid var(--hair);border-radius:0;background:transparent;padding:6px 2px;width:100%}
.sheet input.big-title:focus{outline:none;border-bottom-color:var(--line)}
.from-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.disc-wrap{display:flex;flex-direction:column;gap:10px}
.disc{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--hair);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink);text-align:left}
.disc-chev{color:var(--muted);transition:transform .2s ease}
.disc.open .disc-chev{transform:rotate(180deg)}
.disc-box{display:flex;flex-direction:column;gap:12px}
.rem-simple-wrap{display:flex;flex-direction:column;gap:8px}
.rem-simple{display:flex;flex-direction:column;gap:6px}
.rs-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:11px 12px;cursor:pointer}
.rs-row input{width:20px;height:20px;accent-color:var(--line);flex:none}
.rs-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.rs-txt span{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.rs-row.off .rs-txt{opacity:.5}
.rs-row.main:not(.off){border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset}
.rem-custom{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}

.fix-act{display:flex;gap:6px;flex-wrap:wrap}

/* ===== Métamorphose : « Encre et mandarine ». Le moment fort est le panneau du prochain départ ; le reste reste calme. ===== */
:root{--f:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;--hero:color-mix(in oklab,var(--line) 46%,#05041a);--hero-ink:#F4F3FF;--hero-soft:color-mix(in oklab,var(--hero-ink) 62%,transparent);--lift:0 1px 0 color-mix(in oklab,var(--hair) 80%,transparent),0 14px 34px -22px color-mix(in oklab,var(--line) 55%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:color-mix(in oklab,var(--line) 26%,#05041a);--lift:0 0 0 1px var(--hair)}}
:root[data-theme="dark"]{--hero:color-mix(in oklab,var(--line) 26%,#05041a);--lift:0 0 0 1px var(--hair)}
body{font-variation-settings:"wdth" 100;font-optical-sizing:auto}
.wrap{gap:18px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:130px}
.num,.leg .t,.go-t,.calc .dep{font-variant-numeric:tabular-nums}

/* En-tête : la date du jour en grand, le couple en dessous */
header{flex-wrap:wrap;row-gap:4px}
.brand h1{font-size:1rem;font-weight:700;letter-spacing:0;color:var(--muted)}
.brand-mark{width:26px;height:26px}
.today{flex-basis:100%;position:relative;margin-top:8px}
.today-d{font-size:2.6rem;line-height:.95;font-weight:800;letter-spacing:-.035em;font-variation-settings:"wdth" 80}
.today-d{white-space:nowrap}
.today-d span{display:block;font-size:1.05rem;font-weight:500;letter-spacing:0;color:var(--muted);font-variation-settings:"wdth" 100;margin-bottom:10px;line-height:34px}
.duo{position:absolute;right:0;top:0;display:flex;align-items:center;gap:8px;flex-direction:row-reverse}
.duo-av{display:flex}
.duo-av b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:800;color:#fff;border:3px solid var(--bg)}
.duo-av b+b{margin-left:-11px}
.duo-av b.wait{background:transparent!important;border:2px dashed var(--muted);color:var(--muted)}
.duo-n{font-size:.86rem;color:var(--muted);font-weight:600;max-width:12em;line-height:1.2;text-align:right}
.round{border:none;background:var(--surface);box-shadow:var(--lift)}

/* Semaine : sept jours, un point par évènement */
.week{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:-4px;scrollbar-width:none;overscroll-behavior-x:contain}
.week::-webkit-scrollbar{display:none}
.wk-page{flex:0 0 100%;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;scroll-snap-align:start;scroll-snap-stop:always}
.wd small.mo{color:var(--line);font-weight:800}
.wd{border:none;background:transparent;border-radius:16px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.wd small{font-size:.72rem;color:var(--muted);font-weight:600}
.wd strong{font-size:1.15rem;font-weight:800;font-variation-settings:"wdth" 85;line-height:1}
.wd .dots{display:flex;gap:3px;height:6px}
.wd .dots i{width:6px;height:6px;border-radius:50%;background:var(--cat,var(--line))}
.wd.is-today{background:var(--ink);color:var(--bg)}
.wd.is-today small{color:color-mix(in oklab,var(--bg) 70%,transparent)}
.wd.is-today .dots i{box-shadow:0 0 0 1.5px var(--ink)}
.wd.none strong{opacity:.45}

/* Le panneau du prochain départ */
.sign{background:var(--hero);color:var(--hero-ink);border-radius:30px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden;align-items:stretch;isolation:isolate}
.sign::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--sun) 38%,transparent),transparent);z-index:-1}
.sign .k{font-size:.95rem;font-weight:600;color:var(--hero-soft)}
.sign .big{font-size:5.4rem;line-height:.86;font-weight:800;letter-spacing:-.05em;color:var(--sun);font-variation-settings:"wdth" 75;text-align:left;margin:8px 0 6px;grid-column:auto;grid-row:auto}
.sign .in{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.sign .what{font-size:1rem;font-weight:500;color:var(--hero-soft)}
.trip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:16px}
.trip-from{display:flex}
.trip-from i{width:16px;height:16px;border-radius:50%;border:2px solid var(--hero)}
.trip-from i+i{margin-left:-7px}
.trip-line{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--hero-soft) 0 6px,transparent 6px 11px);position:relative}
.trip-line b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sun)}
.trip-to{display:flex;align-items:center;gap:7px;font-weight:700;min-width:0;max-width:52vw}
.trip-to span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-to::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--hero-ink);flex:none;transform:rotate(45deg)}
.trip-meta{margin-top:10px;font-size:.88rem;color:var(--hero-soft)}

.tp-st{display:flex;align-items:center;gap:9px;font-size:.9rem;color:var(--muted);font-weight:600}
.tp-dot,.tl-live{flex:none;width:10px;height:10px;border-radius:50%;background:#22C55E;animation:tpPulse 1.6s ease-out infinite}
.tp-st.stale .tp-dot,.tl-live.stale{background:var(--sun);animation:none}
@keyframes tpPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
@media (prefers-reduced-motion:reduce){.tp-dot,.tl-live{animation:none}}
.tp-msg{align-self:flex-start;max-width:92%;background:var(--ok-soft);color:var(--ink);border-radius:18px 18px 18px 5px;padding:9px 13px;font-weight:700}
.tp-msg.me{align-self:flex-end;border-radius:18px 18px 5px 18px}
.tp-actions{display:flex;flex-wrap:wrap;gap:8px}.tp-actions .btn{flex:1 1 auto;justify-content:center;text-align:center}
.tp-go{font-size:1.06rem;padding:14px 18px}
.tp-note{font-size:.84rem;line-height:1.4;color:var(--muted);margin:0}
.tp-stop{align-self:flex-start}
.tp-car,.tp-pin,.tp-dest{background:none;border:none;width:0!important;height:0!important}
.tp-car-r{position:absolute;left:-22px;top:-22px;width:44px;height:44px;color:var(--line);filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));will-change:transform}
.tp-car-r svg{display:block}
.tp-car.stale .tp-car-r{opacity:.55;filter:grayscale(1) drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.tp-pin-in{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.tp-pin-in .tp-av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 17px var(--f,system-ui);border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.28);overflow:hidden}
.tp-pin-in .tp-av img{width:100%;height:100%;object-fit:cover}
.tp-pin-in i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #fff;margin-top:-2px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.tp-pin-in span{position:absolute;bottom:calc(100% + 4px);background:var(--surface);color:var(--ink);font:700 11px/1 var(--f,system-ui);padding:4px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
.tp-dest-in{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#E11D48;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.tp-dest-in span{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:var(--surface);color:var(--ink);font:700 11px/1 var(--f,system-ui);padding:4px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
.sign.trip-live .k{display:flex;align-items:center;gap:9px}
.sign .go-live{font-size:1.02rem;padding:12px 18px}
:root:is([data-skin="aurore"],[data-skin="tokyo"],[data-skin="velours"]) .lmap .leaflet-tile{filter:brightness(.75) contrast(1.1) saturate(.7)}
.cp-hero{display:flex;gap:14px;align-items:center;margin:4px 0 12px}.cp-hero h2{margin:0 0 4px;font-family:var(--fd,inherit);font-size:23px;line-height:1.1}
.cp-sub{margin:0;color:var(--muted);font-size:14.5px}
.cp-cal{flex:none;width:58px;height:62px;border-radius:16px;background:var(--surface);border:1px solid var(--hair);display:grid;grid-template-rows:20px 1fr;overflow:hidden;box-shadow:0 12px 24px -16px var(--line);transform:rotate(-6deg);animation:cpPop .5s cubic-bezier(.2,1.4,.4,1) both}
.cp-cal b{background:#E5484D;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:grid;place-items:center}.cp-cal i{font-style:normal;font-weight:800;font-size:26px;display:grid;place-items:center;color:var(--ink)}
.cp-who{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:color-mix(in oklab,var(--hair) 70%,transparent);margin-bottom:12px}
.cp-who button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:11px;padding:9px 6px;background:transparent;color:var(--muted)}.cp-who button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.cp-list{display:grid;gap:10px;max-height:52vh;overflow:auto;padding:2px}
.cp-item{--m:var(--line);position:relative;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:12px 12px 12px 16px;overflow:hidden;animation:cpIn .4s var(--d) cubic-bezier(.2,.8,.2,1) both;transition:opacity .2s,transform .2s}
.cp-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--m)}
.cp-item.gone{opacity:0;transform:translateX(30px) scale(.97)}
.cp-ic{width:44px;height:44px;border-radius:14px;background:var(--m);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -10px var(--m)}.cp-ic svg{width:24px;height:24px}
.cp-txt{min-width:0;display:grid;gap:1px}.cp-txt strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cp-txt span{color:var(--ink);opacity:.8;font-size:13.5px}.cp-txt small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-act{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.cp-act .btn{padding:8px 16px;min-height:0}.cp-add{background:var(--m);color:#fff;border-color:transparent}
.cp-foot{display:flex;justify-content:space-between;gap:10px}
@keyframes cpIn{from{opacity:0;transform:translateY(12px)}}@keyframes cpPop{from{opacity:0;transform:rotate(-20deg) scale(.6)}}
.go{border-radius:20px}

/* Barre d'action flottante : parler ou ajouter */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:color-mix(in oklab,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 0 0 1px color-mix(in oklab,var(--hair) 70%,transparent),0 18px 40px -16px rgba(10,8,40,.45)}
.dock:not(:has(button:not([hidden]))){display:none}
.dock .fab,.dock .fab-mic{position:static;box-shadow:none}
.dock .fab-mic{width:54px;height:54px;border:none;background:color-mix(in oklab,var(--line) 14%,var(--surface));color:var(--line)}
.dock .fab{height:54px;padding:0 26px 0 20px;font-size:1.02rem}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:18px}

/* Feuilles */
.sheet{border-radius:30px 30px 0 0;padding-top:12px}
.sheet-h h2{font-size:1.55rem;font-variation-settings:"wdth" 85;letter-spacing:-.03em}
.btn.primary{box-shadow:0 8px 18px -10px color-mix(in oklab,var(--line) 80%,transparent)}
.cf,.calc,.rs-row,.prow,.disc,.pair-card{border-color:transparent;box-shadow:var(--lift)}
.setup h2{font-size:2.2rem;font-variation-settings:"wdth" 82;letter-spacing:-.035em}
.skin-prev{height:64px}
@media (max-width:380px){.today-d{font-size:2.2rem}.sign .big{font-size:4.6rem}.duo-n{display:none}}

:root[data-skin="velours"],[data-p="velours"]{--bg:#170811;--surface:#230E19;--ink:#F8EAF0;--muted:#C9A2B3;--hair:#3D1B2A;--line:#E7B76A;--line-ink:#2A1500;--sun:#E7B76A;--sun-ink:#2A1500;--ok:#E7B76A;--ok-soft:#38182A;--danger:#FF6B7D;--danger-ink:#2A040B;--route:#E7B76A;--map:#1E0B15;--map-grid:#2B1220;--hero:#45102A;--bgimg:radial-gradient(60% 380px at 50% -120px,rgba(231,183,106,.20),transparent 70%);--hero-img:radial-gradient(90% 80% at 100% 0,rgba(231,183,106,.28),transparent 60%);--lift:0 0 0 1px rgba(231,183,106,.16),0 18px 38px -24px rgba(0,0,0,.8);--fd:"Fraunces",Georgia,"Times New Roman",serif;--glow:0 0 26px rgba(231,183,106,.35);color-scheme:dark}
[data-p="encre"]{--hero:#231C6B}

body{background:var(--bgimg,none),var(--bg);min-height:100vh}
.sign{background:var(--hero-img,none),var(--hero-t,var(--hero));box-shadow:var(--hero-ring,none)}
.sign .big{text-shadow:var(--glow,none)}
.swipe,.composer,.empty,.cf,.calc,.rs-row,.prow,.disc,.pair-card,.round,.motif-opt,.cal-banner{border:var(--cb,0 solid transparent)}
.swipe,.composer,.empty{border-radius:var(--r,24px)}
.dock{border:var(--cb,0 solid transparent)}
.today-d,.sign .big,.day h2,.sheet-h h2,.ev-title,.empty strong,.setup h2,.leg .t,.wd strong,.go-t,.skin-name{font-family:var(--fd,var(--f))}
:root[data-skin="jardin"] :is(.today-d,.sign .big,.day h2,.sheet-h h2,.empty strong,.setup h2),:root[data-skin="velours"] :is(.today-d,.sign .big,.day h2,.sheet-h h2,.empty strong,.setup h2){letter-spacing:-.015em;font-weight:600;font-variation-settings:"SOFT" 100,"opsz" 120}
:root[data-skin="jardin"] .sign .big,:root[data-skin="velours"] .sign .big{font-style:italic;font-weight:500}
:root[data-skin="bonbon"] .btn{border-width:2px;border-color:var(--ink)}
:root[data-skin="bonbon"] .btn.primary{box-shadow:3px 3px 0 var(--ink)}
:root[data-skin="bonbon"] .sign{border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--line)}
:root[data-skin="bonbon"] .wd.is-today{background:var(--line);color:var(--ink);border:2px solid var(--ink)}
:root[data-skin="tokyo"] .btn.primary{box-shadow:0 0 18px -2px var(--line)}
:root[data-skin="tokyo"] .wd.is-today{background:var(--line);color:var(--line-ink);box-shadow:0 0 20px -4px var(--line)}
:root[data-skin="aurore"] .wd.is-today,:root[data-skin="velours"] .wd.is-today{background:var(--line);color:var(--line-ink)}
:root[data-skin="aurore"] .swipe,:root[data-skin="aurore"] .composer{background:rgba(15,23,49,.78)}
/* Aperçus vivants dans le choix du thème */
.skins{grid-template-columns:1fr 1fr;gap:12px}
.skin{border:none;padding:0;overflow:hidden;border-radius:22px;box-shadow:var(--lift);gap:0;background:var(--surface)}
.skin.on{box-shadow:0 0 0 3px var(--ink),var(--lift)}
.skin-mini{display:flex;flex-direction:column;gap:7px;padding:10px;background:var(--bgimg,none),var(--bg);height:150px;color:var(--ink)}
.skin-mini .m-hero{border-radius:14px;padding:8px 10px;background:var(--hero-img,none),var(--hero);color:#fff;box-shadow:var(--hero-ring,none);border:var(--cb,0 solid transparent)}
.skin-mini .m-hero small{display:block;font-size:.62rem;opacity:.75;font-weight:600}
.skin-mini .m-hero b{display:block;font-family:var(--fd,var(--f));font-size:2.1rem;line-height:1;font-weight:800;color:var(--sun);letter-spacing:-.04em;font-variation-settings:"wdth" 78;text-shadow:var(--glow,none)}
.skin-mini .m-card{display:flex;align-items:center;gap:7px;border-radius:12px;padding:7px 9px;background:var(--surface);box-shadow:var(--lift);border:var(--cb,0 solid transparent);font-size:.72rem;font-weight:700}
.skin-mini .m-card i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.skin-mini .m-card span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.skin-mini .m-card em{font-style:normal;font-family:var(--fd,var(--f));font-weight:800;color:var(--line)}
.skin-txt{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.skin-name{font-size:1.1rem}
.skin-sub{line-height:1.3}
/* Thèmes par évènement */
.swipe .behind{opacity:0;transition:opacity .12s}
.swipe:has(.front.dragging) .behind,.swipe:has(.front[data-open]) .behind{opacity:1}
/* Décors propres à chaque sortie, sur la carte et sur le grand panneau */
.swipe.themed{--pc:color-mix(in oklab,var(--m) 20%,transparent);--pc2:color-mix(in oklab,var(--m) 34%,transparent)}
.sign.themed{--pc:rgba(255,255,255,.08);--pc2:rgba(255,255,255,.14)}
.swipe.themed .front{background:var(--mp,none),linear-gradient(120deg,color-mix(in oklab,var(--m) 13%,var(--surface)) 0%,var(--surface) 62%)}
.sign.themed{background:var(--mp,none),var(--hero-img,none),var(--hero-t,var(--hero))}
[data-mk="aqua"]{--mp:radial-gradient(circle at 88% 22%,var(--pc2) 0 5px,transparent 6px),radial-gradient(circle at 80% 46%,var(--pc) 0 9px,transparent 10px),radial-gradient(circle at 93% 64%,var(--pc) 0 4px,transparent 5px),radial-gradient(circle at 72% 80%,var(--pc2) 0 3px,transparent 4px),radial-gradient(120% 40px at 50% 100%,var(--pc) 0 60%,transparent 61%)}
[data-mk="ecran"]{--mp:repeating-linear-gradient(90deg,var(--pc2) 0 10px,transparent 10px 20px) top/100% 7px no-repeat,repeating-linear-gradient(90deg,var(--pc2) 0 10px,transparent 10px 20px) bottom/100% 7px no-repeat}

[data-mk="zoo"]{--mp:radial-gradient(ellipse 9px 6px at 78% 25%,var(--pc2) 0 60%,transparent 62%),radial-gradient(ellipse 7px 9px at 90% 48%,var(--pc) 0 60%,transparent 62%),radial-gradient(ellipse 10px 7px at 74% 70%,var(--pc) 0 60%,transparent 62%),radial-gradient(ellipse 6px 8px at 94% 82%,var(--pc2) 0 60%,transparent 62%)}
[data-mk="parc"]{--mp:radial-gradient(60px 40px at 100% 100%,var(--pc) 0 70%,transparent 72%),radial-gradient(40px 30px at 86% 100%,var(--pc2) 0 70%,transparent 72%)}
[data-mk="visite"]{--mp:repeating-linear-gradient(90deg,transparent 0 22px,var(--pc) 22px 30px) right bottom/45% 100% no-repeat}
[data-mk="jeux"]{--mp:conic-gradient(var(--pc) 25%,transparent 0 50%,var(--pc) 0 75%,transparent 0) right top/14px 14px,linear-gradient(transparent,transparent)}
[data-mk="jeux"].swipe .front{background:conic-gradient(var(--pc) 25%,transparent 0 50%,var(--pc) 0 75%,transparent 0) right top/14px 14px no-repeat,linear-gradient(90deg,transparent 60%,transparent),linear-gradient(120deg,color-mix(in oklab,var(--m) 13%,var(--surface)) 0%,var(--surface) 62%)}
[data-mk="plage"]{--mp:radial-gradient(circle at 12px -4px,transparent 10px,var(--pc) 11px 15px,transparent 16px) left bottom/24px 14px repeat-x}
[data-mk="neige"]{--mp:radial-gradient(circle at 70% 20%,var(--pc2) 0 2px,transparent 3px),radial-gradient(circle at 84% 34%,var(--pc2) 0 2.5px,transparent 3.5px),radial-gradient(circle at 92% 14%,var(--pc) 0 2px,transparent 3px),radial-gradient(circle at 78% 58%,var(--pc) 0 2px,transparent 3px),radial-gradient(circle at 95% 70%,var(--pc2) 0 2px,transparent 3px),linear-gradient(160deg,transparent 70%,var(--pc) 70.5%)}
[data-mk="amour"]{--mp:radial-gradient(circle at 86% 24%,var(--pc) 0 4px,transparent 5px),radial-gradient(circle at 78% 70%,var(--pc) 0 3px,transparent 4px)}

.swipe.themed .front{background:linear-gradient(120deg,color-mix(in oklab,var(--m) 13%,var(--surface)) 0%,var(--surface) 62%)}
.swipe.themed .behind{background:var(--surface)}
.motif-wm{position:absolute;right:-14px;bottom:-18px;width:118px;height:118px;color:var(--m);opacity:.13;pointer-events:none;transform:rotate(-12deg)}

.swipe.themed .leg,.swipe.themed .route{position:relative}
.motif-chip{display:inline-flex;align-items:center;gap:5px;color:var(--m);font-weight:700;margin-right:6px}

.swipe.themed .node.arr{background:var(--m);border-color:var(--m)}
.sign.themed{--hero-t:color-mix(in oklab,var(--m) 38%,var(--hero))}
.sign.themed::before{background:radial-gradient(closest-side,color-mix(in oklab,var(--m) 45%,transparent),transparent)}
.sign .motif-wm{right:-22px;bottom:auto;top:18px;width:170px;height:170px;color:#fff;opacity:.12;z-index:-1}
.motifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.motif-opt{border:none;border-radius:18px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:.86rem;color:var(--ink);background:color-mix(in oklab,var(--m,var(--hair)) 12%,var(--surface));box-shadow:var(--lift)}

.motif-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--m,var(--hair));color:#fff}

.motif-opt.on{box-shadow:0 0 0 2.5px var(--m,var(--ink))}

/* Qui vient */
.who{display:inline-flex;flex:none;margin-right:2px}

.who-filter{margin:-6px 0 2px}#who-bar .who-filter{margin:0}#who-bar[hidden]{display:none}

/* Courses */
.shop{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:12px;border-radius:16px;background:color-mix(in oklab,var(--m,var(--line)) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--m,var(--line)) 22%,transparent)}
.shop-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.shop-list{display:flex;flex-direction:column}
.shop-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--hair)}
.shop-row:last-child{border-bottom:none}
.shop-row input{width:22px;height:22px;accent-color:var(--m,var(--line))}
.shop-row label{overflow-wrap:anywhere;font-weight:600}

/* Météo */
.wx{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:16px;background:var(--bg)}

.wx-ic svg{width:24px;height:24px}
.wx-sun{background:#F59E0B}.wx-part{background:#38BDF8}.wx-rain{background:#2563EB}.wx-snow{background:#0EA5E9}.wx-storm{background:#6D28D9}.wx-fog{background:#94A3B8}
.wx-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}

/* Mois */

.md-ev{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;border:none;border-radius:14px;padding:11px 12px;background:color-mix(in oklab,var(--m,var(--line)) 10%,var(--surface));color:var(--ink);text-align:left;box-shadow:var(--lift)}
.md-dot{width:10px;height:10px;border-radius:50%}
.md-t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Souvenirs */
.mem-in{display:flex;flex-direction:column;gap:8px;margin-top:12px;align-items:flex-start}

.mem-photo img{width:100%;display:block;max-height:52vh;object-fit:cover}
.hearts{display:flex;gap:4px}
.heart{border:none;background:none;width:40px;height:40px;padding:4px;color:var(--hair)}
.heart svg{width:100%;height:100%;fill:currentColor}
.heart.on{color:#E11D48}
.journal{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.journal .empty{grid-column:1/-1}
.jm{border:none;padding:0;border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:var(--lift);text-align:left;color:var(--ink);display:flex;flex-direction:column}
.jm img,.jm-ph{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.jm-ph{display:grid;place-items:center;background:color-mix(in oklab,var(--m,var(--line)) 18%,var(--surface));color:var(--m,var(--line))}

.jm-txt{display:flex;flex-direction:column;gap:2px;padding:9px 11px 11px}

.links-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.rec-code{font-size:1.15rem;font-weight:800;letter-spacing:.06em;text-align:center;padding:14px 10px;border-radius:16px;border:2px dashed var(--line);color:var(--line);overflow-wrap:anywhere}
.wishes{display:flex;flex-direction:column;gap:10px}

.weekend{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r,24px);background:linear-gradient(135deg,color-mix(in oklab,var(--m,var(--sun)) 22%,var(--surface)),var(--surface) 70%);box-shadow:var(--lift);border:var(--cb,0 solid transparent)}
.wk-h{display:flex;flex-direction:column}

.tag.cost{background:color-mix(in oklab,var(--sun) 25%,var(--surface))}
.month-budget{font-size:.92rem;color:var(--muted)}

/* Photos de profil */
.has-photo{overflow:hidden;padding:0}
.has-photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.duo-av b{width:40px;height:40px}

.photo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.wish-alerts{display:flex;flex-direction:column;gap:10px}

.wa-body{display:flex;flex-direction:column;gap:3px;min-width:0}

.wa-body .pchips{margin-top:8px}
.wish-status{font-size:.82rem;font-weight:700;color:var(--m,var(--line))}

/* Invitations : envies et propositions */
.invite{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r,26px);overflow:hidden;isolation:isolate;
  background:linear-gradient(150deg,color-mix(in oklab,var(--m,var(--line)) 26%,var(--surface)) 0%,var(--surface) 70%);
  box-shadow:0 0 0 1.5px color-mix(in oklab,var(--m,var(--line)) 50%,transparent),var(--lift);border:var(--cb,0 solid transparent)}
.invite::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:color-mix(in oklab,var(--m,var(--line)) 22%,transparent);z-index:-1}
.inv-top{display:flex;align-items:center;gap:10px}

.inv-cal{width:52px;flex:none;border-radius:12px;overflow:hidden;text-align:center;background:var(--surface);box-shadow:var(--lift)}

.inv-cal b{display:block;font-size:1.5rem;font-weight:800;padding:2px 0 4px;color:var(--ink)}
.inv-wt{display:flex;flex-direction:column;min-width:0}
.inv-wt strong{font-size:1.05rem}
.inv-wt span{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.inv-note{margin:0;position:relative;align-self:flex-start;max-width:90%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bg);font-style:italic}
.inv-act{display:flex;flex-direction:column;gap:8px}
.invite .btn.inv-go{justify-content:center;padding:13px 18px;font-size:1rem;background:var(--m,var(--line));border-color:var(--m,var(--line));color:#fff}
.inv-sub{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.inv-done{margin:0;color:var(--muted);font-size:.9rem}
.inv-accepted .inv-title::after{content:" ✓";color:var(--m,var(--line))}
button.wish-t{border:0;background:none;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;gap:2px}
.wish-facts{font-size:.84rem;color:var(--ink);opacity:.8;overflow-wrap:anywhere}
.wish-match{font-size:.84rem;font-weight:800;color:#E11D48;margin:1px 0}
.wish-match::before{content:"♥♥";letter-spacing:-.25em;margin-right:.45em}
.wish.match{box-shadow:0 0 0 2px color-mix(in oklab,#E11D48 55%,transparent),var(--lift)}
.wish-over{font-size:.8rem;font-weight:700;color:#B45309}
.wish-act a.btn{text-decoration:none}
.pick-go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:800}
.pick-go span,.pick-top .wish-ic{display:grid;place-items:center}.pick-go svg{width:20px;height:20px;color:var(--line)}
.pick-slots{margin-top:-2px}
.pick-box{display:flex;flex-direction:column;gap:10px;min-height:120px}
.pick-wait{display:flex;align-items:center;gap:10px;color:var(--muted);margin:0}
.pick-card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r,24px);background:linear-gradient(150deg,color-mix(in oklab,var(--m,var(--line)) 22%,var(--surface)),var(--surface) 72%);box-shadow:0 0 0 1.5px color-mix(in oklab,var(--m,var(--line)) 45%,transparent),var(--lift)}
.pick-top{display:flex;align-items:center;gap:12px}.pick-top small{color:var(--muted);font-weight:700}
.pick-title{margin:2px 0 0;font-family:var(--fd,var(--f));font-size:1.45rem;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.pick-why{margin:0;font-size:.95rem}
.pick-act a.btn{text-decoration:none}
.wk-why{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.bud-slot:empty{display:none}
.bud{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--lift)}
.bud-off{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:.92rem}
.bud-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bud-bar{display:block;height:8px;border-radius:9px;background:color-mix(in oklab,var(--line) 16%,transparent);overflow:hidden}
.bud-bar u{display:block;height:100%;border-radius:9px;background:var(--line)}

.bud small{color:var(--muted)}
.pp-slots .pchip{text-transform:none}

.pp-bud:empty{display:none}
.inv-facts{margin:-4px 0 0;font-size:.9rem;color:var(--muted)}
.inv-opts{display:flex;flex-direction:column;gap:8px}
.inv-opt{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;border:1.5px solid color-mix(in oklab,var(--m,var(--line)) 40%,transparent);background:color-mix(in oklab,var(--surface) 75%,transparent);font:inherit;color:var(--ink);text-align:left;cursor:pointer}

/* Barre d'onglets */
.dock{display:none!important}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;display:grid;grid-template-columns:repeat(5,auto);align-items:center;gap:2px;padding:6px;border-radius:30px;background:color-mix(in oklab,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 0 0 1px color-mix(in oklab,var(--hair) 70%,transparent),0 18px 40px -16px rgba(10,8,40,.45);border:var(--cb,0 solid transparent)}
.tabbar:has(#fab[hidden]){display:none}
.tab{position:relative;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:22px;font-size:.7rem;font-weight:700;min-width:62px}

<script>
const CATS = {rdv:"Rendez-vous",sortie:"Sortie",medecin:"Médecin, santé",courses:"Courses",travail:"Travail",autre:"Autre"};
const MODES = {car:"Voiture",transit:"Transports",bike:"Vélo",walk:"À pied"};
const MODE_IN = {car:"en voiture",transit:"en transports",bike:"à vélo",walk:"à pied"};
const GMODE = {car:"driving",transit:"transit",bike:"bicycling",walk:"walking"};
const ICON = {
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',

  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>'
};

let db=null, user=null, sample=null, myId=null;
let events=new Map(), places=new Map(), settings={home:"",mode:"car"};
let firstSnap=true, showPast=false, canWrite=true;
const expanded=new Set();

const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="class") e.className=v;
    else if(k==="style") e.setAttribute("style",v);
    else if(k==="html") e.innerHTML=v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k instanceof Node?k:document.createTextNode(String(k)));
  return e;
}
const pad=n=>String(n).padStart(2,"0");
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const startOf=ev=>new Date(ev.date+"T"+(ev.time||"09:00")+":00");
const departOf=ev=>new Date(startOf(ev).getTime()-((+ev.travelMin||0)+(+ev.marginMin||0)+((+ev.travelMin||0)>0?placeExtra(ev.location):0))*60000);
// minutes pour se garer ou marcher, réglées sur un lieu enregistré (hôpital, gare…)
let pxRef=null,pxMap=new Map();
function placeExtra(addr){if(pxRef!==places){pxRef=places;pxMap=new Map();for(const p of places.values())if(+p.extra>0&&p.address)pxMap.set(norm(p.address),Math.min(60,Math.round(+p.extra)));}
  return addr?(pxMap.get(norm(addr))||0):0;}
// heure de retour à la maison : fin du rendez-vous puis le trajet dans l'autre sens (sans repasser chez l'autre)
function returnAt(ev){const wait=Math.max(0,Math.min(60,ev.pickupWait==null?5:+ev.pickupWait||0));
  const back=hasPickup(ev)?Math.max(5,(+ev.travelMin||0)-(+ev.pickupMin||0)-wait):Math.max(1,(+ev.travelMin||0)-((ev.mode||"car")==="car"?5:0));
  return new Date(endOf(ev).getTime()+back*60000);}
function showReturn(ev){return (+ev.travelMin||0)>0&&!isAllDay(ev)&&!!homeAddr()&&!!ev.location&&norm(ev.location)!==norm(homeAddr())&&!ev.pickedUp;}
// Évènement « toute la journée » (anniversaire, jour férié, changement d'heure…) : pas d'heure de départ ni de rappel « c'est l'heure »
function isAllDay(ev){return !!(ev&&(ev.allDay||/toute la journ/i.test(ev.notes||"")||(ev.time==="00:00"&&!ev.location&&!((+ev.travelMin||0)>0))));}
/* ---------- Départ à deux depuis deux endroits : l'un passe prendre l'autre ---------- */
function hasPickup(ev){return !!(ev&&ev.pickup&&ev.pickupWho&&(!ev.who||ev.who==="both")&&(+ev.travelMin||0)>0);}
function pickupAt(ev){return new Date(departOf(ev).getTime()+(+ev.pickupMin||0)*60000);}
function driverOf(ev){return ev.driver&&ev.driver!==ev.pickupWho?ev.driver:(memberIds().find(m=>m!==ev.pickupWho)||null);}
// Le même évènement vu par la personne qu'on passe prendre : son « départ » est l'heure où on arrive chez elle
function viewFor(ev,uid){if(!hasPickup(ev)||ev.pickupWho!==uid)return ev;
  return {...ev,travelMin:Math.max(0,(+ev.travelMin||0)-(+ev.pickupMin||0)),origin:ev.pickup,pickedUp:true};}
function lastPickups(){try{return JSON.parse(localStorage.getItem("a2.pickups")||"{}")||{};}catch(_){return {};}}
function rememberPickup(uid,addr){if(!uid||!addr)return;const m=lastPickups();m[uid]=[addr,...(m[uid]||[]).filter(a=>norm(a)!==norm(addr))].slice(0,4);try{localStorage.setItem("a2.pickups",JSON.stringify(m));}catch(_){}}
function fmtDur(m){m=Math.round(m);if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+pad(r):"");}
function dayParts(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/86400000);
  const full=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  if(diff===0) return ["Aujourd'hui",full];
  if(diff===1) return ["Demain",full];
  if(diff===-1) return ["Hier",full];
  return [full.charAt(0).toUpperCase()+full.slice(1),""];
}
function remWhen(ev,r){return new Date(startOf(ev).getTime()-r.min*60000);}
function remLabel(ev,r){
  const w=remWhen(ev,r),s=startOf(ev);
  const dd=Math.round((new Date(s).setHours(0,0,0,0)-new Date(w).setHours(0,0,0,0))/86400000);
  return (dd===0?"":dd===1?"la veille ":dd+" jours avant ")+hhmm(w);
}

/* ---------- Swipe ---------- */
let openFront=null;
function closeOpen(except){ if(openFront&&openFront!==except){openFront.style.transform="";openFront.dataset.open="";openFront=null;} }
function setOpen(front,open){
  closeOpen(front);
  front.style.transform=open?"translateX(-172px)":"";
  front.dataset.open=open?"1":"";

}
function makeSwipe(front){
  let sx=0,sy=0,dx=0,active=false,decided=false,horiz=false,base=0,pid=null;
  front.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0) return;
    if(e.target.closest("a,button,input,select")) return;
    sx=e.clientX;sy=e.clientY;dx=0;active=true;decided=false;horiz=false;pid=e.pointerId;
    base=front.dataset.open?-172:0;
  });
  front.addEventListener("pointermove",e=>{
    if(!active||e.pointerId!==pid) return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(!decided){ if(Math.abs(mx)<8&&Math.abs(my)<8) return; decided=true; horiz=Math.abs(mx)>Math.abs(my);
      if(horiz){front.classList.add("dragging");try{front.setPointerCapture(pid);}catch(_){}} }

  });

    if(!active) return; active=false;
    front.classList.remove("dragging");
    if(!horiz){ if(!decided&&front.dataset.open){ setOpen(front,false); front.dataset.justClosed="1"; } return; }
    const x=base+dx; setOpen(front,x<-60);

  let s=String(raw||"").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"");if(!s)return null;
  let p=null,q="";
  const pm=s.match(/(\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?\b|eur\b)/i);if(pm){p=Math.round(parseFloat(pm[1].replace(",","."))*100)/100;s=s.replace(pm[0]," ").trim();}
  let m=s.match(/\s*(?:x|×)\s*(\d+)$/i)||s.match(/\s*\((\d+)\)$/);if(m){q=m[1];s=s.slice(0,m.index).trim();}
  m=s.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|grammes?|l|litres?|cl|ml|paquets?|boites?|bouteilles?|packs?|sachets?|pots?|tranches?|pieces?)?\b\.?\s*(?:de |d'|d’)?/i);
  if(m&&m[0].trim()){q=(m[1]+(m[2]?" "+m[2].toLowerCase().replace(/^grammes?$/,"g").replace(/^litres?$/,"l"):"")).trim();s=s.slice(m[0].length).trim();}
  else{const w=s.match(/^(un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix|douze)\s+/i);
    if(w){const N={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,douze:12}[w[1].toLowerCase()];if(N>1)q=String(N);s=s.slice(w[0].length);}}
  s=s.replace(/^(?:(?:encore du|encore des|encore de la|quelques|de la|du|des|de|le|la|les|un|une)\s+|(?:de l|l|d)['’]\s*)/i,"").trim();
  if(!s||s.length<2)return null;
  s=s.charAt(0).toUpperCase()+s.slice(1);
  return {id:itemId(s),t:s.slice(0,60),q:q.slice(0,12),p,a:aisleOf(s)};
}
function splitShop(text){return String(text||"").replace(/(\d),(\d)/g,"$1.$2").split(/,|;|\n| et puis | puis | et (?=(?:du|de la|des|de l'|un|une|\d|[a-zà-ÿ]))/i).map(x=>parseShopItem(x)).filter(Boolean);}

// config/shop : {list:{<id>:article}, freq, order, run, spent}
//   article : {t,q,p,a, by,at (ajouté par, quand), done, tb,ta (pris par, quand)}
//   freq    : {<id>:{t,a,n,last,h:[dates d'achat],skip}}, pour « Souvent achetés » et « Il en manque ? »
//   order   : les rayons dans l'ordre de votre magasin, appris pendant les courses
//   run     : {by,at,until,ev} pendant que l'un de vous fait les courses
//   spent   : [{at,amt,by,n,ev}], les tickets de caisse
let shopList={list:{},freq:{},order:null,run:null,spent:[]},shopRaw=null,shopRefresh=null,shopFirst=true;
function normShop(x){x=x||{};const o=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};
  return {list:o(x.list),freq:o(x.freq),order:Array.isArray(x.order)?x.order:null,run:x.run&&x.run.by?x.run:null,spent:Array.isArray(x.spent)?x.spent.filter(s=>s&&+s.amt>0):[],updatedBy:x.updatedBy||""};}
function basket(){return Object.entries(shopList.list||{}).filter(([,x])=>x&&x.t).map(([id,x])=>({q:"",p:null,...x,id,a:x.a||aisleOf(x.t)})).sort((a,b)=>(+a.at||0)-(+b.at||0));}
function toBuy(){return basket().filter(x=>!x.done);}
function shopRun(){const r=shopList.run;return r&&r.by&&+r.until>Date.now()?r:null;}
async function shopWrite(patch){try{await db.doc("config/shop").set({...patch,updatedBy:myId,updatedAt:Date.now()},{merge:true});return true;}catch(_){toast("Liste non enregistrée. Vérifie ta connexion.");return false;}}
async function shopUpdate(u){try{await db.doc("config/shop").update({...u,updatedBy:myId,updatedAt:Date.now()});return true;}
  catch(e){if(e&&e.code==="not-found")return true;toast("Liste non enregistrée. Vérifie ta connexion.");return false;}}
// Ajouter : déjà sur la liste → on complète la quantité ; déjà pris → il revient dans la liste
async function addItems(add,opts){
  const L=shopList.list||{},patch={},now=Date.now(),fresh=[];
  let i=0;
  for(const it of add){if(!it||!it.t)continue;const id=itemId(it.t),ex=L[id];if(patch[id])continue;
    if(ex&&ex.t&&!ex.done){const p={};if(it.q&&!ex.q)p.q=it.q;if(it.p!=null&&ex.p==null)p.p=it.p;if(Object.keys(p).length)patch[id]=p;continue;}
    patch[id]={t:String(it.t).slice(0,60),q:String(it.q||"").slice(0,16),p:it.p!=null?+it.p:null,a:it.a||aisleOf(it.t),by:myId,at:now+(i++),done:false,tb:null,ta:null};fresh.push(patch[id]);}
  if(Object.keys(patch).length&&!await shopWrite({list:patch}))return null;
  if(fresh.length&&!(opts&&opts.quiet))shopTell(fresh);
  return fresh;
}
async function addToShop(text){const add=splitShop(text);if(!add.length)return [];return (await addItems(add))?add:[];}
// Prévenir l'autre : s'il ou elle est au magasin, tout de suite ; sinon le serveur regroupe les ajouts (une minute)
function shopTell(items){
  const o=otherId();if(!o||!items.length)return;
  const names=items.map(x=>x.t).join(", ").slice(0,110),run=shopRun();
  if(run&&run.by===o)pushTo([o],"À prendre aussi : "+names.slice(0,70),"Ajouté par "+firstName(myId)+" pendant tes courses.","shop-run-"+Date.now().toString(36),"./?shop=1");
  else pushOther("Liste de courses",firstName(myId)+" a ajouté "+names,"shop",{k:"shop",t:names},"./?shop=1");
}
function takeItem(it,on){return shopWrite({list:{[it.id]:{done:!!on,tb:on?myId:null,ta:on?Date.now():null}}});}
function removeItem(it){return shopUpdate({["list."+it.id]:firebase.firestore.FieldValue.delete()});}
function nextShopEv(){const now=Date.now();return [...events.values()].filter(e=>isShopping(e)&&!e.shopDone&&startOf(e).getTime()>now-6*3600000&&startOf(e).getTime()<now+7*864e5).sort((a,b)=>startOf(a)-startOf(b))[0]||null;}
function todayShopEv(){const e=nextShopEv();return e&&ymd(startOf(e))===ymd(new Date())?e:null;}
// « Je pars faire les courses » : l'autre est prévenu·e et peut encore ajouter ce qui manque
async function startShopRun(evId){
  const now=Date.now(),o=otherId(),ev=evId&&events.get(evId)?evId:((todayShopEv()||{}).id||null);
  if(!await shopWrite({run:{by:myId,at:now,until:now+3*3600000,ev:ev||null}}))return false;
  if(o&&!inQuiet(o,now))pushTo([o],firstName(myId)+" part faire les courses","Il manque quelque chose ? Ajoute-le à la liste : ça lui arrive tout de suite.","shop-run","./?shop=1");
  toast(o?"C'est parti. Ce que "+firstName(o)+" ajoute t'arrivera tout de suite.":"C'est parti : l'écran reste allumé.");
  return true;
}
// Ce qu'on achète d'habitude, et tous les combien
function freqPatch(taken){
  const F=shopList.freq||{},out={};
  for(const x of taken){const id=itemId(x.t),o=out[id]||F[id]||{},ta=+x.ta||Date.now();
    const h=(Array.isArray(o.h)?o.h:[]).filter(v=>+v>0).map(Number);
    if(!h.length||ta-h[h.length-1]>12*3600000)h.push(ta);
    out[id]={t:x.t,a:aisleIdOf(x),n:(+o.n||0)+1,last:ta,h:h.slice(-8),skip:null};}
  return out;}
// L'ordre des rayons de votre magasin, appris d'après l'ordre où l'on coche : au moins 4 articles, 3 rayons
// et quelques minutes (tout cocher d'un coup à la maison n'apprend rien)
function shopOrder(){const o=(Array.isArray(shopList.order)?shopList.order:[]).filter(id=>AISLE_IDS.includes(id));return [...new Set([...o,...AISLE_IDS])];}
function learnOrder(taken){
  const by={};for(const x of taken)if(x.tb&&+x.ta)(by[x.tb]=by[x.tb]||[]).push(x);
  const t=(Object.values(by).sort((a,b)=>b.length-a.length)[0]||[]).sort((a,b)=>a.ta-b.ta);
  if(t.length<4||t[t.length-1].ta-t[0].ta<3*60000)return null;
  const pos={};t.forEach((x,i)=>{const a=aisleIdOf(x);(pos[a]=pos[a]||[]).push(i);});
  const seen=Object.keys(pos);if(seen.length<3)return null;
  const med=l=>{const s=[...l].sort((p,q)=>p-q);return s[(s.length-1)>>1];};
  const run=[...seen].sort((a,b)=>med(pos[a])-med(pos[b]));
  const cur=shopOrder(),slots=[];cur.forEach((id,i)=>{if(pos[id])slots.push(i);});
  const out=[...cur];slots.forEach((s,j)=>{out[s]=run[j];});
  return out.join()===cur.join()?null:out;}
// « J'ai fini les courses » : ce qui est pris quitte la liste, le reste y reste pour la prochaine fois
async function finishShop(amt,evId,opts){
  const quiet=!!(opts&&opts.quiet),all=basket(),taken=all.filter(x=>x.done),left=all.filter(x=>!x.done),now=Date.now();
  amt=Math.round((+amt||0)*100)/100;
  const FV=firebase.firestore.FieldValue,u={run:null};
  for(const x of taken)u["list."+x.id]=FV.delete();
  for(const [k,v] of Object.entries(freqPatch(taken)))u["freq."+k]=v;
  const ord=learnOrder(taken);if(ord)u.order=ord;
  if(amt>0)u.spent=FV.arrayUnion({at:now,amt,by:myId,n:taken.length,...(evId?{ev:evId}:{})});
  if(!await shopUpdate(u))return null;
  const ev=evId&&events.get(evId);
  if(ev&&!quiet){try{await db.doc("events/"+ev.id).update({shopDone:true,...(amt>0?{paid:amt}:{}),updatedBy:myId,updatedAt:now});}catch(_){}}
  if(!quiet&&otherId()&&taken.length)pushOther("Courses terminées",firstName(myId)+" a fini les courses : "+taken.length+" article"+(taken.length>1?"s":"")+" pris"+(amt>0?", "+euro(amt):"")+(left.length?". "+left.length+" reste"+(left.length>1?"nt":"")+" sur la liste.":"."),"shop",null,"./?shop=1");
  return {taken,left,ord};
}
// Des articles pris, mais personne n'a touché « J'ai fini » : six heures après, on termine sans rien demander
let autoFinAt=0;
function autoFinishShop(){
  if(firstSnap||!myId||shopRun()||Date.now()-autoFinAt<60000)return;
  const taken=basket().filter(x=>x.done);if(!taken.length)return;
  if(taken.some(x=>+x.ta&&Date.now()-x.ta<6*3600000))return;
  autoFinAt=Date.now();finishShop(0,null,{quiet:true});
}
// Avant le panier unique : la liste « À racheter » et une liste par évènement. Tout rejoint le panier.
let shopMig=false,shopMigAgain=false;
async function migrateShop(raw){
  if(shopMig){shopMigAgain=true;return;}
  if(firstSnap||!myId||!coupleId||!raw)return;
  const hasLegacy=Array.isArray(raw.items),legacy=hasLegacy?raw.items.filter(x=>x&&x.t&&!x.done):[];
  const evs=[...events.values()].filter(e=>isShopping(e)&&!e.shopDone&&Array.isArray(e.items)&&e.items.some(x=>x&&x.t&&!x.done));
  const rekey=!!(raw.freq&&typeof raw.freq==="object"&&raw.mig!==2);
  if(!hasLegacy&&!evs.length&&!rekey)return;
  shopMig=true;
  try{
    const L=shopList.list||{},u={},now=Date.now(),FV=firebase.firestore.FieldValue;
    for(const x of [...legacy,...evs.flatMap(e=>e.items.filter(y=>y&&y.t&&!y.done))]){const id=itemId(x.t);if((L[id]&&L[id].t&&!L[id].done)||u["list."+id])continue;
      u["list."+id]={t:String(x.t).slice(0,60),q:String(x.q||"").slice(0,16),p:x.p!=null&&isFinite(+x.p)?+x.p:null,a:aisleOf(x.t),by:x.by||myId,at:+x.at||now,done:false,tb:null,ta:null};}
    if(hasLegacy)u.items=FV.delete();
    if(rekey){const F={};for(const f of Object.values(raw.freq))if(f&&f.t){const id=itemId(f.t),o=F[id];
        F[id]=o?{...o,n:(+o.n||0)+(+f.n||0),last:Math.max(+o.last||0,+f.last||0)}:{t:f.t,a:f.a||aisleOf(f.t),n:+f.n||0,last:+f.last||0,h:Array.isArray(f.h)?f.h:[]};}
      u.freq=F;u.mig=2;}
    if(Object.keys(u).length){if(Object.keys(raw).length)await db.doc("config/shop").update(u);
      else{const list={};for(const [k,v] of Object.entries(u))if(k.startsWith("list."))list[k.slice(5)]=v;await db.doc("config/shop").set({list,mig:2},{merge:true});}}
    for(const e of evs)await db.doc("events/"+e.id).update({items:FV.delete()});
  }catch(_){}finally{shopMig=false;if(shopMigAgain){shopMigAgain=false;setTimeout(()=>migrateShop(shopRaw),80);}}
}
// Ce que l'autre vient de faire dans la liste, en clair
function shopNews(prev,cur,snap){
  if(shopFirst){shopFirst=false;return;}
  if(!myId||(snap&&snap.metadata&&snap.metadata.hasPendingWrites))return;
  const who=cur.updatedBy;if(!who||who===myId)return;
  const name=firstName(who),A=prev.list||{},B=cur.list||{};
  const live=x=>x&&x.t&&!x.done;
  const added=Object.entries(B).filter(([id,x])=>live(x)&&!live(A[id])).map(([,x])=>x.t);
  const took=Object.entries(B).filter(([id,x])=>x&&x.t&&x.done&&live(A[id])).map(([,x])=>x.t);
  const r=cur.run&&+cur.run.until>Date.now()?cur.run:null,r0=prev.run;
  const few=l=>"« "+l.slice(0,3).join(", ")+" »"+(l.length>3?" et "+(l.length-3)+" autre"+(l.length>4?"s":""):"");
  if(r&&r.by===who&&!(r0&&r0.at===r.at)){toast(name+" part faire les courses");return;}
  if(r0&&r0.by===who&&+r0.until>Date.now()&&!cur.run&&Object.keys(B).length<Object.keys(A).length){toast(name+" a fini les courses");return;}
  if(took.length){toast(name+" a pris "+few(took));return;}
  if(!added.length)return;
  const run=shopRun();
  if(run&&run.by===myId){
    if(shopRefresh)toast("À prendre aussi : "+added.slice(0,3).join(", ")+" (ajouté par "+name+")");
    else inNote("À prendre aussi : "+added.slice(0,3).join(", "),"Ajouté par "+name+". Touche pour ouvrir la liste.",()=>openShop(),12000);
    try{if(navigator.vibrate)navigator.vibrate([60,40,60]);}catch(_){}
  }else toast(name+" a ajouté "+few(added)+" à la liste");
}
// « Il en manque ? » : ce que vous achetez régulièrement et qui n'a pas été racheté depuis un moment
function purchaseLog(){
  const M=new Map(),put=(t,ts,a)=>{if(!t||!(+ts>0))return;const k=itemId(t);let o=M.get(k);if(!o){o={t,a:a||aisleOf(t),h:[]};M.set(k,o);}o.h.push(+ts);};
  for(const f of Object.values(shopList.freq||{}))if(f&&f.t){const h=Array.isArray(f.h)?f.h:[];if(h.length)h.forEach(ts=>put(f.t,ts,f.a));else put(f.t,f.last,f.a);}
  // les listes des courses passées (avant le panier unique) comptent aussi
  for(const e of events.values())if(isShopping(e)&&Array.isArray(e.items))for(const x of e.items)if(x&&x.t&&x.done)put(x.t,+x.ta||+x.at||startOf(e).getTime(),x.a);
  for(const o of M.values()){const s=o.h.sort((a,b)=>a-b),d=[];for(const ts of s)if(!d.length||ts-d[d.length-1]>12*3600000)d.push(ts);o.h=d;}
  return M;}
function everyText(iv){const d=iv/864e5;return d<2.5?"tous les 2 jours":d<5?"tous les 3 ou 4 jours":d<10?"chaque semaine":d<18?"toutes les 2 semaines":d<26?"toutes les 3 semaines":d<45?"chaque mois":"tous les 2 mois";}
function dueItems(){
  const now=Date.now(),have=new Set(basket().map(x=>x.id)),F=shopList.freq||{},out=[];
  for(const [k,o] of purchaseLog()){
    if(have.has(k)||o.h.length<2||SHOP_AISLE_IDS.has(o.a))continue;
    const d=[];for(let i=1;i<o.h.length;i++)d.push(o.h[i]-o.h[i-1]);d.sort((a,b)=>a-b);
    const iv=d[(d.length-1)>>1];if(iv<1.5*864e5||iv>62*864e5)continue;
    const last=o.h[o.h.length-1],since=now-last,skip=+(F[k]&&F[k].skip)||0;
    if(skip>last&&now-skip<iv*0.6)continue;            // « pas besoin » : on n'en reparle pas tout de suite
    if(since>=iv*0.9&&since<iv*4)out.push({id:k,t:o.t,a:o.a,iv,r:since/iv});}
  return out.sort((a,b)=>b.r-a.r).slice(0,4);}
const SHOP_STARTERS=["Lait","Pain","Œufs","Beurre","Bananes","Pâtes","Tomates","Papier toilette","Eau","Café"];
function shopSuggestions(skip){
  const have=new Set([...basket().map(x=>x.id),...(skip||[])]);
  const f=Object.values(shopList.freq||{}).filter(x=>x&&x.t&&(+x.n||0)>0&&!SHOP_AISLE_IDS.has(x.a||aisleOf(x.t))).sort((a,b)=>(b.n-a.n)||((b.last||0)-(a.last||0))).map(x=>x.t);
  const out=[];for(const t of [...f,...SHOP_STARTERS]){const id=itemId(t);if(!have.has(id)&&!out.some(o=>itemId(o)===id))out.push(t);if(out.length>=8)break;}
  return out;}
// « ajoute du lait et des œufs », « il faut racheter du PQ », « mets des pâtes sur la liste »
function shopIntent(text,p){
  const n=norm(text);
  const lead=/^(ajoute|rajoute|mets|note|ecris|il faut (re)?acheter|il faut racheter|il faudrait (re)?acheter|on n'a plus( de| d')?|y a plus( de| d')?|il n'y a plus( de| d')?|plus de|acheter|achete|racheter|rachete|penser a acheter|pense a acheter)\b/;
  const listy=/\b(a|sur|dans) (la|ma|notre) liste\b|\bliste de courses\b|\bliste\b|\ba racheter\b|\baux courses\b|\bpour les courses\b|\bau panier\b|\bdans le panier\b/;
  const noWhen=!p||(p.assumed&&p.assumed.date&&p.assumed.time);
  if(!(lead.test(n)&&(listy.test(n)||noWhen)))return null;
  let s=String(text).replace(/^\s*(ajoute|rajoute|mets|note|écris|ecris|il faut (re)?acheter|il faut racheter|il faudrait (re)?acheter|on n'a plus|on n’a plus|y a plus|il n'y a plus|il n’y a plus|plus|acheter|achète|achete|racheter|rachète|rachete|pense[rz]? à acheter|pense[rz]? a acheter)\s*/i,"");
  s=s.replace(/\s*(à|a|sur|dans|pour|au)\s+(la|ma|notre|les|le)\s+(liste( de courses| des courses| de shopping)?|courses|panier)\s*$/i,"").replace(/\s*(à racheter|aux courses)\s*$/i,"");
  const items=splitShop(s);
  if(!items.length)return null;
  // sans mot « liste », il faut au moins un produit reconnu, pour ne pas confondre avec un rendez-vous
  if(!listy.test(n)&&!items.some(x=>x.a!=="autre"))return null;
  return s;
}
// Les tickets de caisse du mois
function monthSpent(y,m){let t=0,n=0;for(const s of shopList.spent||[]){const d=new Date(+s.at);if(d.getFullYear()===y&&d.getMonth()===m){t+=+s.amt||0;n++;}}return {t:Math.round(t*100)/100,n};}
// « Envoyer la liste » : un texte prêt à coller dans un message, rangé par rayon
function shopText(){
  const left=toBuy();if(!left.length)return "";
  const groups=new Map();for(const x of left){const a=aisleIdOf(x);if(!groups.has(a))groups.set(a,[]);groups.get(a).push(x);}
  const out=["Liste de courses ("+left.length+")"];
  for(const id of shopOrder()){const g=groups.get(id);if(!g)continue;out.push("",aisleInfo(id).n);for(const x of g)out.push("• "+x.t+(x.q?" ("+qText(x.q)+")":""));}
  return out.join("\n");}
async function sendShopList(){
  const t=shopText();if(!t){toast("La liste est vide.");return;}
  if(navigator.share){try{await navigator.share({text:t});return;}catch(e){if(e&&e.name==="AbortError")return;}}
  try{await navigator.clipboard.writeText(t);toast("Liste copiée : colle-la dans un message.");}catch(_){toast("Copie impossible sur ce téléphone.");}
}

/* ---------- Une recette collée (ou le lien de sa page) : ses ingrédients sur la liste ---------- */
const RC_FRAC=[["½",".5","1/2"],["¼",".25","1/4"],["¾",".75","3/4"],["⅓",".33","1/3"],["⅔",".67","2/3"],["⅛",".125","1/8"]];

// au magasin, « 2 c. à soupe d'huile » ou « 1 gousse d'ail » ne disent pas combien acheter : on garde le produit seul
const RC_SPOON="c\\.?\\s?(?:à|a)\\.?\\s?(?:s|c|soupe|caf[ée])\\.?|cuill?(?:[eè]re)?s?\\.?(?:\\s(?:à|a)\\s(?:soupe|caf[ée]))?|c[àa]s|c[àa]c|cs|cc";

  const key=ev.id+"|"+ev.date+"|"+ev.time+"|"+(ev.location||"");

async function openFilm(mems,opts){
  closeSheet();
  const ov=el("div",{class:"film",role:"dialog","aria-label":"Film des souvenirs"});
  const cv=el("canvas",{width:"720",height:"1280",class:"film-cv"});
  const msg=el("div",{class:"film-msg"},"Préparation du film…");
  const bClose=el("button",{type:"button",class:"film-x","aria-label":"Fermer"},"×");
  const bMute=el("button",{type:"button",class:"film-b"},"Son : oui");
  const bSave=el("button",{type:"button",class:"film-b"},"Enregistrer la vidéo");
  const bar=el("div",{class:"film-bar"},el("i"));
  const ctrls=el("div",{class:"film-ctrl"},bMute,bSave);
  ov.append(cv,bar,bClose,ctrls,msg);document.body.append(ov);document.body.classList.add("film-on");
  let stop=false,raf=0,music=null,rec=null,chunks=[];
  const close=()=>{stop=true;cancelAnimationFrame(raf);if(music)music.stop();if(rec&&rec.state!=="inactive")try{rec.stop();}catch(_){}ov.remove();document.body.classList.remove("film-on");};
  bClose.onclick=close;

  if(!slides.some(s=>s.k==="photo"||s.k==="anim")){msg.textContent="Ajoutez d'abord quelques photos ou vidéos pour créer le film.";return;}
  msg.hidden=true;
  const ctx=cv.getContext("2d"),W=720,H=1280,X=.7;
  const starts=[];let tot=0;for(const s of slides){starts.push(tot);tot+=s.dur;}
  music=filmMusic();let muted=false;
  bMute.onclick=()=>{muted=!muted;if(music)music.mute(muted);bMute.textContent="Son : "+(muted?"non":"oui");};
  let t0=0,paused=false,pauseAt=0;
  const play=()=>{t0=performance.now();if(music)music.start();loop();};
  const loop=()=>{if(stop)return;raf=requestAnimationFrame(loop);if(paused)return;
    const t=(performance.now()-t0)/1000;
    if(t>=tot){drawSlide(ctx,slides[slides.length-1],slides[slides.length-1].dur,W,H);bar.firstChild.style.width="100%";cancelAnimationFrame(raf);if(rec&&rec.state==="recording")rec.stop();
      ctrls.append(el("button",{type:"button",class:"film-b",onclick:()=>{ctrls.lastChild.remove();play();}},"Revoir"));return;}
    let i=0;while(i<slides.length-1&&t>=starts[i+1])i++;
    const lt=t-starts[i];
    if(i>0&&lt<X){drawSlide(ctx,slides[i-1],slides[i-1].dur+lt,W,H);ctx.globalAlpha=lt/X;drawSlide(ctx,slides[i],lt,W,H);ctx.globalAlpha=1;}
    else drawSlide(ctx,slides[i],lt,W,H);
    bar.firstChild.style.width=(t/tot*100)+"%";};
  cv.onclick=()=>{paused=!paused;if(paused)pauseAt=performance.now();else t0+=performance.now()-pauseAt;};
  bSave.onclick=()=>{
    const types=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"];
    const type=window.MediaRecorder&&cv.captureStream?types.find(t=>MediaRecorder.isTypeSupported(t)):null;
    if(!type){toast("Ce téléphone ne permet pas d'enregistrer le film en vidéo. Tu peux faire un enregistrement d'écran.");return;}
    const st=cv.captureStream(30);if(music&&music.stream)music.stream.getAudioTracks().forEach(tr=>st.addTrack(tr));
    chunks=[];rec=new MediaRecorder(st,{mimeType:type,videoBitsPerSecond:5000000});
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    rec.onstop=()=>{const ext=type.includes("mp4")?"mp4":"webm";const blob=new Blob(chunks,{type:type.split(";")[0]});
      const file=new File([blob],"Together - "+(opts.title||"souvenirs").replace(/[\\/:*?"<>|]/g,"")+"."+ext,{type:blob.type});
      bSave.textContent="Vidéo prête : la partager";bSave.disabled=false;
      bSave.onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:opts.title||"Together"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
        const a=el("a",{href:URL.createObjectURL(blob),download:file.name});document.body.append(a);a.click();a.remove();};};
    bSave.disabled=true;bSave.textContent="Enregistrement… laisse le film jusqu'au bout";
    const last=ctrls.querySelector(".film-b:last-child");if(last&&last.textContent==="Revoir")last.remove();
    cancelAnimationFrame(raf);rec.start(500);play();
  };
  play();
}

function recNorm(t){return String(t||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
async function syncRecovery(){
  if(!coupleId||!couple||!myId)return;
  let k=lsGet("a2.rec");
  if(!k){k="";const a=new Uint32Array(24);crypto.getRandomValues(a);for(const x of a)k+=CODE_CHARS[x%CODE_CHARS.length];lsSet("a2.rec",k);}
  const body={coupleId,uid:myId,members:couple.members||[myId],name:(couple.names&&couple.names[myId])||""};
  const sig=JSON.stringify(body);if(syncRecovery._last===sig)return;

}

async function recoverWith(raw,btn){
  const k=recNorm(raw);
  if(k.length<24){toast("Le code de secours fait 24 caractères.");return;}
  btn.disabled=true;
  try{
    const s=await fs.doc("recovery/"+k).get();
    if(!s.exists){btn.disabled=false;toast("Code de secours inconnu. Vérifie les caractères.");return;}
    const r=s.data(),old=r.uid,id=r.coupleId;
    if(old===myId){lsSet(COUPLE_KEY,id);lsSet("a2.rec",k);location.reload();return;}
    const members=(r.members||[]).map(m=>m===old?myId:m);
    await fs.doc("couples/"+id).update({members,recoveryKey:k,["names."+myId]:r.name||""});
    await fs.doc("couples/"+id).update({recoveryKey:firebase.firestore.FieldValue.delete()}).catch(()=>{});
    await fs.doc("recovery/"+k).set({coupleId:id,uid:myId,members,name:r.name||""});
    // la photo de profil suit aussi
    try{const cs=await fs.doc("couples/"+id).get();const ph=cs.exists&&cs.data().photos&&cs.data().photos[old];if(ph)await fs.doc("couples/"+id).update({["photos."+myId]:ph,["photos."+old]:firebase.firestore.FieldValue.delete()});}catch(_){}

    try{const ib=await fs.doc("couples/"+id+"/config/inbox").get();const ik=ib.exists&&ib.data()[old];if(ik){await fs.doc("couples/"+id+"/config/inbox").set({[myId]:ik},{merge:true});lsSet("a2.inbox",ik);}}catch(_){}
    // les évènements attribués à l'ancien téléphone passent au nouveau
    try{const evs=await fs.collection("couples/"+id+"/events").get();

}

const WISH_LEAD=[
  /^\s*(?:(?:j['’]ai|on a|j['’]aurais|on aurait)\s+)?(?:bien\s+|trop\s+|grave\s+|tellement\s+)?envie\s+(?:d['’]\s*|de\s+)(?:(?:aller|faire|tester|essayer|voir|visiter|manger|découvrir|decouvrir|refaire|retourner|boire|prendre)\s+)?/i,
  /^\s*(?:ajoute|rajoute|mets|note)\s+(?:(?:à|a|dans)\s+(?:nos|les|mes)\s+envies|aux\s+envies)\s*:?\s*/i,
  /^\s*(?:une\s+)?id[ée]e\s+de\s+sortie\s*:?\s*/i,
  /^\s*on\s+(?:devrait|pourrait|doit)\s+(?:aller|faire|tester|essayer|voir|visiter|refaire|retourner)\s+/i,
  /^\s*(?:à|a)\s+(?:tester|faire|voir|visiter|essayer)\s*:\s*/i,
