<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda à Deux">
<meta name="theme-color" content="#EDEEF5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
.lmap{height:210px;cursor:pointer}
.lmap .leaflet-control-attribution{font-size:9px}
.dur-bubble span{display:inline-block;transform:translate(10px,-34px);background:var(--route);color:#fff;font:800 13px var(--f);padding:4px 10px;border-radius:13px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lmap .leaflet-tile{filter:brightness(.75) contrast(1.1) saturate(.7)}}
.setup{display:flex;flex-direction:column;gap:14px;padding-block:8px}
.setup h2{font-size:1.6rem;font-weight:800;margin:0;letter-spacing:-.02em}
.setup p{margin:0;font-size:1rem}
.pair-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px}
.pair-in{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:12px;font-size:1.05rem;width:100%;min-width:0;color:var(--ink)}
.pair-in.code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800}
.big-code{font-size:2.6rem;font-weight:800;letter-spacing:.25em;text-align:center;color:var(--line);border:2px dashed var(--line);border-radius:18px;padding:14px 8px}
</style>
<script src="config.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<title>Agenda à Deux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..800,0..100;1,9..144,500..800,0..100&display=swap">
<style>
/* Layout: a transit-line timeline. Each outing is a stop on a vertical line: a yellow "départ" stop, then the arrival stop. Rows slide left to reveal Modifier / Supprimer. */
:root{
  --bg:#EDEEF5; --surface:#FFFFFF; --ink:#16163A; --muted:#606181; --hair:#DCDDEA;
  --line:#4338CA; --line-ink:#FFFFFF; --sun:#FFB547; --sun-ink:#2B1800;
  --danger:#D9344F; --danger-ink:#FFFFFF; --ok:#4338CA; --ok-soft:#E5E4FA; --warn:#B4600E;
  --scrim:rgba(12,10,40,.45);
  --map:#E9EAF1; --map-grid:#DDDFEA; --map-text:#5C5E7A; --road:#3B5BDB; --route:#4F46E5; --route-case:#FFFFFF; --go:#2FA84F;
  --f:"Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --c-rdv:#3F67D6; --c-sortie:#A64BC4; --c-medecin:#D2455A; --c-courses:#1F9A5E; --c-travail:#677580; --c-autre:#C98A12;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0E1C; --surface:#171930; --ink:#ECECF7; --muted:#9A9BB8; --hair:#272A45;
  --line:#8B84FF; --line-ink:#0F0C2E; --sun:#FFB547; --sun-ink:#2B1800;
  --danger:#F0607A; --danger-ink:#22040B; --ok:#A9A4FF; --ok-soft:#221F45; --warn:#F0A75A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
  --map:#15172A; --map-grid:#1E2138; --map-text:#A3A5C2; --road:#5B7BF0; --route:#8B84FF; --route-case:#0D0E1C; --go:#2FA84F}}
:root[data-theme="dark"]{
  --bg:#0D0E1C; --surface:#171930; --ink:#ECECF7; --muted:#9A9BB8; --hair:#272A45;
  --line:#8B84FF; --line-ink:#0F0C2E; --sun:#FFB547; --sun-ink:#2B1800;
  --danger:#F0607A; --danger-ink:#22040B; --ok:#A9A4FF; --ok-soft:#221F45; --warn:#F0A75A;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
  --map:#15172A; --map-grid:#1E2138; --map-text:#A3A5C2; --road:#5B7BF0; --route:#8B84FF; --route-case:#0D0E1C; --go:#2FA84F}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--line);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;flex:none}
h1{font-weight:800;font-size:1.55rem;letter-spacing:-.025em;margin:0;line-height:1}
.round{border:1px solid var(--hair);background:var(--surface);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:var(--ink)}
.round svg{width:20px;height:20px}

/* composer */
.composer{background:var(--surface);border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--hair)}
.composer textarea{width:100%;min-height:64px;resize:none;border:none;background:transparent;font-size:1.08rem;outline:none;line-height:1.4}
.composer textarea::placeholder{color:var(--muted)}
.composer .row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn.primary{background:var(--line);border-color:var(--line);color:var(--line-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding-inline:6px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn:disabled{opacity:.55;cursor:default}
.notice{border-radius:14px;padding:10px 14px;font-size:.9rem;background:var(--ok-soft);color:var(--ink)}

/* next departure sign */
.sign{background:var(--sun);color:var(--sun-ink);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:end}
.sign .k{font-size:.88rem;font-weight:500}
.sign .what{font-weight:700;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.sign .big{grid-column:2;grid-row:1 / span 2;font-weight:800;font-size:2.4rem;letter-spacing:-.03em;line-height:1;text-align:right}
.sign .in{grid-column:1 / -1;font-size:.86rem}

/* day + timeline */
.days{display:flex;flex-direction:column;gap:26px}
.day h2{font-size:1.2rem;font-weight:800;letter-spacing:-.015em;margin:0 0 10px}
.day h2 span{font-weight:500;color:var(--muted)}
.stops{display:flex;flex-direction:column;gap:10px}

.swipe{position:relative;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--hair)}
.behind{position:absolute;inset:0 0 0 auto;display:flex;width:172px}
.behind button{flex:1;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:.85rem}
.behind svg{width:20px;height:20px}
.b-edit{background:var(--line);color:var(--line-ink)}
.b-del{background:var(--danger);color:var(--danger-ink)}
.front{position:relative;background:var(--surface);touch-action:pan-y;transition:transform .22s ease;will-change:transform}
.front.dragging{transition:none}

.leg{display:grid;grid-template-columns:52px 22px 1fr;column-gap:8px;padding:0 12px 0 12px}
.leg .t{font-weight:800;font-size:1.02rem;padding-top:12px;text-align:right;letter-spacing:-.01em}
.leg .rail{position:relative}
.leg .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:var(--line)}
.leg.first .rail::before{top:20px}
.leg.last .rail::before{bottom:auto;height:20px}
.leg.solo .rail::before{display:none}
.node{position:absolute;left:50%;top:13px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:4px solid var(--line)}
.node.dep{background:var(--sun);border-color:var(--line)}
.node.arr{border-color:var(--cat,var(--line));background:var(--cat,var(--line))}
.leg .body{padding:10px 0 12px;min-width:0}
.dep-line{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.82rem}
.small{font-size:.86rem;color:var(--muted)}
.ev-title{font-weight:800;font-size:1.12rem;letter-spacing:-.01em;overflow-wrap:anywhere;display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.ev-title .more{flex:none;border:none;background:transparent;color:var(--muted);width:34px;height:30px;border-radius:10px;margin:-4px -4px 0 0;display:grid;place-items:center}
.ev-title .more:hover{background:var(--bg)}
.ev-title .more svg{width:20px;height:20px}
.where{color:var(--muted);font-size:.92rem;overflow-wrap:anywhere;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:.8rem;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--ink)}
.tag.alarm{background:var(--sun);color:var(--sun-ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.stale{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.links .btn{padding:7px 12px;font-size:.84rem}
.by{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);margin-top:10px}
.by i{width:8px;height:8px;border-radius:50%;display:inline-block}
.hint-swipe{font-size:.82rem;color:var(--muted);text-align:center;margin-top:-8px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;color:var(--muted);padding:30px 14px;border:2px dashed var(--hair);border-radius:20px}
.empty strong{color:var(--ink);font-size:1.15rem;font-weight:800}
.empty p{margin:0;max-width:34ch}

/* floating add */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;height:58px;padding:0 22px 0 18px;border-radius:999px;border:none;background:var(--line);color:var(--line-ink);font-weight:800;font-size:1rem;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(20,60,50,.32)}
.fab svg{width:22px;height:22px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--hair);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{margin:0;font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lab{font-size:.86rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.rem select,.rem input{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 11px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.calc{background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.calc .out{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.calc .dep{font-weight:800;font-size:1.6rem;letter-spacing:-.02em}
.calc .dep.has{background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:2px 10px}
.note{font-size:.86rem;color:var(--muted)}
.rems{display:flex;flex-direction:column;gap:8px}
.rem{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:8px}
.rem .rl{grid-column:1 / -1}
.rem .x{border:none;background:none;color:var(--muted);font-size:1.3rem;width:34px;height:34px}
.sheet-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.confirm{background:var(--surface);border:1px solid var(--danger);border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.toast{position:fixed;left:16px;right:16px;margin:0 auto;max-width:440px;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 12px 11px 16px;border-radius:14px;font-size:.92rem;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast button{border:none;background:transparent;color:var(--sun);font-weight:800;padding:4px 6px}

/* address suggestions */
.ac{position:relative;min-width:0}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--hair);border-radius:14px;box-shadow:0 10px 28px rgba(10,30,24,.18);z-index:5;max-height:300px;overflow-y:auto}
.ac-item{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;border:none;background:none;padding:10px 12px;border-bottom:1px solid var(--hair)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item:focus-visible{background:var(--bg)}
.ac-main{font-weight:700;min-width:0;overflow-wrap:anywhere}
.ac-sub{grid-column:1;font-size:.84rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.ac-tag{grid-column:2;grid-row:1;font-size:.76rem;color:var(--line);font-weight:700;align-self:center}
.ac-load{padding:10px 12px;font-size:.86rem;color:var(--muted);display:flex;gap:8px;align-items:center}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.front{transition:none}}
.toggle-past{align-self:center}
.route{border-top:1px dashed var(--hair);margin:0 12px;padding:12px 0 14px;display:flex;flex-direction:column;gap:10px}
.route-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.route-steps{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.route-steps li{position:relative;padding:0 0 9px 24px;font-size:.92rem;overflow-wrap:anywhere}
.route-steps li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.route-steps li::after{content:"";position:absolute;left:8px;top:17px;bottom:-1px;width:2px;margin-left:-1px;background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 7px)}
.route-steps li:last-child{padding-bottom:0}
.route-steps li:last-child::after{display:none}
.route-steps li.from,.route-steps li.to{font-weight:700}
.route-steps li.from::before{background:var(--sun)}
.route-steps li.to::before{background:var(--cat,var(--line));border-color:var(--cat,var(--line))}
.route .links{margin-top:0}
.swipe:not(.open) .more-info{display:none}
.front{cursor:pointer}
.front:focus-visible{outline:2px solid var(--line);outline-offset:-2px}
.ev-right{display:flex;align-items:center;gap:2px;flex:none}
.chev{width:26px;height:26px;display:grid;place-items:center;color:var(--muted);transition:transform .2s ease}
.chev svg{width:20px;height:20px}
.swipe.open .chev{transform:rotate(180deg)}
.swipe:not(.open) .leg .body{padding-bottom:10px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.rmap{border-radius:18px;overflow:hidden;border:1px solid var(--hair)}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:18px;padding:12px 12px 12px 16px}
.go-l{min-width:0}
.go-t{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.1}
.go-btn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:64px;border-radius:16px;background:var(--go);color:#fff;font-weight:800;text-decoration:none}
.go-btn svg{width:22px;height:22px;display:block}
.rmap:not(.lmap) svg{display:block;width:100%;height:auto}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pchip{border:1px solid var(--hair);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:700;color:var(--ink)}
.pchip.on{background:var(--line);border-color:var(--line);color:var(--line-ink)}
.pchip.add{border-style:dashed;border-color:var(--line);color:var(--line);background:transparent}
.psave{display:grid;grid-template-columns:1fr auto;gap:6px;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:8px}
.psave-act{display:flex;gap:6px;justify-content:flex-end;grid-column:1 / -1}
.psave input,.psave select,.pform input,.pform select{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 11px;width:100%;min-width:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:10px 6px 10px 12px}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--c-autre)}
.pdot.home{background:var(--sun);box-shadow:0 0 0 3px var(--line) inset}
.pdot.work{background:var(--line)}
.pinfo{min-width:0}
.pname{font-weight:800}
.pinfo .small{overflow-wrap:anywhere}
.pform{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.ac-search .ac-main{color:var(--line)}
.sheet input.big-title{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;border:none;border-bottom:2px solid var(--hair);border-radius:0;background:transparent;padding:6px 2px;width:100%}
.sheet input.big-title:focus{outline:none;border-bottom-color:var(--line)}
.from-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.disc-wrap{display:flex;flex-direction:column;gap:10px}
.disc{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--hair);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;color:var(--ink);text-align:left}
.disc-chev{color:var(--muted);transition:transform .2s ease}
.disc.open .disc-chev{transform:rotate(180deg)}
.disc-box{display:flex;flex-direction:column;gap:12px}
.rem-simple-wrap{display:flex;flex-direction:column;gap:8px}
.rem-simple{display:flex;flex-direction:column;gap:6px}
.rs-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:11px 12px;cursor:pointer}
.rs-row input{width:20px;height:20px;accent-color:var(--line);flex:none}
.rs-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.rs-txt span{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.rs-row.off .rs-txt{opacity:.5}
.rs-row.main:not(.off){border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset}
.rem-custom{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.rem-custom .rc-lab{grid-column:1 / -1;font-size:.8rem;font-weight:700;color:var(--muted)}
.tag.past{opacity:.45;text-decoration:line-through}
.sign .sign-btn{grid-column:1 / -1;justify-self:start;margin-top:8px;background:var(--sun-ink);color:var(--sun);border-color:transparent}
.sc-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
@media (max-width:430px){h1{font-size:1.25rem;white-space:nowrap}.brand{gap:8px}header .round{width:38px;height:38px}header .round svg{width:18px;height:18px}}
#btn-import{position:relative}
.imp-dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--danger);color:var(--danger-ink);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.imp-start{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.imp-big{justify-content:center;padding:14px 18px;font-size:1.05rem}
.imp-manual summary{color:var(--muted);font-weight:700;padding:6px 0;cursor:pointer}
.imp-manual{display:flex;flex-direction:column;gap:8px}
.imp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.imp-day{font-weight:800;font-size:.9rem;margin-top:8px;color:var(--muted)}
.cal-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--sun);color:var(--sun-ink);border-radius:16px;padding:12px 14px}
.cal-txt{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.9rem}
.cal-banner .btn{flex:none}
.cal-banner{position:relative;padding-right:40px}
.cal-banner .btn.primary{background:var(--sun-ink);color:var(--sun);border-color:transparent;box-shadow:none}
.cal-x{position:absolute;top:4px;right:4px;width:36px;height:36px;border:none;background:none;color:var(--sun-ink);font-size:1.5rem;line-height:1;border-radius:50%;opacity:.75}
.rs-kind{font-size:.76rem;font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:2px 8px}
.sheet-foot.sticky{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:12px 0 calc(6px + env(safe-area-inset-bottom,0px));margin-top:4px;border-top:1px solid var(--hair);z-index:4}
@media (prefers-reduced-motion:reduce){.disc-chev{transition:none}}
.pgroup-h{font-weight:800;font-size:1.02rem;margin-top:8px}
.pbadge{display:inline-block;margin-left:8px;font-size:.72rem;font-weight:700;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:2px 8px;vertical-align:middle}
.btn.padd{align-self:flex-start;border-style:dashed;color:var(--line);border-color:var(--line);background:transparent}
.brand-wrap{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.brand-lab{font-size:.8rem;font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
.pchip.brand{border-color:var(--line);color:var(--line)}
.pchip.brand.on{color:var(--line-ink)}
.brand-panel{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.brand-panel .note{padding:10px 12px}
.brand-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.brand-add input{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 11px;min-width:0}
.pchip:disabled{opacity:.6}
.when-chips .pchip{min-width:44px;text-align:center}
.when-exact{opacity:.85}
.when-exact label{font-size:.72rem}
.rem-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rem-head-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.rem-line{font-size:.92rem;color:var(--ink);overflow-wrap:anywhere}
.tpl-chips .pchip.tpl{font-size:.95rem;padding:9px 14px;background:var(--ok-soft);border-color:transparent;color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--hair)}
.cf{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
.cf-row{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--hair);align-items:baseline}
.cf-row:last-child{border-bottom:none}
.cf-k{font-size:.82rem;font-weight:700;color:var(--muted)}
.cf-v{font-weight:600;min-width:0;overflow-wrap:anywhere}
.cf-v.muted{color:var(--muted);font-weight:400}
.cf-save{flex:1;justify-content:center;padding:13px 18px;font-size:1rem}
.q-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:stretch}
.mic-btn{border:none;border-radius:16px;background:var(--line);color:var(--line-ink);width:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:.82rem}
.mic-btn svg{width:26px;height:26px}
.mic-btn.on{background:var(--danger);color:var(--danger-ink)}
.mic-help{display:flex;gap:12px;align-items:center;background:var(--ok-soft);border-radius:14px;padding:12px 14px}
.mic-help>div:last-child{display:flex;flex-direction:column;gap:2px;font-size:.9rem;min-width:0}
.mic-help-icon{width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--line);flex:none}
.mic-help-icon svg{width:20px;height:20px}
.mic-wave{display:flex;gap:3px;align-items:center;height:28px;flex:none}
.mic-wave i{width:4px;height:10px;border-radius:2px;background:var(--danger);animation:wave 1s ease-in-out infinite}
.mic-wave i:nth-child(2){animation-delay:.15s}.mic-wave i:nth-child(3){animation-delay:.3s}.mic-wave i:nth-child(4){animation-delay:.45s}
@keyframes wave{50%{height:26px}}
@media (prefers-reduced-motion:reduce){.mic-wave i{animation:none;height:18px}}
.fab-mic{position:fixed;right:150px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:none;background:var(--surface);color:var(--line);box-shadow:0 8px 22px rgba(20,60,50,.25);display:grid;place-items:center;border:1px solid var(--hair)}
.fab-mic svg{width:26px;height:26px}
.q-input{width:100%;border:1px solid var(--hair);background:var(--surface);border-radius:16px;padding:14px;font-size:1.1rem;resize:none;color:var(--ink)}
.q-input:focus{outline:2px solid var(--line);outline-offset:0}
.fixes{display:flex;flex-direction:column;gap:8px}
.fixes:empty{display:none}
.fix{background:var(--ok-soft);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fix strong{font-weight:800}
.fix .small{color:var(--ink);overflow-wrap:anywhere}
.fix-act{display:flex;gap:6px;flex-wrap:wrap}

/* Thèmes choisis par chaque personne (data-skin sur la racine) */

@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-skin="ocean"]{--bg:#0C141C;--surface:#132030;--hair:#22344A;--line:#5E9EEA;--line-ink:#06121F;--sun:#4FC9BC;--sun-ink:#04201C;--ok-soft:#15263A;--ok:#7DB4F2;--route:#5E9EEA;--map:#111C27;--map-grid:#1A2836}}
:root[data-theme="dark"][data-skin="ocean"]{--bg:#0C141C;--surface:#132030;--hair:#22344A;--line:#5E9EEA;--line-ink:#06121F;--sun:#4FC9BC;--sun-ink:#04201C;--ok-soft:#15263A;--ok:#7DB4F2;--route:#5E9EEA;--map:#111C27;--map-grid:#1A2836}
:root[data-skin="corail"]{--bg:#FBF1EE;--surface:#FFFFFF;--hair:#EED9D2;--line:#C9473A;--line-ink:#FFFFFF;--sun:#FFC26B;--sun-ink:#2B1700;--ok-soft:#FBE3DD;--ok:#B33E32;--route:#2B7FEA;--map:#F4ECE7;--map-grid:#EBDFD8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-skin="corail"]{--bg:#1A1110;--surface:#261918;--hair:#3D2826;--line:#F07F6F;--line-ink:#2A0905;--sun:#FFB75A;--sun-ink:#2B1700;--ok-soft:#36201D;--ok:#F59A8C;--route:#4A94F5;--map:#211716;--map-grid:#2E201E}}
:root[data-theme="dark"][data-skin="corail"]{--bg:#1A1110;--surface:#261918;--hair:#3D2826;--line:#F07F6F;--line-ink:#2A0905;--sun:#FFB75A;--sun-ink:#2B1700;--ok-soft:#36201D;--ok:#F59A8C;--route:#4A94F5;--map:#211716;--map-grid:#2E201E}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-skin="graphite"]{--bg:#0F1012;--surface:#1A1C1F;--hair:#2C2F33;--line:#E8E8E6;--line-ink:#111214;--sun:#FFD43B;--sun-ink:#1E1A00;--ok-soft:#24272B;--ok:#E8E8E6;--route:#4A94F5;--map:#16181B;--map-grid:#202326}}
:root[data-theme="dark"][data-skin="graphite"]{--bg:#0F1012;--surface:#1A1C1F;--hair:#2C2F33;--line:#E8E8E6;--line-ink:#111214;--sun:#FFD43B;--sun-ink:#1E1A00;--ok-soft:#24272B;--ok:#E8E8E6;--route:#4A94F5;--map:#16181B;--map-grid:#202326}
/* ===== Métamorphose : « Encre et mandarine ». Le moment fort est le panneau du prochain départ ; le reste reste calme. ===== */
:root{--f:"Bricolage Grotesque","Helvetica Neue",Arial,system-ui,sans-serif;--hero:color-mix(in oklab,var(--line) 46%,#05041a);--hero-ink:#F4F3FF;--hero-soft:color-mix(in oklab,var(--hero-ink) 62%,transparent);--lift:0 1px 0 color-mix(in oklab,var(--hair) 80%,transparent),0 14px 34px -22px color-mix(in oklab,var(--line) 55%,transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero:color-mix(in oklab,var(--line) 26%,#05041a);--lift:0 0 0 1px var(--hair)}}
:root[data-theme="dark"]{--hero:color-mix(in oklab,var(--line) 26%,#05041a);--lift:0 0 0 1px var(--hair)}
body{font-variation-settings:"wdth" 100;font-optical-sizing:auto}
.wrap{gap:18px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:130px}
.num,.leg .t,.go-t,.calc .dep{font-variant-numeric:tabular-nums}

/* En-tête : la date du jour en grand, le couple en dessous */
header{flex-wrap:wrap;row-gap:4px}
.brand h1{font-size:1rem;font-weight:700;letter-spacing:0;color:var(--muted)}
.brand-mark{width:26px;height:26px}
.today{flex-basis:100%;position:relative;margin-top:8px}
.today-d{font-size:2.6rem;line-height:.95;font-weight:800;letter-spacing:-.035em;font-variation-settings:"wdth" 80}
.today-d{white-space:nowrap}
.today-d span{display:block;font-size:1.05rem;font-weight:500;letter-spacing:0;color:var(--muted);font-variation-settings:"wdth" 100;margin-bottom:10px;line-height:34px}
.duo{position:absolute;right:0;top:0;display:flex;align-items:center;gap:8px;flex-direction:row-reverse}
.duo-av{display:flex}
.duo-av b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:800;color:#fff;border:3px solid var(--bg)}
.duo-av b+b{margin-left:-11px}
.duo-av b.wait{background:transparent!important;border:2px dashed var(--muted);color:var(--muted)}
.duo-n{font-size:.86rem;color:var(--muted);font-weight:600;max-width:12em;line-height:1.2;text-align:right}
.round{border:none;background:var(--surface);box-shadow:var(--lift)}

/* Semaine : sept jours, un point par évènement */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:-4px}
.wd{border:none;background:transparent;border-radius:16px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink)}
.wd small{font-size:.72rem;color:var(--muted);font-weight:600}
.wd strong{font-size:1.15rem;font-weight:800;font-variation-settings:"wdth" 85;line-height:1}
.wd .dots{display:flex;gap:3px;height:6px}
.wd .dots i{width:6px;height:6px;border-radius:50%;background:var(--cat,var(--line))}
.wd.is-today{background:var(--ink);color:var(--bg)}
.wd.is-today small{color:color-mix(in oklab,var(--bg) 70%,transparent)}
.wd.is-today .dots i{box-shadow:0 0 0 1.5px var(--ink)}
.wd.none strong{opacity:.45}

/* Le panneau du prochain départ */
.sign{background:var(--hero);color:var(--hero-ink);border-radius:30px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:0;position:relative;overflow:hidden;align-items:stretch;isolation:isolate}
.sign::before{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in oklab,var(--sun) 38%,transparent),transparent);z-index:-1}
.sign .k{font-size:.95rem;font-weight:600;color:var(--hero-soft)}
.sign .big{font-size:5.4rem;line-height:.86;font-weight:800;letter-spacing:-.05em;color:var(--sun);font-variation-settings:"wdth" 75;text-align:left;margin:8px 0 6px;grid-column:auto;grid-row:auto}
.sign .in{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.sign .what{font-size:1rem;font-weight:500;color:var(--hero-soft)}
.trip{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:16px}
.trip-from{display:flex}
.trip-from i{width:16px;height:16px;border-radius:50%;border:2px solid var(--hero)}
.trip-from i+i{margin-left:-7px}
.trip-line{height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--hero-soft) 0 6px,transparent 6px 11px);position:relative}
.trip-line b{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sun)}
.trip-to{display:flex;align-items:center;gap:7px;font-weight:700;min-width:0;max-width:52vw}
.trip-to span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-to::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--hero-ink);flex:none;transform:rotate(45deg)}
.trip-meta{margin-top:10px;font-size:.88rem;color:var(--hero-soft)}
.sign .sign-btn{align-self:flex-start;margin-top:14px;background:var(--sun);color:var(--sun-ink);border:none}
.sign.soon .big{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.62}}
.sign.enter{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.sign.enter .big{animation:rise .8s .08s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.sign.enter,.sign.enter .big,.sign.soon .big{animation:none}}

/* Saisie */
.composer{border:none;box-shadow:var(--lift);border-radius:24px;padding:16px 16px 12px}
.composer textarea{font-size:1.15rem;min-height:52px}

/* Jours et évènements */
.days{gap:28px}
.day h2{font-size:1.65rem;font-weight:800;letter-spacing:-.03em;font-variation-settings:"wdth" 82;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;scroll-margin-top:16px}
.day h2 span{font-size:.95rem;letter-spacing:0;font-variation-settings:"wdth" 100}
.stops{gap:12px}
.swipe{border:none;border-radius:24px;box-shadow:var(--lift)}
.leg{grid-template-columns:58px 20px 1fr;padding:0 14px 0 10px}
.leg .t{font-size:1.25rem;font-variation-settings:"wdth" 78;letter-spacing:-.02em;padding-top:13px}
.leg.first .t{color:var(--muted);font-size:1.05rem;padding-top:14px}
.leg .rail::before{width:3px;margin-left:-1.5px;background:color-mix(in oklab,var(--line) 35%,var(--hair))}
.node{width:14px;height:14px;margin-left:-7px;top:17px;border-width:3px}
.node.dep{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in oklab,var(--sun) 28%,transparent)}
.node.arr{box-shadow:0 0 0 4px color-mix(in oklab,var(--cat,var(--line)) 22%,transparent)}
.ev-title{font-size:1.18rem}
.pill{background:color-mix(in oklab,var(--sun) 30%,var(--surface));color:var(--ink)}
.tag{background:var(--bg)}
.swipe.open{box-shadow:0 0 0 2px var(--cat,var(--line)),var(--lift)}
.empty{border:none;background:var(--surface);box-shadow:var(--lift);border-radius:26px;padding:34px 18px}
.empty strong{font-size:1.4rem;font-variation-settings:"wdth" 85;letter-spacing:-.02em}
.cal-banner{border-radius:22px}
.go{border-radius:20px}

/* Barre d'action flottante : parler ou ajouter */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:color-mix(in oklab,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:0 0 0 1px color-mix(in oklab,var(--hair) 70%,transparent),0 18px 40px -16px rgba(10,8,40,.45)}
.dock:not(:has(button:not([hidden]))){display:none}
.dock .fab,.dock .fab-mic{position:static;box-shadow:none}
.dock .fab-mic{width:54px;height:54px;border:none;background:color-mix(in oklab,var(--line) 14%,var(--surface));color:var(--line)}
.dock .fab{height:54px;padding:0 26px 0 20px;font-size:1.02rem}
.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px));border-radius:18px}

/* Feuilles */
.sheet{border-radius:30px 30px 0 0;padding-top:12px}
.sheet-h h2{font-size:1.55rem;font-variation-settings:"wdth" 85;letter-spacing:-.03em}
.btn.primary{box-shadow:0 8px 18px -10px color-mix(in oklab,var(--line) 80%,transparent)}
.cf,.calc,.rs-row,.prow,.disc,.pair-card{border-color:transparent;box-shadow:var(--lift)}
.setup h2{font-size:2.2rem;font-variation-settings:"wdth" 82;letter-spacing:-.035em}
.skin-prev{height:64px}
@media (max-width:380px){.today-d{font-size:2.2rem}.sign .big{font-size:4.6rem}.duo-n{display:none}}

/* Thèmes principaux : chacun change les couleurs, la matière et parfois les lettres. data-p sert aux aperçus. */

:root[data-theme="dark"][data-skin="bonbon"],:root[data-theme="dark"] [data-p="bonbon"]{--bg:#18171D;--surface:#24232B;--ink:#F6F3E4;--muted:#B7B29C;--hair:#F6F3E4;--line:#FF4F9A;--line-ink:#18171D;--sun:#FFE45C;--sun-ink:#18171D;--ok:#FFE45C;--ok-soft:#34321F;--route:#FF4F9A;--map:#22212A;--map-grid:#2E2D37;--hero:#000000;--bgimg:radial-gradient(#2C2B35 1.2px,transparent 1.4px) 0 0/18px 18px;--lift:4px 4px 0 #FFE45C;--cb:2.5px solid #F6F3E4;color-scheme:dark}
:root[data-skin="velours"],[data-p="velours"]{--bg:#170811;--surface:#230E19;--ink:#F8EAF0;--muted:#C9A2B3;--hair:#3D1B2A;--line:#E7B76A;--line-ink:#2A1500;--sun:#E7B76A;--sun-ink:#2A1500;--ok:#E7B76A;--ok-soft:#38182A;--danger:#FF6B7D;--danger-ink:#2A040B;--route:#E7B76A;--map:#1E0B15;--map-grid:#2B1220;--hero:#45102A;--bgimg:radial-gradient(60% 380px at 50% -120px,rgba(231,183,106,.20),transparent 70%);--hero-img:radial-gradient(90% 80% at 100% 0,rgba(231,183,106,.28),transparent 60%);--lift:0 0 0 1px rgba(231,183,106,.16),0 18px 38px -24px rgba(0,0,0,.8);--fd:"Fraunces",Georgia,"Times New Roman",serif;--glow:0 0 26px rgba(231,183,106,.35);color-scheme:dark}
[data-p="encre"]{--hero:#231C6B}
[data-p="metro"]{--bg:#EFF3F0;--surface:#FFFFFF;--ink:#15231E;--line:#1C7C6B;--sun:#F4C02B;--hero:#0F4A3F}
body{background:var(--bgimg,none),var(--bg);min-height:100vh}
.sign{background:var(--hero-img,none),var(--hero-t,var(--hero));box-shadow:var(--hero-ring,none)}
.sign .big{text-shadow:var(--glow,none)}
.swipe,.composer,.empty,.cf,.calc,.rs-row,.prow,.disc,.pair-card,.round,.motif-opt,.cal-banner{border:var(--cb,0 solid transparent)}
.swipe,.composer,.empty{border-radius:var(--r,24px)}
.dock{border:var(--cb,0 solid transparent)}
.today-d,.sign .big,.day h2,.sheet-h h2,.ev-title,.empty strong,.setup h2,.leg .t,.wd strong,.go-t,.skin-name{font-family:var(--fd,var(--f))}
:root[data-skin="jardin"] :is(.today-d,.sign .big,.day h2,.sheet-h h2,.empty strong,.setup h2),:root[data-skin="velours"] :is(.today-d,.sign .big,.day h2,.sheet-h h2,.empty strong,.setup h2){letter-spacing:-.015em;font-weight:600;font-variation-settings:"SOFT" 100,"opsz" 120}
:root[data-skin="jardin"] .sign .big,:root[data-skin="velours"] .sign .big{font-style:italic;font-weight:500}
:root[data-skin="bonbon"] .btn{border-width:2px;border-color:var(--ink)}
:root[data-skin="bonbon"] .btn.primary{box-shadow:3px 3px 0 var(--ink)}
:root[data-skin="bonbon"] .sign{border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--line)}
:root[data-skin="bonbon"] .wd.is-today{background:var(--line);color:var(--ink);border:2px solid var(--ink)}
:root[data-skin="tokyo"] .btn.primary{box-shadow:0 0 18px -2px var(--line)}
:root[data-skin="tokyo"] .wd.is-today{background:var(--line);color:var(--line-ink);box-shadow:0 0 20px -4px var(--line)}
:root[data-skin="aurore"] .wd.is-today,:root[data-skin="velours"] .wd.is-today{background:var(--line);color:var(--line-ink)}
:root[data-skin="aurore"] .swipe,:root[data-skin="aurore"] .composer{background:rgba(15,23,49,.78)}
/* Aperçus vivants dans le choix du thème */
.skins{grid-template-columns:1fr 1fr;gap:12px}
.skin{border:none;padding:0;overflow:hidden;border-radius:22px;box-shadow:var(--lift);gap:0;background:var(--surface)}
.skin.on{box-shadow:0 0 0 3px var(--ink),var(--lift)}
.skin-mini{display:flex;flex-direction:column;gap:7px;padding:10px;background:var(--bgimg,none),var(--bg);height:150px;color:var(--ink)}
.skin-mini .m-hero{border-radius:14px;padding:8px 10px;background:var(--hero-img,none),var(--hero);color:#fff;box-shadow:var(--hero-ring,none);border:var(--cb,0 solid transparent)}
.skin-mini .m-hero small{display:block;font-size:.62rem;opacity:.75;font-weight:600}
.skin-mini .m-hero b{display:block;font-family:var(--fd,var(--f));font-size:2.1rem;line-height:1;font-weight:800;color:var(--sun);letter-spacing:-.04em;font-variation-settings:"wdth" 78;text-shadow:var(--glow,none)}
.skin-mini .m-card{display:flex;align-items:center;gap:7px;border-radius:12px;padding:7px 9px;background:var(--surface);box-shadow:var(--lift);border:var(--cb,0 solid transparent);font-size:.72rem;font-weight:700}
.skin-mini .m-card i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.skin-mini .m-card span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.skin-mini .m-card em{font-style:normal;font-family:var(--fd,var(--f));font-weight:800;color:var(--line)}
.skin-txt{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px}
.skin-name{font-size:1.1rem}
.skin-sub{line-height:1.3}
/* Thèmes par évènement */
.swipe .behind{opacity:0;transition:opacity .12s}
.swipe:has(.front.dragging) .behind,.swipe:has(.front[data-open]) .behind{opacity:1}
/* Décors propres à chaque sortie, sur la carte et sur le grand panneau */
.swipe.themed{--pc:color-mix(in oklab,var(--m) 20%,transparent);--pc2:color-mix(in oklab,var(--m) 34%,transparent)}
.sign.themed{--pc:rgba(255,255,255,.08);--pc2:rgba(255,255,255,.14)}
.swipe.themed .front{background:var(--mp,none),linear-gradient(120deg,color-mix(in oklab,var(--m) 13%,var(--surface)) 0%,var(--surface) 62%)}
.sign.themed{background:var(--mp,none),var(--hero-img,none),var(--hero-t,var(--hero))}
[data-mk="aqua"]{--mp:radial-gradient(circle at 88% 22%,var(--pc2) 0 5px,transparent 6px),radial-gradient(circle at 80% 46%,var(--pc) 0 9px,transparent 10px),radial-gradient(circle at 93% 64%,var(--pc) 0 4px,transparent 5px),radial-gradient(circle at 72% 80%,var(--pc2) 0 3px,transparent 4px),radial-gradient(120% 40px at 50% 100%,var(--pc) 0 60%,transparent 61%)}
[data-mk="ecran"]{--mp:repeating-linear-gradient(90deg,var(--pc2) 0 10px,transparent 10px 20px) top/100% 7px no-repeat,repeating-linear-gradient(90deg,var(--pc2) 0 10px,transparent 10px 20px) bottom/100% 7px no-repeat}
[data-mk="scene"]{--mp:conic-gradient(from 160deg at 85% -10%,transparent 0deg,var(--pc2) 14deg,transparent 30deg,transparent 330deg)}
[data-mk="fun"]{--mp:radial-gradient(circle at 70% 18%,#F59E0B66 0 3px,transparent 4px),radial-gradient(circle at 82% 40%,#22C55E66 0 3px,transparent 4px),radial-gradient(circle at 92% 22%,#3B82F666 0 3px,transparent 4px),radial-gradient(circle at 76% 70%,#EF444466 0 3px,transparent 4px),radial-gradient(circle at 90% 82%,var(--pc2) 0 3px,transparent 4px),radial-gradient(circle at 62% 88%,#F59E0B55 0 2.5px,transparent 3.5px)}
[data-mk="zoo"]{--mp:radial-gradient(ellipse 9px 6px at 78% 25%,var(--pc2) 0 60%,transparent 62%),radial-gradient(ellipse 7px 9px at 90% 48%,var(--pc) 0 60%,transparent 62%),radial-gradient(ellipse 10px 7px at 74% 70%,var(--pc) 0 60%,transparent 62%),radial-gradient(ellipse 6px 8px at 94% 82%,var(--pc2) 0 60%,transparent 62%)}
[data-mk="parc"]{--mp:radial-gradient(60px 40px at 100% 100%,var(--pc) 0 70%,transparent 72%),radial-gradient(40px 30px at 86% 100%,var(--pc2) 0 70%,transparent 72%)}
[data-mk="visite"]{--mp:repeating-linear-gradient(90deg,transparent 0 22px,var(--pc) 22px 30px) right bottom/45% 100% no-repeat}
[data-mk="jeux"]{--mp:conic-gradient(var(--pc) 25%,transparent 0 50%,var(--pc) 0 75%,transparent 0) right top/14px 14px,linear-gradient(transparent,transparent)}
[data-mk="jeux"].swipe .front{background:conic-gradient(var(--pc) 25%,transparent 0 50%,var(--pc) 0 75%,transparent 0) right top/14px 14px no-repeat,linear-gradient(90deg,transparent 60%,transparent),linear-gradient(120deg,color-mix(in oklab,var(--m) 13%,var(--surface)) 0%,var(--surface) 62%)}
[data-mk="plage"]{--mp:radial-gradient(circle at 12px -4px,transparent 10px,var(--pc) 11px 15px,transparent 16px) left bottom/24px 14px repeat-x}
[data-mk="neige"]{--mp:radial-gradient(circle at 70% 20%,var(--pc2) 0 2px,transparent 3px),radial-gradient(circle at 84% 34%,var(--pc2) 0 2.5px,transparent 3.5px),radial-gradient(circle at 92% 14%,var(--pc) 0 2px,transparent 3px),radial-gradient(circle at 78% 58%,var(--pc) 0 2px,transparent 3px),radial-gradient(circle at 95% 70%,var(--pc2) 0 2px,transparent 3px),linear-gradient(160deg,transparent 70%,var(--pc) 70.5%)}
[data-mk="amour"]{--mp:radial-gradient(circle at 86% 24%,var(--pc) 0 4px,transparent 5px),radial-gradient(circle at 78% 70%,var(--pc) 0 3px,transparent 4px)}

.swipe.themed .front{background:linear-gradient(120deg,color-mix(in oklab,var(--m) 13%,var(--surface)) 0%,var(--surface) 62%)}
.swipe.themed .behind{background:var(--surface)}
.motif-wm{position:absolute;right:-14px;bottom:-18px;width:118px;height:118px;color:var(--m);opacity:.13;pointer-events:none;transform:rotate(-12deg)}
.motif-wm svg{width:100%;height:100%;display:block}
.swipe.themed .leg,.swipe.themed .route{position:relative}
.motif-chip{display:inline-flex;align-items:center;gap:5px;color:var(--m);font-weight:700;margin-right:6px}
.motif-chip svg{width:16px;height:16px;flex:none}
.motif-chip+*{color:var(--muted)}
.swipe.themed .node.arr{background:var(--m);border-color:var(--m)}
.sign.themed{--hero-t:color-mix(in oklab,var(--m) 38%,var(--hero))}
.sign.themed::before{background:radial-gradient(closest-side,color-mix(in oklab,var(--m) 45%,transparent),transparent)}
.sign .motif-wm{right:-22px;bottom:auto;top:18px;width:170px;height:170px;color:#fff;opacity:.12;z-index:-1}
.motifs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.motif-opt{border:none;border-radius:18px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:.86rem;color:var(--ink);background:color-mix(in oklab,var(--m,var(--hair)) 12%,var(--surface));box-shadow:var(--lift)}
.motif-opt small{font-weight:500;color:var(--muted);font-size:.74rem;margin-top:-4px}
.motif-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--m,var(--hair));color:#fff}
.motif-ic svg{width:24px;height:24px}
.motif-opt.on{box-shadow:0 0 0 2.5px var(--m,var(--ink))}
.motif-opt.plain .motif-ic{background:transparent;border:2px dashed var(--muted)}

/* Qui vient */
.who{display:inline-flex;flex:none;margin-right:2px}
.who b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.66rem;font-weight:800;color:#fff;border:2px solid var(--surface)}
.who b+b{margin-left:-8px}
.who-filter{margin:-6px 0 2px}
.who-filter .pchip{background:transparent}
.who-filter .pchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* Courses */
.shop{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:12px;border-radius:16px;background:color-mix(in oklab,var(--m,var(--line)) 8%,var(--surface));border:1px solid color-mix(in oklab,var(--m,var(--line)) 22%,transparent)}
.shop-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.shop-list{display:flex;flex-direction:column}
.shop-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--hair)}
.shop-row:last-child{border-bottom:none}
.shop-row input{width:22px;height:22px;accent-color:var(--m,var(--line))}
.shop-row label{overflow-wrap:anywhere;font-weight:600}
.shop-row.done label{text-decoration:line-through;color:var(--muted);font-weight:400}
.shop-row .x{border:none;background:none;color:var(--muted);font-size:1.3rem;width:34px;height:34px}
.shop-add{display:grid;grid-template-columns:1fr auto;gap:8px}
.shop-add input{border:1px solid var(--hair);background:var(--surface);border-radius:12px;padding:10px 11px;min-width:0}
/* Météo */
.wx{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 12px;border-radius:16px;background:var(--bg)}
.wx-ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;color:#fff;background:#64748B}
.wx-ic svg{width:24px;height:24px}
.wx-sun{background:#F59E0B}.wx-part{background:#38BDF8}.wx-rain{background:#2563EB}.wx-snow{background:#0EA5E9}.wx-storm{background:#6D28D9}.wx-fog{background:#94A3B8}
.wx-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.wx-t strong{font-size:1.25rem;font-family:var(--fd,var(--f))}
.wx-t small{color:var(--muted);font-size:.84rem}
/* Mois */
.today-d{cursor:pointer;background:none;border:none;padding:0;text-align:left;color:inherit;display:block}
.today-d .chev-m{display:inline-block;width:.5em;height:.5em;border-right:.12em solid var(--muted);border-bottom:.12em solid var(--muted);transform:rotate(45deg) translate(-.12em,-.12em);margin-left:.25em;vertical-align:.12em}
.month-nav{display:flex;justify-content:space-between;align-items:center;gap:6px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{font-size:.72rem;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.md{aspect-ratio:1/1.05;border:none;border-radius:14px;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;box-shadow:var(--lift)}
.md.pad{background:transparent;box-shadow:none}

const $=s=>document.querySelector(s);
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="class") e.className=v;
    else if(k==="style") e.setAttribute("style",v);
    else if(k==="html") e.innerHTML=v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const k of kids.flat()) if(k!=null&&k!==false) e.append(k instanceof Node?k:document.createTextNode(String(k)));
  return e;
}
const pad=n=>String(n).padStart(2,"0");
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());

function fmtDur(m){m=Math.round(m);if(m<60)return m+" min";const h=Math.floor(m/60),r=m%60;return h+" h"+(r?" "+pad(r):"");}
function dayParts(d){
  const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);
  const diff=Math.round((x-t)/86400000);
  const full=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  if(diff===0) return ["Aujourd'hui",full];
  if(diff===1) return ["Demain",full];
  if(diff===-1) return ["Hier",full];
  return [full.charAt(0).toUpperCase()+full.slice(1),""];
}
function remWhen(ev,r){return new Date(startOf(ev).getTime()-r.min*60000);}
function remLabel(ev,r){

/* ---------- Swipe ---------- */
let openFront=null;
function closeOpen(except){ if(openFront&&openFront!==except){openFront.style.transform="";openFront.dataset.open="";openFront=null;} }
function setOpen(front,open){
  closeOpen(front);
  front.style.transform=open?"translateX(-172px)":"";
  front.dataset.open=open?"1":"";
  openFront=open?front:null;
}
function makeSwipe(front){
  let sx=0,sy=0,dx=0,active=false,decided=false,horiz=false,base=0,pid=null;
  front.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0) return;
    if(e.target.closest("a,button,input,select")) return;
    sx=e.clientX;sy=e.clientY;dx=0;active=true;decided=false;horiz=false;pid=e.pointerId;
    base=front.dataset.open?-172:0;
  });
  front.addEventListener("pointermove",e=>{
    if(!active||e.pointerId!==pid) return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(!decided){ if(Math.abs(mx)<8&&Math.abs(my)<8) return; decided=true; horiz=Math.abs(mx)>Math.abs(my);
      if(horiz){front.classList.add("dragging");try{front.setPointerCapture(pid);}catch(_){}} }
    if(!horiz) return;
    dx=mx;const x=Math.max(-200,Math.min(0,base+dx));
    front.style.transform="translateX("+x+"px)";
  });
  const end=()=>{
    if(!active) return; active=false;
    front.classList.remove("dragging");
    if(!horiz){ if(!decided&&front.dataset.open){ setOpen(front,false); front.dataset.justClosed="1"; } return; }
    const x=base+dx; setOpen(front,x<-60);
  };
  front.addEventListener("pointerup",end);
  front.addEventListener("pointercancel",end);
  front.addEventListener("click",e=>{ if(horiz){e.preventDefault();e.stopImmediatePropagation();horiz=false;} },true);
}
document.addEventListener("pointerdown",e=>{ if(openFront&&!e.target.closest(".swipe")) closeOpen(); });

/* ---------- Rendering ---------- */
let renderSeq=0;
async function render(){
  try{importBadge();}catch(_){}
  const seq=++renderSeq;
  const now=Date.now();
  const all=[...events.values()].sort((a,b)=>startOf(a)-startOf(b));
  const upcoming=all.filter(e=>startOf(e).getTime()>now-3*3600000);
  const past=all.filter(e=>startOf(e).getTime()<=now-3*3600000).reverse();
  $("#btn-past").hidden=past.length===0;
  $("#btn-past").textContent=showPast?"Masquer les évènements passés":"Voir les évènements passés ("+past.length+")";

  if(pend.length&&myId&&pend.some(e=>!hideSet.has(e.id))) list.append(el("div",{class:"cal-banner"},
    el("div",{class:"cal-txt"},el("strong",{},pend.length>1?pend.length+" évènements ne sont pas dans ton calendrier":"1 évènement n'est pas dans ton calendrier"),
      el("span",{},"Sans ça, leurs rappels ne sonneront pas quand l'app est fermée.")),
    el("button",{class:"btn primary",type:"button",onclick:()=>addManyToCalendar(pend)},pend.length>1?"Tout ajouter":"Ajouter"),
    el("button",{class:"cal-x",type:"button","aria-label":"Masquer ce bandeau",onclick:()=>{try{localStorage.setItem("a2.calHide",pendSig);}catch(_){}render();toast("Bandeau masqué. Il reviendra pour un nouvel évènement.");}},"×")));
  if(!upcoming.length){$("#next").hidden=true;}
  {const wk=weekendCard();if(wk)list.append(wk);}

    list.append(el("div",{class:"empty"},el("strong",{},"Rien de prévu pour l'instant"),

    box.append(stop(ev,who));
  }

function hintShown(){try{const v=localStorage.getItem("ad-hint")||"0";localStorage.setItem("ad-hint",String(+v+1));return +v>4;}catch(_){return false;}}

let heroShown=false;
function renderNext(upcoming){
  const n=$("#next"),now=Date.now();
  renderToday();renderWeek();
  const ev=upcoming.find(e=>(hasTripEv(e)?departOf(e):startOf(e)).getTime()>now-15*60000);
  const ref=ev?(hasTripEv(ev)?departOf(ev):startOf(ev)):null;
  if(!ev||ref-now>7*86400000){n.hidden=true;return;}
  const trip=hasTripEv(ev);
  const mins=Math.round((ref-now)/60000);
  const sameDay=ymd(ref)===ymd(new Date());
  const tomorrow=ymd(ref)===ymd(new Date(now+86400000));
  let when;
  if(mins<=0) when=trip?"C'est l'heure de partir":"C'est maintenant";
  else if(mins<12*60||sameDay) when=(trip?"Partez dans ":"Dans ")+fmtDur(mins);

  n.textContent="";n.hidden=false;

  n.append(...[
    el("div",{class:"k"},(trip?"Prochain départ":"Prochain moment à deux")+(hk?", "+MOTIFS[hk].name.toLowerCase():"")),
    el("div",{class:"big num"},hhmm(ref)),
    el("div",{class:"in"},when),
    el("div",{class:"what"},ev.title+(trip?", rendez-vous à "+ev.time:"")),
    trip?el("div",{class:"trip"},from,el("span",{class:"trip-line"},el("b",{style:"width:"+pct+"%"})),el("span",{class:"trip-to"},el("span",{},shortAddr(ev.location)||ev.title))):null,
    trip?el("div",{class:"trip-meta"},fmtDur(ev.travelMin)+" "+MODE_IN[ev.mode]+", "+(ev.marginMin||0)+" min de marge comprises"):null].filter(Boolean));
  if(trip&&IS_IOS&&canWrite){const b=alarmButton(ev,"sign-btn");if(b)n.append(b);}

function renderToday(){
  const d=new Date();
  const t=$("#today-d");if(t){t.textContent="";t.append(el("span",{},d.toLocaleDateString("fr-FR",{weekday:"long"}).replace(/^./,c=>c.toUpperCase())),d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"}),el("i",{class:"chev-m","aria-hidden":"true"}));t.onclick=()=>openMonth();}

  const t=norm((ev&&ev.title)||"")+" "+(loc.length<16&&!/\d/.test(loc)?loc+" ":"")+norm((ev&&ev.notes)||"").slice(0,60);
  for(const [k,m] of Object.entries(MOTIFS)) if(m.re.test(t)) return k;

}

/* ---------- Liste de courses partagée ---------- */
function isShopping(ev){return motifOf(ev)==="panier"||ev.category==="courses";}
function shopBlock(ev){
  const items=Array.isArray(ev.items)?ev.items.filter(x=>x&&x.t):[];
  const box=el("div",{class:"shop"});
  const done=items.filter(x=>x.done).length;
  const save=async list=>{try{await db.doc("events/"+ev.id).update({items:list.slice(0,150),updatedBy:myId,updatedAt:Date.now()});}catch(_){toast("Liste non enregistrée. Vérifie ta connexion.");}};
  box.append(el("div",{class:"shop-h"},el("span",{class:"lab"},"Liste de courses"),el("span",{class:"note num"},items.length?done+" sur "+items.length+" dans le panier":"Vide pour l'instant")));
  const ul=el("div",{class:"shop-list"});
  items.forEach((it,i)=>{
    const cb=el("input",{type:"checkbox",id:"sh-"+ev.id+"-"+i});cb.checked=!!it.done;
    cb.onchange=()=>{const l=items.map(x=>({...x}));l[i].done=cb.checked;l[i].by=myId;save(l);};
    ul.append(el("div",{class:"shop-row"+(it.done?" done":"")},cb,el("label",{for:cb.id},it.t),
      el("button",{type:"button",class:"x","aria-label":"Retirer "+it.t,onclick:()=>save(items.filter((_,j)=>j!==i))},"×")));
  });
  const inp=el("input",{type:"text",placeholder:"Ajouter : lait, pain, œufs…","aria-label":"Ajouter un article",enterkeyhint:"done"});
  const add=()=>{const v=inp.value.split(/[,;\n]/).map(x=>x.trim()).filter(Boolean).map(x=>x.slice(0,60));if(!v.length)return;inp.value="";save([...items,...v.map(t=>({t,done:false,by:myId}))]);};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
  box.append(ul,el("div",{class:"shop-add"},inp,el("button",{type:"button",class:"btn primary",onclick:add},"Ajouter")));
  if(done) box.append(el("button",{type:"button",class:"btn quiet",onclick:()=>save(items.filter(x=>!x.done))},"Retirer les articles cochés"));
  return box;
}

/* ---------- Code de secours : reprendre sa place si l'app perd ses données ---------- */
function recFormat(k){return (k||"").replace(/(.{4})(?=.)/g,"$1-");}

  const sig=JSON.stringify(body);if(syncRecovery._last===sig)return;

    try{const evs=await fs.collection("couples/"+id+"/events").get();
      for(const d of evs.docs){const x=d.data(),p={};if(x.who===old)p.who=myId;if(x.createdBy===old)p.createdBy=myId;if(Object.keys(p).length)await d.ref.update(p);}}catch(_){}

  }catch(e){console.error(e);btn.disabled=false;toast("Récupération impossible. Vérifie le code, ta connexion, et que les règles Firebase sont à jour.");}

  const p=getJson(`${GEO}/completion?text=${enc}&type=PositionOfInterest&maximumResponses=4${near?`&lonlat=${near.lon},${near.lat}`:""}`,signal)
    .then(j=>(j.results||[]).filter(r=>r.kind!=="street"&&r.fulltext).map(r=>({address:r.fulltext,name:"",lat:r.y,lon:r.x}))).catch(()=>[]);

/* ---------- Route map (schematic) ---------- */
const SVGNS="http://www.w3.org/2000/svg";
function sv(tag,attrs,...kids){const e=document.createElementNS(SVGNS,tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);for(const k of kids)if(k!=null)e.append(k instanceof Node?k:document.createTextNode(String(k)));return e;}

  const pt=a=>{let la,lo;if(Array.isArray(a)){la=+a[0];lo=+a[1];}else if(a&&typeof a==="object"){la=+(a.lat??a.latitude);lo=+(a.lon??a.lng??a.longitude);}else return null;
    return Number.isFinite(la)&&Number.isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180?{lat:+la.toFixed(5),lon:+lo.toFixed(5)}:null;};

  const from=pt(g.from),to=pt(g.to);if(!from||!to||kmBetween(from,to)>800)return null;
  const path=(Array.isArray(g.path)?g.path:[]).map(pt).filter(p=>p&&kmBetween(p,from)<900).slice(0,400);
  const marks=(Array.isArray(g.marks)?g.marks:[]).map(m=>m&&pt(m.at)&&m.name?{name:String(m.name).slice(0,28),at:pt(m.at)}:null).filter(m=>m&&kmBetween(m.at,from)<300).slice(0,6);

}
function routeKm(g){const pts=[g.from,...g.path,g.to];let d=0;for(let i=1;i<pts.length;i++)d+=kmBetween(pts[i-1],pts[i]);return d;}
function routeMap(g,ev){

async function saveEventDraft(x,d,repeat){

  if(!x.date||!x.time){toast("Indique la date et l'heure.");return false;}
  if(!db){toast("Synchronisation indisponible. Vérifie ta connexion.");return false;}
  const isNew=!d.id;
  try{
    const rp=REPEATS[repeat]||REPEATS.none;
    if(isNew&&rp[2]>0){
      const seriesId="s"+Date.now().toString(36);
      const base=startOf(x);
      for(let i=0;i<rp[2];i++){
        const dt=new Date(base);
        if(repeat==="year"){dt.setDate(1);dt.setFullYear(base.getFullYear()+i);dt.setDate(Math.min(base.getDate(),new Date(dt.getFullYear(),base.getMonth()+1,0).getDate()));}
        else if(repeat==="month"){const day=base.getDate();dt.setDate(1);dt.setMonth(base.getMonth()+i);dt.setDate(Math.min(day,new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()));}

        const extra=repeat==="year"&&!(x.reminders||[]).some(r=>+r.day===7)?{reminders:[...(x.reminders||[]),{day:7,at:"18:00",label:"Dans une semaine : "+(x.title||"date importante")}]}:{};
        await db.doc("events/"+db.collection("events").doc().id).set(buildBody(x,d,{date:ymd(dt),seriesId,...extra}));
      }
      toast(rp[2]+" évènements créés ("+rp[0].toLowerCase()+")");
    }else{
      await db.doc("events/"+(d.id||db.collection("events").doc().id)).set(buildBody(x,d));
      toast(isNew?"Enregistré, visible sur vos deux téléphones":"Modifications enregistrées pour vous deux");
    }
    $("#input").value="";
    return true;
  }catch(e){toast(e&&e.code==="invalid_argument"?"Enregistrement refusé. Vérifie que tu as bien rejoint l'agenda.":"Enregistrement impossible. Réessaie.");return false;}
}

/* ---------- Lecture des phrases en français (sans connexion) ---------- */
const parseText=(()=>{
// Lecture d'une phrase en français : "Dentiste vendredi 14h30 12 rue de la République à Lyon"
// -> { title, category, date, time, location, origin, ... }. Aucune connexion nécessaire.

const DEFAULT_TIME = { medecin: '09:00', rdv: '10:00', travail: '09:00', sortie: '20:00', courses: '10:00', autre: '10:00' };

const strip = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const WEEKDAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MONTHS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
const STREET = '(?:rue|avenue|av\\.?|boulevard|bd|place|pl\\.|chemin|allee|impasse|quai|route|rte|cours|square|residence|rond-point|lotissement|faubourg|passage|esplanade|promenade)';

const CAT_WORDS = {
  medecin: ['medecin', 'docteur', 'dr ', 'dentiste', 'kine', 'osteo', 'ophtalmo', 'dermato', 'gyneco', 'pediatre', 'hopital', 'clinique', 'pharmacie', 'radio', 'irm', 'scanner', 'analyse', 'prise de sang', 'labo', 'vaccin', 'orthodontiste', 'psy', 'veterinaire', 'veto', 'sage-femme', 'echographie'],
  courses: ['courses', 'supermarche', 'carrefour', 'leclerc', 'auchan', 'lidl', 'intermarche', 'monoprix', 'casino', 'franprix', 'marche', 'drive', 'boulangerie', 'ikea', 'magasin', 'shopping'],
  sortie: ['resto', 'restaurant', 'cinema', 'cine', 'bar', 'concert', 'soiree', 'anniversaire', 'anniv', 'apero', 'theatre', 'musee', 'balade', 'diner', 'dejeuner', 'brunch', 'spectacle', 'match', 'piscine', 'plage', 'zoo', 'expo', 'mariage', 'bowling', 'sport', 'salle de sport'],
  travail: ['reunion', 'travail', 'boulot', 'bureau', 'entretien', 'rendez-vous client', 'formation', 'seminaire'],
  rdv: ['rdv', 'rendez-vous', 'rendez vous', 'banque', 'notaire', 'mairie', 'prefecture', 'garage', 'coiffeur', 'controle technique', 'avocat', 'assurance', 'poste'],
};

function guessCategory(low) {
  for (const cat of ['medecin', 'courses', 'sortie', 'travail', 'rdv']) {
    if (CAT_WORDS[cat].some((w) => new RegExp('(^|[^a-z])' + w.replace(/[-]/g, '[- ]').trim() + '([^a-z]|$)').test(low))) return cat;
  }
  return 'autre';
}

function nextWeekday(now, wd, allowToday) {
  const d = new Date(now); d.setHours(0, 0, 0, 0);
  let diff = (wd - d.getDay() + 7) % 7;
  if (diff === 0 && !allowToday) diff = 7;
  d.setDate(d.getDate() + diff);
  return d;
}

function parseText(text, opts = {}) {
  const now = opts.now ? new Date(opts.now) : new Date();
  const places = opts.places || [];
  const orig = String(text || '').replace(/\s+/g, ' ').trim();
  const low = strip(orig);
  const spans = []; // [start, end) to remove from the title
  const take = (m, idx) => { spans.push([idx, idx + m.length]); };
  const blockedSpan = (i) => spans.some(([a, b]) => i >= a && i < b);

  // ---------- heure ----------
  let time = null, timeIdx = -1;
  let m = /(?:\b(?:a|vers|pour|des)\s+)?\b([01]?\d|2[0-3])\s*(?:h|:)\s*([0-5]\d)?(?![\d/])/.exec(low);
  if (m) { time = pad(+m[1]) + ':' + pad(m[2] ? +m[2] : 0); timeIdx = m.index; take(m[0], m.index); }
  if (!time && (m = /\b(?:a\s+)?midi\b/.exec(low)) && !/apres-?\s?midi/.test(low.slice(Math.max(0, m.index - 6), m.index + 5))) { time = '12:00'; timeIdx = m.index; take(m[0], m.index); }
  if (!time && (m = /\b(?:a\s+)?minuit\b/.exec(low))) { time = '23:59'; timeIdx = m.index; take(m[0], m.index); }

  // ---------- date ----------
  let date = null, dateIdx = -1;
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const plus = (n) => { const d = new Date(today); d.setDate(d.getDate() + n); return d; };
  const tryDate = (re, fn) => {
    if (date) return;
    const r = re.exec(low);
    if (r) { const d = fn(r); if (d && !isNaN(d)) { date = d; dateIdx = r.index; take(r[0], r.index); } }
  };
  tryDate(/\bapres[- ]demain\b/, () => plus(2));
  tryDate(/\bdemain\b/, () => plus(1));
  tryDate(/\bdans\s+(\d{1,2})\s+jours?\b/, (r) => plus(+r[1]));
  tryDate(/\b(?:dans\s+une\s+semaine|la\s+semaine\s+prochaine)\b/, () => plus(7));
  tryDate(/\b(?:le\s+)?(\d{1,2})[/.](\d{1,2})(?:[/.](\d{2,4}))?\b/, (r) => {
    let y = r[3] ? +r[3] : now.getFullYear(); if (y < 100) y += 2000;
    let d = new Date(y, +r[2] - 1, +r[1]);
    if (!r[3] && d < today) d = new Date(y + 1, +r[2] - 1, +r[1]);
    return d;
  });
  tryDate(new RegExp('\\b(?:(?:' + WEEKDAYS.join('|') + ')\\s+)?(?:le\\s+)?(1er|\\d{1,2})\\s+(' + MONTHS.join('|') + ')(?:\\s+(\\d{4}))?\\b'), (r) => {
    const day = r[1] === '1er' ? 1 : +r[1];
    let y = r[3] ? +r[3] : now.getFullYear();
    let d = new Date(y, MONTHS.indexOf(r[2]), day);
    if (!r[3] && d < today) d = new Date(y + 1, MONTHS.indexOf(r[2]), day);
    return d;
  });
  tryDate(new RegExp('\\b(?:(ce|le)\\s+)?(' + WEEKDAYS.join('|') + ')(?:\\s+(prochain|d\'apres|en huit))?(?:\\s+(\\d{1,2})(?!\\s*(?:h|:|\\d)))?\\b'), (r) => {
    const wd = WEEKDAYS.indexOf(r[2]);
    if (r[4]) { // "lundi 13"
      const n = +r[4];
      let d = new Date(now.getFullYear(), now.getMonth(), n);
      if (d < today) d = new Date(now.getFullYear(), now.getMonth() + 1, n);
      return d;
    }
    const d = nextWeekday(now, wd, r[1] === 'ce');
    if (r[3] === 'en huit' || r[3] === "d'apres") d.setDate(d.getDate() + 7);
    return d;
  });
  tryDate(/\b(?:aujourd'?hui|ce\s+(?:soir|matin|midi)|cet\s+apres-?\s?midi|tout\s+a\s+l'heure|tantot)\b/, () => plus(0));
  tryDate(/\b(?:le\s+)(1er|\d{1,2})(?!\s*(?:h|:|\/|\d|\s*(?:rue|avenue|bd|boulevard|place|chemin)))\b/, (r) => {
    const n = r[1] === '1er' ? 1 : +r[1];
    if (n < 1 || n > 31) return null;
    let d = new Date(now.getFullYear(), now.getMonth(), n);
    if (d < today) d = new Date(now.getFullYear(), now.getMonth() + 1, n);
    return d;
  });
  // "ce soir", "ce matin" donnent aussi une heure par défaut
  if (!time) {

function impDate(txt){

  if((m=/(\d{4})-(\d{2})-(\d{2})(?:[t ](\d{1,2}):(\d{2}))?/.exec(t))){y=+m[1];mo=+m[2];d=+m[3];if(m[4]!=null){h=+m[4];mi=+m[5];}idx=m.index;len=m[0].length;}

  else if((m=/(\d{1,2})(?:er)?\s+([a-z]{3,9})\.?\s+(\d{4})/.exec(t))&&IMP_MONTHS[m[2]]){d=+m[1];mo=IMP_MONTHS[m[2]];y=+m[3];idx=m.index;len=m[0].length;}
  else if((m=/([a-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/.exec(t))&&IMP_MONTHS[m[1]]){mo=IMP_MONTHS[m[1]];d=+m[2];y=+m[3];idx=m.index;len=m[0].length;}
  else return null;
  if(h==null){const rest=t.slice(idx+len);const tm=/(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(am|pm)?/.exec(rest);

  return {date:y+"-"+pad(mo)+"-"+pad(d),time:h==null?null:pad(h)+":"+pad(mi),idx,len};

// Une ligne par évènement : « Titre | Début | Lieu ». Une ligne sans date complète le lieu de la précédente.
function parseImport(text){
  const out=[];
  for(const raw of String(text||"").split(/\r?\n/)){
    const line=raw.replace(/["«»“”]/g," ").replace(/\s+/g," ").trim();if(!line)continue;
    const parts=line.split(/\s*\|\s*/);
    let found=null,pi=-1;
    for(let i=0;i<parts.length;i++){const dd=impDate(parts[i]);if(dd){found=dd;pi=i;break;}}
    if(!found){ if(out.length){const l=out[out.length-1];l.location=[l.location,line.replace(/\|/g," ").trim()].filter(Boolean).join(", ");} continue; }
    let title=parts.slice(0,pi).join(" ").trim();
    const after=parts.slice(pi+1).filter(x=>x&&!impDate(x)).join(", ").trim();
    if(!title){title=parts[pi].slice(0,found.idx).trim();}
    out.push({title:title||"Évènement",date:found.date,time:found.time||"09:00",allDay:!found.time,location:after});
  }

}

  help.textContent="";help.append(el("div",{class:"mic-wave"},el("i"),el("i"),el("i"),el("i")),el("div",{},el("strong",{},"Parle maintenant"),el("span",{},"Quoi, quand et où. Touche à nouveau le bouton pour arrêter.")));help.hidden=false;

  db.collection("memories").onSnapshot(snap=>{
    memories=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    const bm=$("#btn-mem");bm.hidden=false;bm.textContent=memories.size?"Nos souvenirs ("+memories.size+")":"Nos souvenirs";
    if(events.size)render();
  },()=>{});
  db.collection("places").onSnapshot(snap=>{
    places=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    refreshPlaceUI();render();
  },()=>{});
  db.doc("config/templates").onSnapshot(snap=>{templates=snap.exists&&Array.isArray(snap.data().list)?snap.data().list:null;if(templatesRefresh)templatesRefresh();},()=>{});
  db.doc("config/brands").onSnapshot(snap=>{brands=snap.exists&&Array.isArray(snap.data().list)?snap.data().list:[];refreshBrandUI();},()=>{});
  startInbox();
  db.doc("config/home").onSnapshot(snap=>{if(snap.exists){const x=snap.data();settings={home:x.home||"",mode:x.mode||"car"};}},()=>{});
  db.collection("events").orderBy("startTs").onSnapshot(snap=>{
    if(!firstSnap){
      for(const ch of snap.docChanges()){
        const x=ch.doc.data()||{};
        if(ch.type==="removed") continue;
        if(x.updatedBy&&x.updatedBy!==myId&&!ch.doc.metadata.hasPendingWrites){
          const prev=events.get(ch.doc.id);
          const who=(couple&&couple.names&&couple.names[x.updatedBy])||"L'autre";
          if(!prev) toast(who+" a ajouté « "+x.title+" »");
          else if(prev.updatedAt!==x.updatedAt) toast(who+" a modifié « "+x.title+" »");
        }
      }
    }
    firstSnap=false;
    events=new Map(snap.docs.map(doc=>[doc.id,{id:doc.id,...doc.data()}]));
    render();
  },()=>notice("La synchronisation s'est interrompue. Vérifie ta connexion puis rouvre l'app."));
})();
</script>
</body>
</html>
