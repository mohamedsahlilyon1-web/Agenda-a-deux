name: Diagnostic notifications
on:
  push:
    branches: [main]
    paths: ["diag/trigger.txt"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire l'état du serveur (compteurs seulement)
        run: |
          API=https://api.cloudflare.com/client/v4; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          URL=$(jq -r .url push.json)
          ACC=$(curl -s -H "$AUTH" "$API/accounts" | jq -r '.result[0].id')
          KV=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="together-push-KV") | .id' | head -1)
          KEY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/key")
          CAL_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/cal/zzzzzz/00000000000000000000000000000000/x.ics")
          ADD_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/add/zzzzzz/u/000000000000000000000000?t=x")
          CAR_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/car/zzzzzz/u/000000000000000000000000")
          IDX=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/index")
          # vacances scolaires lues par le serveur (données publiques : noms et dates)
          VAC=$(curl -s --max-time 30 "$URL/api/vacances?z=C&fresh=1" | jq -c '{ok:(.ok//false),zone,stale,error,n:((.list//[])|length),first:((.list//[])[0]//null),next:((.list//[])[1]//null)}' 2>/dev/null || echo '{"ok":"err"}')
          echo "{\"now\":$(date +%s)000,\"keyStatus\":$KEY_STATUS,\"calProbe\":$CAL_PROBE,\"addProbe\":$ADD_PROBE,\"carProbe\":$CAR_PROBE,\"vacances\":$VAC,\"couples\":[" > diag/result.json
          first=1
          for id in $(echo "$IDX" | jq -r '.[]?'); do
            V=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/c:$id")
            SB=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/s:$id"); echo "$SB" | jq -e 'type=="object" and (has("errors")|not)' >/dev/null 2>&1 || SB=$(echo "$V" | jq -c '.subs//{}')
            WD=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/w:$id"); echo "$WD" | jq -e 'type=="object" and has("map")' >/dev/null 2>&1 || WD=$(echo "$V" | jq -c '{at:(.wAt//0),map:(.widgets//{})}')
            DN=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/d:$id"); echo "$DN" | jq -e 'type=="array"' >/dev/null 2>&1 || DN=$(echo "$V" | jq -c '.done//[]')
            TOK=$(echo "$V" | jq -r .token)
            KC=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/k:$id"); echo "$KC" | jq -e 'type=="object" and has("map")' >/dev/null 2>&1 || KC='{"at":0,"map":{}}'
            KS=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/ks:$id"); echo "$KS" | jq -e 'type=="object" and (has("errors")|not)' >/dev/null 2>&1 || KS='{}'
            LG=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/l:$id"); echo "$LG" | jq -e 'type=="array"' >/dev/null 2>&1 || LG='[]'
            AD=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/a:$id"); echo "$AD" | jq -e 'type=="array"' >/dev/null 2>&1 || AD='[]'
            CK=$(printf 'together-cal:%s' "$TOK" | sha256sum | cut -c1-32)
            CH=""
            for u in $(echo "$KC" | jq -r '.map|keys[]'); do
              CH="$CH$(curl -s -o /dev/null -I -w "%{http_code}" "$URL/cal/$id/$CK/$u.ics"),"
            done
            CAL=$(jq -nc --argjson kc "$KC" --argjson ks "$KS" --arg ch "${CH%,}" '{at:($kc.at//0),feeds:($kc.map|[.[]|{bytes:length,events:([scan("BEGIN:VEVENT")]|length)}]),http:($ch|split(",")),readAgoMin:($ks|[.[]|((now*1000-.)/60000|floor)])}')
            S=$(jq -nc --argjson v "$V" --argjson sb "$SB" --argjson wd "$WD" --argjson dn "$DN" --argjson cal "$CAL" --argjson lg "$LG" --argjson ad "$AD" '{adds:($ad|length),seen:(($v.seen//{})|to_entries|map({u:(.key[0:4]),v:.value.v,agoMin:((now*1000-.value.at)/60000|floor)})),log:($lg|.[-15:]|map({agoMin:((now*1000-.at)/60000|floor),k,t,to,st,rs})),subs:($sb|length),subsPer:($sb|[.[]|length]),subsBy:($sb|to_entries|map({u:(.key[0:4]),n:(.value|length)})),sched:(($v.sched//[])|length),nextAt:(($v.sched//[])|map(.at)|min),done:($dn|length),wAt:($wd.at//0),widgets:(($wd.map//{})|[.[]|{items:((.items//[])|length),wishes,fb}]),cal:$cal}')
            W=""
            for u in $(echo "$SB" | jq -r 'keys[]'); do
              C=$(curl -s "$URL/api/w?c=$id&t=$TOK&u=$u" | jq -c '{items:((.data.items//[])|length),at}')
              W="$W\"${u:0:4}…\":$C,"
            done
            # lecture d'une page de recette depuis le serveur (compteurs seulement)
            RP=""
            for ru in "https://www.marmiton.org/recettes/recette_pate-a-crepes_12372.aspx" "https://meilleurduchef.com/fr/dossier/pate-a-crepe.html" "https://dubocalalassiette.fr/blog/crepe-au-sucre-marmiton/"; do
              R=$(curl -s -X POST -H "Content-Type: application/json" --max-time 20 -d "$(jq -nc --arg c "$id" --arg t "$TOK" --arg u "$ru" '{couple:$c,token:$t,url:$u}')" "$URL/api/recipe" | jq -c --arg h "$(echo "$ru" | cut -d/ -f3)" '{h:$h,ok:(.ok//false),n:((.ing//[])|length),name:((.name//"")|.[0:40]),first:((.ing//[])[0]//""|.[0:40])}' 2>/dev/null || echo '{"ok":"err"}')
              RP="$RP$R,"
            done
            # lecture d'un lien partagé (envie de sortie) depuis le serveur (compteurs seulement)
            PG=""
            for pu in "https://fr.wikipedia.org/wiki/Zoo_de_Montpellier" "https://www.montpellier.fr/"; do
              R=$(curl -s -X POST -H "Content-Type: application/json" --max-time 20 -d "$(jq -nc --arg c "$id" --arg t "$TOK" --arg u "$pu" '{couple:$c,token:$t,url:$u}')" "$URL/api/page" | jq -c --arg h "$(echo "$pu" | cut -d/ -f3)" '{h:$h,ok:(.ok//false),title:((.title//"")|.[0:50]),place:((.place//"")|.[0:30]),kind:(.kind//"")}' 2>/dev/null || echo '{"ok":"err"}')
              PG="$PG$R,"
            done
            [ $first = 1 ] || echo "," >> diag/result.json; first=0
            echo "{\"id\":\"${id:0:4}…\",\"state\":$S,\"recipe\":[${RP%,}],\"page\":[${PG%,}],\"widgetApi\":{${W%,}}}" >> diag/result.json
          done
          echo "]}" >> diag/result.json
          cat diag/result.json
          git config user.name "together-bot"; git config user.email "together-bot@users.noreply.github.com"
          git add diag/result.json; git commit -m "Diagnostic notifications" && git push
