name: Diagnostic notifications
on:
  push:
    branches: [main]
    paths: ["diag/trigger.txt"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire l'état du serveur (compteurs seulement)
        run: |
          API=https://api.cloudflare.com/client/v4; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          URL=$(jq -r .url push.json)
          ACC=$(curl -s -H "$AUTH" "$API/accounts" | jq -r '.result[0].id')
          KV=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="together-push-KV") | .id' | head -1)
          KEY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/key")
          CAL_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/cal/zzzzzz/00000000000000000000000000000000/x.ics")
          ADD_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/add/zzzzzz/u/000000000000000000000000?t=x")
          CAR_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/car/zzzzzz/u/000000000000000000000000")
          WIMG_PROBE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/wimg?c=zzzzzz&t=x&k=abcd")
          IDX=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/index")
          # vacances scolaires lues par le serveur (données publiques : noms et dates)
          VAC=$(curl -s --max-time 30 "$URL/api/vacances?z=C&fresh=1" | jq -c '{ok:(.ok//false),zone,stale,error,n:((.list//[])|length),first:((.list//[])[0]//null),next:((.list//[])[1]//null)}' 2>/dev/null || echo '{"ok":"err"}')
          # carte 3D (version 69) : la bibliothèque MapLibre, les tuiles et les polices d'OpenFreeMap répondent-elles depuis Internet (codes, tailles, noms des couches)
          O="Origin: https://mohamedsahlilyon1-web.github.io"; T="${RUNNER_TEMP:-/tmp}"
          MLJ=$(curl -s -L --max-time 30 -o /dev/null -w "%{http_code}:%{size_download}" "https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"; true)
          MLC=$(curl -s -L --max-time 30 -o /dev/null -w "%{http_code}:%{size_download}" "https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"; true)
          TJ=$(curl -s --max-time 20 -H "$O" -D "$T/tj.h" "https://tiles.openfreemap.org/planet" || echo '{}')
          TJC=$(grep -i '^access-control-allow-origin' "$T/tj.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2 || true)
          TT=$(echo "$TJ" | jq -r '.tiles[0]//""' 2>/dev/null || true)
          XY=$(python3 -c "import math;n=2**14;la,lo=43.7384,7.4246;print(int((lo+180)/360*n),int((1-math.asinh(math.tan(math.radians(la)))/math.pi)/2*n))")
          TU=$(echo "$TT" | sed "s/{z}/14/;s/{x}/${XY% *}/;s/{y}/${XY#* }/")
          TL=$( [ -n "$TT" ] && curl -s --max-time 20 -H "$O" -D "$T/tl.h" -o "$T/tl.bin" -w "%{http_code}:%{size_download}" "$TU"; true)
          TLC=$(grep -i '^access-control-allow-origin' "$T/tl.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2 || true)
          TLK=$(python3 -c "import gzip,json,sys;d=open(sys.argv[1],'rb').read();d=gzip.decompress(d) if d[:2]==b'\x1f\x8b' else d;print(json.dumps({k:(k.encode() in d) for k in ['building','transportation','transportation_name','water','landuse','landcover','park','place','render_height','render_min_height','brunnel','name:fr','name:latin']}))" "$T/tl.bin" 2>/dev/null || echo '{}')
          GL=""
          for f in "Noto%20Sans%20Regular" "Noto%20Sans%20Bold" "Noto%20Sans%20Italic"; do GL="$GL\"$(curl -s --max-time 20 -H "$O" -o /dev/null -w "%{http_code}:%{size_download}" "https://tiles.openfreemap.org/fonts/$f/0-255.pbf"; true)\","; done
          MAP=$(echo "$TJ" | jq -c --arg mlj "$MLJ" --arg mlc "$MLC" --arg tjc "$TJC" --arg tl "$TL" --arg tlc "$TLC" --arg tt "$TT" --argjson tlk "$TLK" --argjson gl "[${GL%,}]" '{lib:{js:$mlj,css:$mlc},tilejson:{cors:$tjc,tiles:$tt,swCache:($tt|test("^https://tiles[.]openfreemap[.]org/planet/[0-9]{8}_[^/]+/[{]z[}]/[{]x[}]/[{]y[}][.]pbf$")),attribution:((.attribution//"")|length>0),minzoom,maxzoom,layers:[(.vector_layers//[])[]|.id]},tile:{z14:$tl,cors:$tlc,has:$tlk},glyphs:$gl}' 2>/dev/null || echo '{"err":1}')
          echo "{\"now\":$(date +%s)000,\"keyStatus\":$KEY_STATUS,\"calProbe\":$CAL_PROBE,\"addProbe\":$ADD_PROBE,\"carProbe\":$CAR_PROBE,\"wimgProbe\":$WIMG_PROBE,\"vacances\":$VAC,\"map\":$MAP,\"couples\":[" > diag/result.json
          first=1
          for id in $(echo "$IDX" | jq -r '.[]?'); do
            V=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/c:$id")
            SB=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/s:$id"); echo "$SB" | jq -e 'type=="object" and (has("errors")|not)' >/dev/null 2>&1 || SB=$(echo "$V" | jq -c '.subs//{}')
            WD=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/w:$id"); echo "$WD" | jq -e 'type=="object" and has("map")' >/dev/null 2>&1 || WD=$(echo "$V" | jq -c '{at:(.wAt//0),map:(.widgets//{})}')
            DN=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/d:$id"); echo "$DN" | jq -e 'type=="array"' >/dev/null 2>&1 || DN=$(echo "$V" | jq -c '.done//[]')
            TOK=$(echo "$V" | jq -r .token)
            KC=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/k:$id"); echo "$KC" | jq -e 'type=="object" and has("map")' >/dev/null 2>&1 || KC='{"at":0,"map":{}}'
            KS=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/ks:$id"); echo "$KS" | jq -e 'type=="object" and (has("errors")|not)' >/dev/null 2>&1 || KS='{}'
            LG=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/l:$id"); echo "$LG" | jq -e 'type=="array"' >/dev/null 2>&1 || LG='[]'
            AD=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/a:$id"); echo "$AD" | jq -e 'type=="array"' >/dev/null 2>&1 || AD='[]'
            # trafic en direct (version 68) : la clé TomTom est-elle là (jamais la clé elle-même), et les dernières vérifications (nombres seulement)
            TK=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/tk:$id" | jq -c '{has:((.k//"")|length>0),agoMin:(if (.at//0)>0 then ((now*1000-.at)/60000|floor) else null end)}' 2>/dev/null || echo '{"has":false}')
            TF=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/tf:$id" | jq -c 'if type=="object" and (has("errors")|not) then {n:length,checks:[.[]|{agoMin:((now*1000-(.at//0))/60000|floor),depInMin:(((.dep//0)-now*1000)/60000|floor),k,d,al,sent,err}]} else {n:0} end' 2>/dev/null || echo '{"n":0}')
            # carte 3D (version 69) : les itinéraires avec le trafic demandés aujourd'hui (nombres seulement)
            RT=$(curl -s -H "$AUTH" "$API/accounts/$ACC/storage/kv/namespaces/$KV/values/rt:$id" | jq -c 'if type=="object" and (has("errors")|not) then {day:.d,n:.n,routes:((.r//{})|length)} else {n:0} end' 2>/dev/null || echo '{"n":0}')
            CK=$(printf 'together-cal:%s' "$TOK" | sha256sum | cut -c1-32)
            CH=""
            for u in $(echo "$KC" | jq -r '.map|keys[]'); do
              CH="$CH$(curl -s -o /dev/null -I -w "%{http_code}" "$URL/cal/$id/$CK/$u.ics"),"
            done
            CAL=$(jq -nc --argjson kc "$KC" --argjson ks "$KS" --arg ch "${CH%,}" '{at:($kc.at//0),feeds:($kc.map|[.[]|{bytes:length,events:([scan("BEGIN:VEVENT")]|length)}]),http:($ch|split(",")),readAgoMin:($ks|[.[]|((now*1000-.)/60000|floor)])}')
            S=$(jq -nc --argjson v "$V" --argjson sb "$SB" --argjson wd "$WD" --argjson dn "$DN" --argjson cal "$CAL" --argjson lg "$LG" --argjson ad "$AD" '{adds:($ad|length),seen:(($v.seen//{})|to_entries|map({u:(.key[0:4]),v:.value.v,agoMin:((now*1000-.value.at)/60000|floor)})),log:($lg|.[-15:]|map({agoMin:((now*1000-.at)/60000|floor),k,t,to:((.to//"")[0:4]),st,rs})),subs:($sb|length),subsPer:($sb|[.[]|length]),subsBy:($sb|to_entries|map({u:(.key[0:4]),n:(.value|length)})),sched:(($v.sched//[])|length),nextAt:(($v.sched//[])|map(.at)|min),watch:(($v.watch//[])|length),own:(($v.own//{})|[.[]|length]),done:($dn|length),wAt:($wd.at//0),widgets:(($wd.map//{})|[.[]|{items:((.items//[])|length),wishes,fb}]),cal:$cal}')
            W=""
            for u in $(echo "$SB" | jq -r 'keys[]'); do
              WJ=$(curl -s "$URL/api/w?c=$id&t=$TOK&u=$u&diag=1")
              # les autres widgets (option 10) : seulement des nombres et des oui/non
              C=$(echo "$WJ" | jq -c '{items:((.data.items//[])|length),at,shop:(.data.shop.n//null),cd:((.data.cd//[])|length),sv:(.data.sv!=null),svImg:((.data.sv.k//"")!=""),idea:((.data.idea.sl//"")!=""),live:(.data.live!=null),late:((.data.late//[])|length),fer:((.data.fer//{})|length),vac:((.data.vac//[])|length)}' 2>/dev/null || echo '{"err":1}')
              K=$(echo "$WJ" | jq -r '.data.sv.k//""' 2>/dev/null)
              if [ -n "$K" ]; then IM=$(curl -s -o /dev/null -w "%{http_code}:%{size_download}" "$URL/api/wimg?c=$id&t=$TOK&k=$K"); C=$(echo "$C" | jq -c --arg im "$IM" '. + {img:$im}'); fi
              W="$W\"${u:0:4}…\":$C,"
            done
            # lecture d'une page de recette depuis le serveur (compteurs seulement)
            RP=""
            for ru in "https://www.marmiton.org/recettes/recette_pate-a-crepes_12372.aspx" "https://meilleurduchef.com/fr/dossier/pate-a-crepe.html" "https://dubocalalassiette.fr/blog/crepe-au-sucre-marmiton/"; do
              R=$(curl -s -X POST -H "Content-Type: application/json" --max-time 20 -d "$(jq -nc --arg c "$id" --arg t "$TOK" --arg u "$ru" '{couple:$c,token:$t,url:$u}')" "$URL/api/recipe" | jq -c --arg h "$(echo "$ru" | cut -d/ -f3)" '{h:$h,ok:(.ok//false),n:((.ing//[])|length),name:((.name//"")|.[0:40]),first:((.ing//[])[0]//""|.[0:40])}' 2>/dev/null || echo '{"ok":"err"}')
              RP="$RP$R,"
            done
            # lecture d'un lien partagé (envie de sortie) depuis le serveur (compteurs seulement)
            PG=""
            for pu in "https://fr.wikipedia.org/wiki/Zoo_de_Montpellier" "https://www.montpellier.fr/"; do
              R=$(curl -s -X POST -H "Content-Type: application/json" --max-time 20 -d "$(jq -nc --arg c "$id" --arg t "$TOK" --arg u "$pu" '{couple:$c,token:$t,url:$u}')" "$URL/api/page" | jq -c --arg h "$(echo "$pu" | cut -d/ -f3)" '{h:$h,ok:(.ok//false),title:((.title//"")|.[0:50]),place:((.place//"")|.[0:30]),kind:(.kind//"")}' 2>/dev/null || echo '{"ok":"err"}')
              PG="$PG$R,"
            done
            # « Tout marche ? » vu du serveur (option 12) : versions, notifications, widget, calendrier, Siri ; prénoms et identifiants jamais écrits
            HL=$(curl -s -X POST -H "Content-Type: application/json" -H "Origin: https://mohamedsahlilyon1-web.github.io" --max-time 20 -d "$(jq -nc --arg c "$id" --arg t "$TOK" '{couple:$c,token:$t}')" "$URL/api/health" | jq -c '{ok:(.ok//false),gone:(.gone//0),phones:((.u//{})|to_entries|map({u:(.key[0:4]),v:.value.v,agoMin:(if .value.at>0 then ((now*1000-.value.at)/60000|floor) else null end),dev:(.value.dev//""),subs:(.value.subs|length),subsDev:(.value.subs|map(.dev)),w:(if .value.w then {agoMin:((now*1000-.value.w.at)/60000|floor),v:.value.w.v} else null end),calAgoMin:(if .value.cal>0 then ((now*1000-.value.cal)/60000|floor) else null end),addAgoMin:(if .value.add>0 then ((now*1000-.value.add)/60000|floor) else null end),carAgoMin:(if .value.car>0 then ((now*1000-.value.car)/60000|floor) else null end),pushOkAgoMin:(if .value.ok>0 then ((now*1000-.value.ok)/60000|floor) else null end),pushBad:(.value.bad.st//null)}))}' 2>/dev/null || echo '{"ok":"err"}')
            [ $first = 1 ] || echo "," >> diag/result.json; first=0
            echo "{\"id\":\"${id:0:4}…\",\"state\":$S,\"traffic\":{\"key\":$TK,\"tf\":$TF,\"rt\":$RT},\"health\":$HL,\"recipe\":[${RP%,}],\"page\":[${PG%,}],\"widgetApi\":{${W%,}}}" >> diag/result.json
          done
          echo "]}" >> diag/result.json
          cat diag/result.json
          git config user.name "together-bot"; git config user.email "together-bot@users.noreply.github.com"
          git add diag/result.json; git commit -m "Diagnostic notifications" && git push
