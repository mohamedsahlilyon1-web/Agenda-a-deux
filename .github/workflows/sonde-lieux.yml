name: Sonde lieux (OpenStreetMap)
on:
  push:
    branches: [main]
    paths: ["diag/lieux.txt"]
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ce que Photon et Overpass répondent (données publiques)
        run: |
          O="Origin: https://mohamedsahlilyon1-web.github.io"; T="${RUNNER_TEMP:-/tmp}"
          Q=$(head -1 diag/lieux.txt | cut -d'|' -f2 | sed 's/ /%20/g')
          curl -s --max-time 30 -H "$O" -D "$T/ph.h" "https://photon.komoot.io/api/?q=$Q&lang=fr&limit=8&lat=43.61&lon=3.88" -o "$T/ph.json" || true
          PHC=$(grep -i '^access-control-allow-origin' "$T/ph.h" | tr -d '\r' | cut -d' ' -f2 || true)
          echo "[" > "$T/out.json"; first=1
          for row in $(jq -r '.features[]?.properties | "\(.osm_type):\(.osm_id)"' "$T/ph.json"); do
            t=${row%%:*}; id=${row#*:}; case $t in N) k=node;; W) k=way;; R) k=relation;; *) continue;; esac
            OPS=$(curl -s --max-time 30 -H "$O" -D "$T/op.h" -o "$T/op.json" -w "%{http_code}" --data-urlencode "data=[out:json][timeout:10];$k($id);out tags center 1;" "https://overpass-api.de/api/interpreter" || echo 0)
            OPT=$(jq -c '.elements[0].tags//{}' "$T/op.json" 2>/dev/null || echo '{}'); OPH=$(head -c 160 "$T/op.json" | tr -d '"\n\r' | tr -cd '[:print:]')
            OSS=$(curl -s --max-time 30 -H "$O" -D "$T/os.h" -o "$T/os.json" -w "%{http_code}" "https://api.openstreetmap.org/api/0.6/$k/$id.json" || echo 0)
            OST=$(jq -c '.elements[0].tags//{}' "$T/os.json" 2>/dev/null || echo '{}'); OSC=$(grep -i '^access-control-allow-origin' "$T/os.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2 || true)
            [ $first = 1 ] || echo "," >> "$T/out.json"; first=0
            jq -n --arg row "$row" --arg ops "$OPS" --arg oph "$OPH" --arg oss "$OSS" --arg osc "$OSC" --argjson opt "$OPT" --argjson ost "$OST" '{osm:$row,overpass:{st:$ops,head:$oph,tags:$opt},osmapi:{st:$oss,cors:$osc,tags:$ost}}' >> "$T/out.json"; sleep 1
          done
          echo "]" >> "$T/out.json"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          DQ="data=[out:json][timeout:10];way(112734758);out tags center 1;"
          V1=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "$O" -H "Accept: application/json" -A "$UA" --data-urlencode "$DQ" "https://overpass-api.de/api/interpreter" || echo 0)
          V2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "$O" -H "Accept: */*" -A "$UA" --data-urlencode "$DQ" "https://overpass-api.de/api/interpreter" || echo 0)
          V3=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "$O" -H "Accept: application/json" -A "$UA" --data-urlencode "$DQ" "https://overpass.kumi.systems/api/interpreter" || echo 0)
          V4=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "$O" -H "Accept: application/json" -A "$UA" --data-urlencode "$DQ" "https://maps.mail.ru/osm/tools/overpass/api/interpreter" || echo 0)
          V5=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -H "$O" -H "Accept: application/json" -A "$UA" --data-urlencode "$DQ" "https://overpass.private.coffee/api/interpreter" || echo 0)
          echo "{\"apiJson\":\"$V1\",\"apiAny\":\"$V2\",\"kumi\":\"$V3\",\"mailru\":\"$V4\",\"coffee\":\"$V5\"}" > "$T/ov.json"
          LON=$(jq -r '.features[0].geometry.coordinates[0]' "$T/ph.json"); LAT=$(jq -r '.features[0].geometry.coordinates[1]' "$T/ph.json")
          PX=$(curl -s --max-time 30 -H "$O" -D "$T/px.h" "https://api.panoramax.xyz/api/search?place_position=$LON,$LAT&place_distance=2-50&place_fov_tolerance=60&limit=6" | jq -c '{n:((.features//[])|length),pics:[(.features//[])[]|{id,dt:.properties.datetime,thumb:(.assets.thumb.href//null),sd:(.assets.sd.href//null),prov:(.providers[0].name//null)}]}' 2>/dev/null || echo '{"err":1}')
          PXB=$(curl -s --max-time 30 -H "$O" "https://api.panoramax.xyz/api/search?bbox=$(python3 -c "print(f'{$LON-0.0008},{$LAT-0.0006},{$LON+0.0008},{$LAT+0.0006}')")&limit=6" | jq -c '{n:((.features//[])|length)}' 2>/dev/null || echo '{"err":1}')
          PXC=$(grep -i '^access-control-allow-origin' "$T/px.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2 || true)
          RT=$(curl -s --max-time 30 -H "$O" -D "$T/rt.h" "https://router.project-osrm.org/route/v1/driving/3.8767,43.6108;$LON,$LAT?overview=false" | jq -c '{code,km:((.routes[0].distance//0)/1000),min:((.routes[0].duration//0)/60)}' 2>/dev/null || echo '{"err":1}')
          RTC=$(grep -i '^access-control-allow-origin' "$T/rt.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2 || true)
          echo "{\"lon\":$LON,\"lat\":$LAT,\"panoramax\":$PX,\"panoramaxBbox\":$PXB,\"panoramaxCors\":\"$PXC\",\"osrm\":$RT,\"osrmCors\":\"$RTC\"}" > "$T/px.json"
          OPC=$(grep -i '^access-control-allow-origin' "$T/op.h" 2>/dev/null | tr -d '\r' | cut -d' ' -f2 || true)
          jq -n --arg phc "$PHC" --arg opc "$OPC" --slurpfile ph "$T/ph.json" --slurpfile tg "$T/out.json" --slurpfile ov "$T/ov.json" --slurpfile px "$T/px.json" '{at:(now|floor),photonCors:$phc,overpassCors:$opc,
            photon:[$ph[0].features[]?.properties|{name,osm_type,osm_id,osm_key,osm_value,type,street,housenumber,postcode,city}],details:$tg[0],overpassBrowser:$ov[0],photos:$px[0]}' > diag/lieux.json
          git config user.name "together-diag"; git config user.email "diag@users.noreply.github.com"
          git add diag/lieux.json && git commit -m "Sonde lieux" && git push || true
